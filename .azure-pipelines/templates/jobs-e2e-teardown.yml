# Deletes the resource group of an e2e run (scripts/e2e-resource-group.ps1). Also runs on failure
# or cancellation, but not when setup never ran.

parameters:
  - name: azureServiceConnection
    type: string
  # E2E_SUITE of scripts/provision.ps1.
  - name: suite
    type: string
  # The jobs to wait for; must include setup.
  - name: dependsOn
    type: object

jobs:
  - job: teardown
    displayName: Delete test resources
    dependsOn: ${{ parameters.dependsOn }}
    condition: and(always(), ne(dependencies.setup.result, 'Skipped'))
    timeoutInMinutes: 15
    cancelTimeoutInMinutes: 15
    pool:
      vmImage: ubuntu-24.04
    steps:
      - checkout: self
        fetchDepth: '1'
        persistCredentials: false
      - task: AzureCLI@2
        displayName: Delete resource group if it exists
        condition: always()
        inputs:
          azureSubscription: ${{ parameters.azureServiceConnection }}
          scriptType: pscore
          scriptLocation: inlineScript
          visibleAzLogin: false
          inlineScript: |
            $ErrorActionPreference = 'Stop'
            # Recompute independently of setup outputs, including on cancellation.
            $rg = & ./.azure-pipelines/scripts/e2e-resource-group.ps1 -Suite $env:E2E_SUITE -RunId $env:E2E_RUN_ID
            $exists = az group exists --name $rg --only-show-errors
            if ($LASTEXITCODE -ne 0) { throw "Could not check resource group $rg." }
            if ($exists -eq 'true') {
              az group delete --name $rg --yes --no-wait --only-show-errors
              if ($LASTEXITCODE -ne 0) { throw "Could not queue deletion of $rg." }
            }
        env:
          E2E_SUITE: ${{ parameters.suite }}
          E2E_RUN_ID: $(System.TeamProjectId)-$(Build.BuildId)
