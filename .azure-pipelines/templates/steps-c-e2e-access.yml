# Sets the secret variables hubAccessToken and eventHubsAccessToken for a C e2e job and, with
# sharedKeyVault, writes its shared-environment test configuration to
# $(Agent.TempDirectory)/test-config (scripts/get-c-e2e-access.ps1). The job's later steps run
# without the Azure CLI login, which this task removes.

parameters:
  - name: azureServiceConnection
    type: string
  # Empty for a provisioned environment.
  - name: sharedKeyVault
    type: string
    default: ''
  # The device index is deviceIndexOs * 4 + deviceIndexGroup.
  - name: deviceIndexOs
    type: string
    default: $(osIndex)
  - name: deviceIndexGroup
    type: string
    default: $(groupIndex)

steps:
  - task: AzureCLI@2
    ${{ if parameters.sharedKeyVault }}:
      displayName: Get access tokens and a shared-environment device
    ${{ else }}:
      displayName: Get IoT Hub and Event Hubs access tokens
    inputs:
      azureSubscription: ${{ parameters.azureServiceConnection }}
      scriptType: pscore
      scriptLocation: scriptPath
      scriptPath: .azure-pipelines/scripts/get-c-e2e-access.ps1
      visibleAzLogin: false
    env:
      ${{ if parameters.sharedKeyVault }}:
        E2E_SHARED_KEY_VAULT: ${{ parameters.sharedKeyVault }}
        E2E_DEVICE_INDEX_OS: ${{ parameters.deviceIndexOs }}
        E2E_DEVICE_INDEX_GROUP: ${{ parameters.deviceIndexGroup }}
        E2E_RUN_ID: $(Build.BuildId)-$(System.JobAttempt)
        E2E_CONFIG_DIRECTORY: $(Agent.TempDirectory)/test-config
