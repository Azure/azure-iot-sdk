parameters:
  - name: azureServiceConnection
    type: string
  - name: azureLocation
    type: string
  - name: suite
    type: string
    values: [standard, csr, longhaul]
  - name: os
    type: string
    default: ubuntu-24.04
  - name: durationMinutes
    type: number
    default: 320
  - name: minSuccessPercent
    type: number
    default: 99
  - name: maxMemoryGrowthMb
    type: number
    default: 64

jobs:
  - ${{ if ne(parameters.suite, 'longhaul') }}:
      - job: changes
        displayName: Detect relevant changes
        pool:
          vmImage: ubuntu-latest
        steps:
          - template: steps-detect-changes.yml
            parameters:
              includeCommon: true
              ${{ if eq(parameters.suite, 'csr') }}:
                workflow: ci-dotnet-e2e-csr
              ${{ else }}:
                workflow: ci-dotnet

  - job: setup
    displayName: Provision test resources
    ${{ if ne(parameters.suite, 'longhaul') }}:
      dependsOn: changes
      condition: and(succeeded(), eq(dependencies.changes.outputs['filter.relevant'], 'true'))
    timeoutInMinutes: 30
    pool:
      vmImage: ubuntu-24.04
    variables:
      - template: variables-e2e-resource-group.yml
        parameters:
          suite: ${{ parameters.suite }}
    steps:
      - checkout: self
        persistCredentials: false
      - template: steps-e2e-framework.yml
        parameters:
          ${{ if eq(parameters.suite, 'csr') }}:
            revision: 9109e1ce6d9d19bbc750f4715b85db1f5167190e
          ${{ else }}:
            revision: b96d2aa2eb2b36e1e4dfbdb04aa56cf3dccecf8a
      - task: AzureCLI@2
        name: configure
        displayName: Provision and encrypt test configuration
        inputs:
          azureSubscription: ${{ parameters.azureServiceConnection }}
          scriptType: pscore
          scriptLocation: scriptPath
          scriptPath: .azure-pipelines/scripts/provision.ps1
          visibleAzLogin: false
        env:
          E2E_SUITE: ${{ parameters.suite }}
          E2E_LOCATION: ${{ parameters.azureLocation }}
          E2E_RESOURCE_GROUP: $(e2eResourceGroup)
          E2E_FRAMEWORK_ROOT: $(Agent.TempDirectory)/iot-sdks-e2e-fx
          E2E_CONFIG_DIRECTORY: $(Agent.TempDirectory)/test-config
          LONGHAUL_DURATION_MINUTES: ${{ parameters.durationMinutes }}
          LONGHAUL_MIN_SUCCESS_PERCENT: ${{ parameters.minSuccessPercent }}
          LONGHAUL_MAX_MANAGED_MEMORY_GROWTH_MB: ${{ parameters.maxMemoryGrowthMb }}
      - task: PublishPipelineArtifact@1
        displayName: Publish encrypted test configuration
        inputs:
          targetPath: $(Agent.TempDirectory)/test-config/test-config.encrypted
          artifact: e2e-test-config

  - job: test
    displayName: Run ${{ parameters.suite }} tests
    dependsOn: setup
    variables:
      configKey: $[ dependencies.setup.outputs['configure.configKey'] ]
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    ${{ if eq(parameters.suite, 'longhaul') }}:
      timeoutInMinutes: 360
      pool:
        vmImage: ${{ parameters.os }}
    ${{ else }}:
      timeoutInMinutes: 30
      strategy:
        ${{ if eq(parameters.suite, 'csr') }}:
          maxParallel: 1
        matrix:
          Linux:
            vmImage: ubuntu-24.04
            deviceIndex: 0
          Windows:
            vmImage: windows-latest
            deviceIndex: 1
      pool:
        vmImage: $(vmImage)
    steps:
      - template: steps-dotnet.yml
      - pwsh: dotnet build Project.slnx
        displayName: Build tests
        workingDirectory: dotnet
      - task: DownloadPipelineArtifact@2
        displayName: Download encrypted test configuration
        inputs:
          buildType: current
          artifactName: e2e-test-config
          targetPath: $(Agent.TempDirectory)/test-config
      # The TPM tests run against the TSS.MSR TPM simulator that the azure-iot-sdk-csharp repo
      # publishes. It only runs on Windows; elsewhere those tests skip themselves.
      - ${{ if ne(parameters.suite, 'longhaul') }}:
          - pwsh: |
              $ErrorActionPreference = 'Stop'
              $simulatorPath = Join-Path $env:AGENT_TEMPDIRECTORY 'tpmsim'
              New-Item -ItemType Directory -Force -Path $simulatorPath | Out-Null
              $files = @(
                @{ Name = 'Simulator.exe'; Commit = 'ef909004bcc029c66b53e3abd94d8cb253dff4e0'; Sha256 = '34552FC49063BD7578C695370DD056BE442F9E06029E7C94BEA34B2EFCDAF755' },
                @{ Name = 'Tpm.dll'; Commit = 'f336c463c46032a69250ee91aff4e9d328a9e83e'; Sha256 = 'BCF66E0954FC25B03BEFC464F22695841E287B64633134683D0146857833EFA4' }
              )
              foreach ($file in $files) {
                $destination = Join-Path $simulatorPath $file.Name
                Invoke-WebRequest -Uri "https://raw.githubusercontent.com/Azure/azure-iot-sdk-csharp/$($file.Commit)/security/tpm/samples/SecurityProviderTpmSimulator/TpmSimulator/$($file.Name)" -OutFile $destination
                $actual = (Get-FileHash -Algorithm SHA256 -Path $destination).Hash
                if ($actual -ne $file.Sha256) { throw "$($file.Name) has SHA256 $actual, expected $($file.Sha256)." }
              }
              Write-Host "##vso[task.setvariable variable=TPM_SIMULATOR_PATH]$simulatorPath"
            displayName: Download TPM simulator
            condition: and(succeeded(), eq(variables['Agent.OS'], 'Windows_NT'))
      - task: PowerShell@2
        displayName: Run tests
        inputs:
          pwsh: true
          targetType: filePath
          filePath: .azure-pipelines/scripts/run-e2e.ps1
        env:
          CONFIG_KEY: $(configKey)
          E2E_CONFIG_DIRECTORY: $(Agent.TempDirectory)/test-config
          E2E_SUITE: ${{ parameters.suite }}
          ${{ if ne(parameters.suite, 'longhaul') }}:
            DEVICE_INDEX: $(deviceIndex)
          LONGHAUL_DURATION_MINUTES: ${{ parameters.durationMinutes }}
          LONGHAUL_MIN_SUCCESS_PERCENT: ${{ parameters.minSuccessPercent }}
          LONGHAUL_MAX_MANAGED_MEMORY_GROWTH_MB: ${{ parameters.maxMemoryGrowthMb }}
      - ${{ if eq(parameters.suite, 'standard') }}:
          - task: PublishTestResults@2
            displayName: Publish unit test results
            condition: always()
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: '$(Common.TestResultsDirectory)/unit/**/*.trx'
              testRunTitle: .NET unit tests ($(Agent.OS))
              mergeTestResults: true
              failTaskOnFailedTests: true
              failTaskOnMissingResultsFile: true
      - task: PublishTestResults@2
        displayName: Publish integration test results
        condition: always()
        inputs:
          testResultsFormat: VSTest
          testResultsFiles: '$(Common.TestResultsDirectory)/integration/**/*.trx'
          testRunTitle: .NET ${{ parameters.suite }} integration tests ($(Agent.OS))
          mergeTestResults: true
          failTaskOnFailedTests: true
          failTaskOnMissingResultsFile: true
      - ${{ if ne(parameters.suite, 'longhaul') }}:
          - task: PublishCodeCoverageResults@2
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: '$(Common.TestResultsDirectory)/**/coverage.cobertura.xml'
              failIfCoverageEmpty: true
      - ${{ if eq(parameters.suite, 'longhaul') }}:
          - pwsh: |
              $reports = @(Get-ChildItem "$env:BUILD_SOURCESDIRECTORY/longhaul-results" -Filter *.md -ErrorAction SilentlyContinue)
              if ($reports.Count -eq 0) { Write-Warning 'Longhaul ended without an analysis report; see the test log.' }
              foreach ($report in $reports) {
                Write-Host "##vso[task.uploadsummary]$($report.FullName)"
              }
            displayName: Publish longhaul analysis
            condition: always()
          - task: PublishPipelineArtifact@1
            displayName: Publish longhaul analysis files
            condition: always()
            inputs:
              targetPath: $(Build.SourcesDirectory)/longhaul-results
              artifact: longhaul-UnifiedMQTTv3Hub
      - task: PublishPipelineArtifact@1
        displayName: Publish raw test results
        condition: always()
        inputs:
          targetPath: $(Common.TestResultsDirectory)
          artifact: test-report-$(Agent.OS)

  - template: jobs-e2e-teardown.yml
    parameters:
      azureServiceConnection: ${{ parameters.azureServiceConnection }}
      suite: ${{ parameters.suite }}
      dependsOn: [setup, test]

  - ${{ if ne(parameters.suite, 'longhaul') }}:
      - template: jobs-e2e-gate.yml
        parameters:
          displayName: ${{ parameters.suite }} gate
          jobs: [setup, test]
