trigger:
  branches:
    include: [main, releases/public-preview]
  paths:
    include: [c/**, common/**, .azure-pipelines/**, .github/workflows/ci-c-e2e.yml]
    exclude: [c/**/*.md, common/**/*.md]
# No PR path filter: as a required check this pipeline reports on every PR and skips the tests
# itself when nothing relevant changed.
pr:
  autoCancel: true
  branches:
    include: ['*']
schedules:
  - cron: '0 11 * * *'
    displayName: Nightly end-to-end tests
    branches:
      include: [main]
    always: true

parameters:
  - name: azureServiceConnection
    type: string
    default: aziotclb service connection
  - name: azureLocation
    type: string
    default: eastus2euap

jobs:
  - template: templates/jobs-c-e2e.yml
    parameters:
      azureServiceConnection: ${{ parameters.azureServiceConnection }}
      azureLocation: ${{ parameters.azureLocation }}
