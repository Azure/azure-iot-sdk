trigger:
  branches:
    include: [main]
pr:
  autoCancel: true
  branches:
    include: ['*']
schedules:
  - cron: '0 13 * * *'
    displayName: Daily advisory scan
    branches:
      include: [main]
    always: true

jobs:
  - template: templates/jobs-check.yml
    parameters:
      check: vulnerable-packages
