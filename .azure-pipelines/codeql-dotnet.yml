trigger:
  branches:
    include: [main]
pr:
  autoCancel: true
  branches:
    include: ['*']
schedules:
  - cron: '0 12 * * 1'
    displayName: Weekly CodeQL scan
    branches:
      include: [main]
    always: true

jobs:
  - template: templates/jobs-check.yml
    parameters:
      check: codeql
