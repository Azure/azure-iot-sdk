trigger:
  branches:
    include: [main]
  paths:
    include: [dotnet/**, common/**, .azure-pipelines/**, .github/workflows/ci-dotnet-e2e-csr.yml]
    exclude: [dotnet/**/*.md, common/**/*.md]
pr:
  autoCancel: true
  branches:
    include: ['*']
  paths:
    include: [dotnet/**, common/**, .azure-pipelines/**, .github/workflows/ci-dotnet-e2e-csr.yml]
    exclude: [dotnet/**/*.md, common/**/*.md]
schedules:
  - cron: '0 11 * * *'
    displayName: Nightly certificate-management tests
    branches:
      include: [main]
    always: true

parameters:
  - name: azureServiceConnection
    type: string
    default: aziotclb service connection
  - name: azureLocation
    type: string
    default: eastus2euap

jobs:
  - template: templates/jobs-e2e.yml
    parameters:
      azureServiceConnection: ${{ parameters.azureServiceConnection }}
      azureLocation: ${{ parameters.azureLocation }}
      suite: csr
