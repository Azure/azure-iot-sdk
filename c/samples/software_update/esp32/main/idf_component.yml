## Managed-component dependencies for the ESP32 software updates sample's main component.
dependencies:
  idf: ">=6.0"
  ## esp-mqtt moved out of the IDF core tree in v6.0 and is now a managed
  ## component. The component it installs is named `mqtt`.
  ## Exact pin: the version this sample is built and tested against.
  espressif/mqtt: "==1.1.0"
