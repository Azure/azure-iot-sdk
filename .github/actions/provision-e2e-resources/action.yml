# Reusable step (analog of an e2e-fx `steps-create-azure-resources.yaml`
# template): provisions a fresh Azure resource group + IoT Hub / DPS / devices
# (optionally a Device Update account/instance) via the shared iot-sdks-e2e-fx
# PowerShell module, and writes a test-config script for the consumer.
#
# Reusable by any language pipeline (C, dotnet, ...): override `config-cmdlet`
# / `config-target` / `out-file` to emit the test config in the shape that
# pipeline expects. The caller must run `azure/login` BEFORE this step.
name: Provision e2e Azure resources
description: Provision a resource group + IoT Hub/DPS/devices (optionally ADU) and emit a test-config script.

inputs:
  rg-name:
    description: >-
      Exact resource group name to provision into. PREFERRED over `rg-prefix`: a caller that
      derives the name from the run itself (e.g. CSDKE2EFast-<run_id>-<run_attempt>) can compute
      the same name in its teardown job WITHOUT reading this action's `resource-group` output --
      which a CANCELLED provisioning job never publishes, orphaning the group. When empty, falls
      back to `rg-prefix` + a random GUID.
    required: false
    default: ''
  rg-prefix:
    description: >-
      Resource group name prefix (e.g. CSDKE2EFast-) used to generate a random name. Ignored when
      `rg-name` is set. Required only when `rg-name` is empty.
    required: false
    default: ''
  azure-location:
    description: >-
      Azure region to provision in. ADU is only available in a subset (EastUS);
      certificate management (ADR) is available in EastUS too. Avoid canary
      regions (e.g. centraluseuap): Microsoft.DeviceRegistry there rejects
      namespace creation from the CI service principal with
      400 ResourceCreationValidateFailed.
    required: false
    default: EastUS
  enable-adu:
    description: New-AzIotTestEnvironment -EnableADU value (None|Gen1|Gen2).
    required: false
    default: None
  enable-certificate-management:
    description: >-
      When 'true', pass -EnableCertificateManagement to New-AzIotTestEnvironment so DPS is
      provisioned with Azure Device Registration (ADR) integration -- the enrollments can then
      issue an operational certificate in response to a device CSR (required by the CSR e2e).
    required: false
    default: 'false'
  enable-file-upload:
    description: >-
      When 'true', pass -EnableFileUpload to New-AzIotTestEnvironment so an Azure Storage account
      is created and associated with the IoT Hub for file upload (required by the file-upload e2e).
    required: false
    default: 'false'
  iothub-x509-thumbprint-devices:
    description: Number of x509-thumbprint IoT Hub devices to create.
    required: false
    default: '1'
  dps-x509-individual-enrollments:
    description: Number of DPS x509 individual enrollments to create.
    required: false
    default: '1'
  dps-x509-group-enrollment-devices:
    description: >-
      Number of devices for a DPS x509 ENROLLMENT GROUP linked to the provisioned signing CA
      (New-AzIotTestEnvironment -DpsX509GroupEnrollmentDevices). A value > 0 creates the group
      whose issuer certificate is emitted as PROVISIONING_ROOT_CERT(_KEY); required for the CSR
      e2e, where the device presents a leaf signed by that CA and DPS issues its operational cert.
    required: false
    default: '0'
  config-cmdlet:
    description: Cmdlet that renders the per-pipeline test config (e.g. New-AzIotCSDKE2ETestConfig).
    required: false
    default: New-AzIotCSDKE2ETestConfig
  config-target:
    description: Test-config target shell (powershell|bash).
    required: false
    default: powershell
  out-file:
    description: Path to write the generated test-config script to.
    required: false
    default: test_config/set_test_env_vars.ps1

outputs:
  resource-group:
    description: Name of the provisioned resource group (for teardown).
    value: ${{ steps.provision.outputs.rg }}

runs:
  using: composite
  steps:
    - name: Provision resources
      id: provision
      uses: azure/powershell@v3
      env:
        # Passed via env (not string-interpolated into the script) so the value is
        # data, never code.
        AZ_IOT_RG_NAME: ${{ inputs.rg-name }}
      with:
        azPSVersion: "latest"
        inlineScript: |
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/Azure/iot-sdks-e2e-fx/refs/heads/timtay/params/scripts/Azure.Iot.Sdk.Test.psm1" -OutFile "./Azure.Iot.Sdk.Test.psm1"
          Import-Module "./Azure.Iot.Sdk.Test.psm1"
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent "${{ inputs.out-file }}") | Out-Null
          if (-not [string]::IsNullOrWhiteSpace($env:AZ_IOT_RG_NAME)) {
            # Caller-computed (deterministic) name -- it can reproduce this exact
            # name in teardown without depending on this job's outputs.
            # Azure allows alphanumerics, underscore, parentheses, hyphen and
            # period, up to 90 characters, but the name may NOT end in a period.
            # Anchored with \z, not $, so a trailing newline cannot slip through.
            if ($env:AZ_IOT_RG_NAME -notmatch '^[A-Za-z0-9._()-]{0,89}[A-Za-z0-9_()-]\z') {
              throw "rg-name '$($env:AZ_IOT_RG_NAME)' is not a valid Azure resource group name."
            }
            $ResourceGroupName = $env:AZ_IOT_RG_NAME
          } elseif (-not [string]::IsNullOrWhiteSpace("${{ inputs.rg-prefix }}")) {
            $ResourceGroupName = New-AzureResourceGroupName -Prefix "${{ inputs.rg-prefix }}"
          } else {
            throw "Either 'rg-name' or 'rg-prefix' must be provided."
          }
          # Publish the RG name up-front so teardown can delete it even if the
          # provisioning below fails part-way through. NOTE: job outputs are NOT
          # propagated when the job is CANCELLED, so this output alone is not a
          # reliable teardown handle -- prefer a deterministic 'rg-name'.
          "rg=$ResourceGroupName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $TestEnvInfo = New-AzIotTestEnvironment -AzureLocation "${{ inputs.azure-location }}" -ResourceGroup $ResourceGroupName `
            -IotHubX509ThumbprintDevices ${{ inputs.iothub-x509-thumbprint-devices }} `
            -DpsX509IndividualEnrollments ${{ inputs.dps-x509-individual-enrollments }} `
            -DpsX509GroupEnrollmentDevices ${{ inputs.dps-x509-group-enrollment-devices }} `
            -EnableADU ${{ inputs.enable-adu }} ${{ inputs.enable-certificate-management == 'true' && '-EnableCertificateManagement' || '' }} ${{ inputs.enable-file-upload == 'true' && '-EnableFileUpload' || '' }}
          & "${{ inputs.config-cmdlet }}" -TestEnvInfo $TestEnvInfo -Target ${{ inputs.config-target }} -OutFile "${{ inputs.out-file }}"

          # New-AzIotTestEnvironment -EnableFileUpload attaches the storage account
          # and container, but leaves the hub's enableFileUploadNotifications at its
          # default of FALSE. Without it IoT Hub accepts a device's completion
          # notification and then publishes nothing, so the service-side
          # file-notification endpoint stays silent and an e2e test can only verify
          # the device half of an upload. Turn it on here (the shared framework does
          # not expose a switch for it).
          if ("${{ inputs.enable-file-upload }}" -eq "true") {
            $HostNamePair = ($TestEnvInfo.IotHub.ConnectionString -split ';' `
              | Where-Object { $_ -like 'HostName=*' } | Select-Object -First 1)
            if ([string]::IsNullOrWhiteSpace($HostNamePair)) {
              throw "Could not parse HostName from the IoT Hub connection string."
            }
            $IotHubName = ($HostNamePair -replace '^HostName=', '').Split('.')[0]
            Write-Host "Enabling IoT Hub file-upload notifications ($IotHubName)"
            az iot hub update --name $IotHubName --resource-group $ResourceGroupName `
              --fileupload-notifications true --only-show-errors | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to enable file-upload notifications on $IotHubName."
            }
          }

          # When an X.509 enrollment GROUP was provisioned, the group's issuer is
          # an INTERMEDIATE CA (created by the framework and signed by the root);
          # PROVISIONING_ROOT_CERT is NOT that issuer, so a root-signed leaf would
          # be rejected. Emit a bootstrap device identity under the group (a leaf
          # signed by the group's issuer CA) as a full chain (leaf + issuer CA +
          # root) + key + registration id, for consumers driving a CSR flow. The
          # config cmdlets do not emit group X.509 identities, so do it here.
          # Guarded on GroupX509 presence -> no-op for callers without a group.
          if ($TestEnvInfo.Dps.Enrollments.GroupX509.Count -gt 0) {
            $group = $TestEnvInfo.Dps.Enrollments.GroupX509[0]
            # Reuse a device identity minted during provisioning; mint one only if
            # the group has none (both paths produce a leaf signed by the issuer CA).
            if ($group.Identities.Count -gt 0) {
              $identity = $group.Identities[0]
            } else {
              $identity = $group.AddIdentity("csr-bootstrap-$(Get-Random -Minimum 100000 -Maximum 999999)", [timespan]::FromDays(2))
            }
            $regId = $identity.Id
            $chainPem = $identity.Certificate.ToPem() + "`n" + $group.Certificate.ToPem() + "`n" + $TestEnvInfo.Dps.RootCaCertificates[0].ToPem()
            $keyPem = $identity.Certificate.PrivateKey.ToRsaPkcs1Pem()
            $certB64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($chainPem))
            $keyB64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($keyPem))
            if ("${{ inputs.config-target }}" -eq "powershell") {
              Add-Content -Path "${{ inputs.out-file }}" -Value "`$env:IOT_DPS_GROUP_X509_CERTIFICATE = `"$certB64`""
              Add-Content -Path "${{ inputs.out-file }}" -Value "`$env:IOT_DPS_GROUP_X509_KEY = `"$keyB64`""
              Add-Content -Path "${{ inputs.out-file }}" -Value "`$env:IOT_DPS_GROUP_X509_REGISTRATION_ID = `"$regId`""
            } else {
              Add-Content -Path "${{ inputs.out-file }}" -Value "export IOT_DPS_GROUP_X509_CERTIFICATE=`"$certB64`""
              Add-Content -Path "${{ inputs.out-file }}" -Value "export IOT_DPS_GROUP_X509_KEY=`"$keyB64`""
              Add-Content -Path "${{ inputs.out-file }}" -Value "export IOT_DPS_GROUP_X509_REGISTRATION_ID=`"$regId`""
            }
            Write-Host "Emitted X.509 group bootstrap identity: $regId"
          }
