# Reusable step (analog of an e2e-fx `steps-create-azure-resources.yaml`
# template): provisions a fresh Azure resource group + IoT Hub / DPS / devices
# (optionally a Device Update account/instance) via the shared iot-sdks-e2e-fx
# PowerShell module, and writes a test-config script for the consumer.
#
# Reusable by any language pipeline (C, dotnet, ...): override `config-cmdlet`
# / `config-target` / `out-file` to emit the test config in the shape that
# pipeline expects. The caller must run `azure/login` BEFORE this step.
name: Provision e2e Azure resources
description: Provision a resource group + IoT Hub/DPS/devices (optionally ADU) and emit a test-config script.

inputs:
  rg-prefix:
    description: Resource group name prefix (e.g. CSDKE2EFast-).
    required: true
  azure-location:
    description: Azure region to provision in. ADU is only available in a subset (EastUS).
    required: false
    default: EastUS
  enable-adu:
    description: New-AzIotTestEnvironment -EnableADU value (None|Gen1|Gen2).
    required: false
    default: None
  iothub-x509-thumbprint-devices:
    description: Number of x509-thumbprint IoT Hub devices to create.
    required: false
    default: '1'
  dps-x509-individual-enrollments:
    description: Number of DPS x509 individual enrollments to create.
    required: false
    default: '1'
  config-cmdlet:
    description: Cmdlet that renders the per-pipeline test config (e.g. New-AzIotCSDKE2ETestConfig).
    required: false
    default: New-AzIotCSDKE2ETestConfig
  config-target:
    description: Test-config target shell (powershell|bash).
    required: false
    default: powershell
  out-file:
    description: Path to write the generated test-config script to.
    required: false
    default: test_config/set_test_env_vars.ps1

outputs:
  resource-group:
    description: Name of the provisioned resource group (for teardown).
    value: ${{ steps.provision.outputs.rg }}

runs:
  using: composite
  steps:
    - name: Provision resources
      id: provision
      uses: azure/powershell@v3
      with:
        azPSVersion: "latest"
        inlineScript: |
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/Azure/iot-sdks-e2e-fx/refs/heads/master/scripts/Azure.Iot.Sdk.Test.psm1" -OutFile "./Azure.Iot.Sdk.Test.psm1"
          Import-Module "./Azure.Iot.Sdk.Test.psm1"
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent "${{ inputs.out-file }}") | Out-Null
          $ResourceGroupName = New-AzureResourceGroupName -Prefix "${{ inputs.rg-prefix }}"
          # Publish the RG name up-front so teardown can delete it even if the
          # provisioning below fails part-way through.
          "rg=$ResourceGroupName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $TestEnvInfo = New-AzIotTestEnvironment -AzureLocation "${{ inputs.azure-location }}" -ResourceGroup $ResourceGroupName `
            -IotHubX509ThumbprintDevices ${{ inputs.iothub-x509-thumbprint-devices }} `
            -DpsX509IndividualEnrollments ${{ inputs.dps-x509-individual-enrollments }} `
            -EnableADU ${{ inputs.enable-adu }}
          & "${{ inputs.config-cmdlet }}" -TestEnvInfo $TestEnvInfo -Target ${{ inputs.config-target }} -OutFile "${{ inputs.out-file }}"
