# Builds the Yocto layer in c/platforms/yocto (azure-iot-sdk and its pkg-config
# consumer) with bitbake for qemux86-64 on scarthgap.
#
# A full bitbake without shared state builds the whole cross toolchain first
# (about 900 tasks, about an hour). So the shared state (SSTATE_DIR) is cached, one
# entry per kas.yml, and pull requests are capped at 20 minutes:
# - Pull request, cache present: full bitbake. Only this layer's recipes build.
# - Pull request, no cache (e.g. kas.yml changed): bitbake parse, fetch and
#   unpack, then a host build of the unpacked source with the recipe's CMake
#   arguments, offline, and the pkg-config consumer against it.
# - Push to main or dev/c, schedule, manual: full bitbake; saves the cache
#   when there was none. The schedule keeps the entry from expiring (7 days).
#
# A separate workflow from ci-c so ci-c's checks keep their duration.
# The same `changes` pattern as ci-c: no workflow-level `paths:`, so the job
# always reports a check run, skipped when nothing relevant changed.

name: ci-c-yocto

on:
  push:
    branches: [ main, 'dev/c' ]
  pull_request:
  schedule:
    - cron: '17 4 * * 1,4'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: detect changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      yocto: ${{ steps.filter.outputs.yocto }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Only what the recipe builds: tests other than tests/install,
          # samples and docs are not part of it.
          filters: |
            yocto:
              - 'c/CMakeLists.txt'
              - 'c/cmake/**'
              - 'c/inc/**'
              - 'c/src/**'
              - 'c/adapters/**'
              - 'c/tests/install/**'
              - 'c/platforms/yocto/**'
              - 'LICENSE'
              - '.github/workflows/ci-c-yocto.yml'

  bitbake:
    name: yocto / scarthgap / qemux86-64
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.yocto == 'true') }}
    # Pinned: scarthgap's supported hosts include Ubuntu 24.04.
    runs-on: ubuntu-24.04
    # A cold full build (no cache) runs only outside pull requests.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 20 || 360 }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # bitbake clones this checkout; SRCREV must be reachable in it.
          fetch-depth: 0

      - name: Set paths
        run: |
          {
            echo "KAS_WORK_DIR=$RUNNER_TEMP/yocto"
            echo "DL_DIR=$RUNNER_TEMP/yocto-downloads"
            echo "SSTATE_DIR=$RUNNER_TEMP/yocto-sstate"
            echo "SSTATE_CACHE_KEY=yocto-scarthgap-qemux86-64-sstate-${{ hashFiles('c/platforms/yocto/kas.yml') }}"
          } >> "$GITHUB_ENV"

      - name: Restore sstate
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/yocto-sstate
          key: ${{ env.SSTATE_CACHE_KEY }}

      - name: Select the build
        id: mode
        run: |
          if [ "${{ github.event_name }}" != pull_request ] || [ "${{ steps.restore.outputs.cache-hit }}" = true ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "Full bitbake (sstate cache hit: ${{ steps.restore.outputs.cache-hit || 'false' }})."
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No sstate cache for this kas.yml: parse, fetch and host build only. The full bitbake runs on main."
          fi

      - name: Free disk space
        if: steps.mode.outputs.full == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gawk wget git diffstat unzip texinfo gcc build-essential \
                                  chrpath socat cpio python3 python3-pip python3-pexpect \
                                  xz-utils debianutils iputils-ping python3-git python3-jinja2 \
                                  python3-subunit python3-websockets zstd lz4 file locales libacl1 \
                                  cmake ninja-build libssl-dev pkg-config
          sudo locale-gen en_US.UTF-8
          # bitbake runs tasks in user namespaces, which AppArmor restricts on Ubuntu 24.04.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          pipx install kas==5.5

      - name: Build this checkout, not the pinned SRCREV
        run: |
          mkdir -p "$KAS_WORK_DIR/build/conf"
          cat > "$KAS_WORK_DIR/build/conf/azure-iot-sdk-local.conf" <<EOT
          AZ_IOT_SDK_GIT_URI = "git://$GITHUB_WORKSPACE;protocol=file;nobranch=1"
          SRCREV_sdk = "$(git rev-parse HEAD)"
          EOT
          cat "$KAS_WORK_DIR/build/conf/azure-iot-sdk-local.conf"

      - name: bitbake
        if: steps.mode.outputs.full == 'true'
        run: kas build c/platforms/yocto/kas.yml

      - name: Check the packages
        if: steps.mode.outputs.full == 'true'
        run: |
          work=("$KAS_WORK_DIR"/build/tmp/work/*/azure-iot-sdk/*/packages-split)
          test "${#work[@]}" -eq 1 && test -d "${work[0]}"
          pkgs="${work[0]}"
          find "$pkgs" -type f | sed "s|^$pkgs/||" | sort
          test -f "$pkgs/azure-iot-sdk-dev/usr/include/azure/iot/az_iot.h"
          test -f "$pkgs/azure-iot-sdk-dev/usr/include/azure-sdk-for-c/azure/core/az_span.h"
          test -f "$pkgs/azure-iot-sdk-dev/usr/lib/cmake/azure-iot-sdk/azure-iot-sdk-config.cmake"
          for c in core mqttv3 mqttv5 adapter_paho su_crypto_openssl certificate_provider_managed; do
            test -f "$pkgs/azure-iot-sdk-dev/usr/lib/pkgconfig/azure-iot-sdk-$c.pc"
          done
          test -f "$pkgs/azure-iot-sdk-staticdev/usr/lib/libaz_iot_core.a"
          test -f "$pkgs/azure-iot-sdk-staticdev/usr/lib/libpaho-mqtt3as.a"

      - name: Run the pkg-config consumer
        if: steps.mode.outputs.full == 'true'
        # qemux86-64 binaries run on the x86-64 runner with the recipe
        # sysroot's own loader and libraries.
        run: |
          work=("$KAS_WORK_DIR"/build/tmp/work/*/azure-iot-sdk-pkgconfig-test/*)
          test "${#work[@]}" -eq 1 && test -d "${work[0]}"
          sysroot="${work[0]}/recipe-sysroot"
          bins=("${work[0]}"/image/usr/bin/pkg_config_test_*)
          # One per default component, plus the combined link.
          test "${#bins[@]}" -eq 7
          for b in "${bins[@]}"; do
            echo "running ${b##*/}"
            "$sysroot/lib/ld-linux-x86-64.so.2" --library-path "$sysroot/lib:$sysroot/usr/lib" "$b"
          done

      - name: bitbake parse, fetch and unpack
        if: steps.mode.outputs.full != 'true'
        run: |
          kas shell c/platforms/yocto/kas.yml -c "
            bitbake azure-iot-sdk azure-iot-sdk-pkgconfig-test -c unpack &&
            bitbake-getvar -q -r azure-iot-sdk --value S > '$RUNNER_TEMP/recipe-S' &&
            bitbake-getvar -q -r azure-iot-sdk --value EXTRA_OECMAKE > '$RUNNER_TEMP/recipe-EXTRA_OECMAKE' &&
            bitbake-getvar -q -r azure-iot-sdk --value PACKAGECONFIG_CONFARGS > '$RUNNER_TEMP/recipe-PACKAGECONFIG_CONFARGS'"
          cat "$RUNNER_TEMP/recipe-S" "$RUNNER_TEMP/recipe-EXTRA_OECMAKE" "$RUNNER_TEMP/recipe-PACKAGECONFIG_CONFARGS"

      - name: Host build of the unpacked recipe source
        if: steps.mode.outputs.full != 'true'
        env:
          # As the recipe exports.
          AZURE_SDK_DISABLE_AUTO_VCPKG: "1"
        run: |
          src="$(cat "$RUNNER_TEMP/recipe-S")"
          # The CMake arguments bitbake passes: EXTRA_OECMAKE and the PACKAGECONFIG switches.
          read -ra args < "$RUNNER_TEMP/recipe-EXTRA_OECMAKE"
          read -ra pkgconfig_args < "$RUNNER_TEMP/recipe-PACKAGECONFIG_CONFARGS"
          prefix="$RUNNER_TEMP/recipe-prefix"
          cmake -S "$src" -B "$RUNNER_TEMP/recipe-build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="$prefix" -DFETCHCONTENT_FULLY_DISCONNECTED=ON "${args[@]}" "${pkgconfig_args[@]}"
          cmake --build "$RUNNER_TEMP/recipe-build"
          cmake --install "$RUNNER_TEMP/recipe-build"
          pcdir="$(dirname "$(find "$prefix" -name azure-iot-sdk-core.pc)")"
          comps=()
          for pc in "$pcdir"/azure-iot-sdk-*.pc; do
            c="${pc##*/azure-iot-sdk-}"
            comps+=("${c%.pc}")
          done
          echo "components: ${comps[*]}"
          test "${#comps[@]}" -eq 6
          PKG_CONFIG_PATH="$pcdir${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" bash "$src/tests/install/pkg-config-test.sh" --run \
            "$RUNNER_TEMP/recipe-pkg-config-test" "${comps[@]}"

      # One immutable entry per kas.yml; pull requests only restore it.
      - name: Save sstate
        if: success() && steps.mode.outputs.full == 'true' && steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/yocto-sstate
          key: ${{ env.SSTATE_CACHE_KEY }}
