          - { adapter: paho, target-suffix: '', tag: pa, index: 0 }
          - { adapter: az_mqtt, target-suffix: _az_mqtt, tag: az, index: 1 }
          - { os: ubuntu-24.04, os-name: linux, os-tag: l, preset: linux-gcc-debug }
          - { os: windows-latest, os-name: windows, os-tag: w, preset: windows-msvc-debug }
    env:
      AZ_IOT_PRESET: ${{ matrix.preset }}
      AZ_IOT_E2E_TEST: az_iot_tests_e2e_mqttv5_transport${{ matrix.target-suffix }}
      AZ_IOT_TEST_SHARD: ${{ matrix.shard }}/2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      # Restored from the cache the openssl job filled.
      - name: Install OpenSSL (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/install-openssl # zizmor: ignore[self-repository]
        with:
          version: ${{ env.WINDOWS_OPENSSL_VERSION }}

      - name: Install ninja and tinyproxy (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build tinyproxy

      # An HTTP CONNECT proxy on loopback, run as the runner user so its log is readable; the
      # proxy tests assert the CONNECT lines for the DPS and hub hosts appear in that log.
      - name: Start the proxy (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo systemctl stop tinyproxy || true
          conf="$RUNNER_TEMP/tinyproxy.conf"
          log="$RUNNER_TEMP/tinyproxy.log"
          cat > "$conf" <<EOF
          Port 3128
          Listen 127.0.0.1
          Timeout 600
          LogFile "$log"
          LogLevel Info
          PidFile "$RUNNER_TEMP/tinyproxy.pid"
          MaxClients 50
          Allow 127.0.0.1
          ConnectPort 443
          ConnectPort 8883
          EOF
          tinyproxy -c "$conf"
          for _ in $(seq 1 20); do
            if (exec 3<>/dev/tcp/127.0.0.1/3128) 2>/dev/null; then break; fi
            sleep 0.5
          done
          (exec 3<>/dev/tcp/127.0.0.1/3128)
          {
            echo "AZ_IOT_PROXY_HOST=127.0.0.1"
            echo "AZ_IOT_PROXY_PORT=3128"
            echo "AZ_IOT_E2E_PROXY_LOG=$log"
          } >> "$GITHUB_ENV"

      # No tinyproxy on Windows: c/eng/e2e-connect-proxy.py logs the same CONNECT lines.
      - name: Start the proxy (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'connect-proxy.log'
          New-Item -ItemType File -Path $log -Force | Out-Null
          Start-Process python -WindowStyle Hidden -ArgumentList @(
            'c/eng/e2e-connect-proxy.py', '--port', '3128', '--log', $log)
          $up = $false
          for ($i = 0; $i -lt 20 -and -not $up; $i++) {
            try { (New-Object System.Net.Sockets.TcpClient('127.0.0.1', 3128)).Dispose(); $up = $true }
            catch { Start-Sleep -Milliseconds 500 }
          }
          if (-not $up) { throw 'the proxy did not start' }
          "AZ_IOT_PROXY_HOST=127.0.0.1", "AZ_IOT_PROXY_PORT=3128", "AZ_IOT_E2E_PROXY_LOG=$log" |
            Add-Content -Path $env:GITHUB_ENV

