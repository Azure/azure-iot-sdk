# CodeQL (security-extended) for the .NET SDK. Results go to the repository's code scanning alerts.
# Analyzes the library and the samples listed in Project.slnx; tests are not built.
name: codeql-dotnet

on:
  push:
    branches: [ main ]
  # No workflow-level `paths:` filter: a workflow that never triggers reports no check, which
  # would block a required check. The `changes` job below skips analysis instead.
  pull_request:
  schedule:
    - cron: '0 12 * * 1'  # Weekly, Monday 12:00 UTC: new queries run against unchanged code.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # dorny/paths-filter lists PR files through the API.
    outputs:
      dotnet: ${{ steps.filter.outputs.dotnet == 'true' || steps.filter.outputs.common == 'true' || steps.filter.outputs.workflow == 'true' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            dotnet:
              - 'dotnet/**'
              - '!dotnet/**/*.md'
            common:
              - 'common/**'
              - '!common/**/*.md'
            workflow:
              - '.github/workflows/codeql-dotnet.yml'

  analyze:
    name: analyze (csharp)
    needs: changes
    if: needs.changes.outputs.dotnet == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write  # Upload results to code scanning.
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended

      - name: Build library and samples
        run: |
          set -euo pipefail
          dotnet build src/Microsoft.Azure.Iot.Device/Microsoft.Azure.Iot.Device.csproj --configuration Release
          grep -oE 'Path="samples/[^"]+\.csproj"' Project.slnx | cut -d'"' -f2 | while read -r project; do
            dotnet build "$project" --configuration Release
          done

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:csharp
