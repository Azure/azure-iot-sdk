# End-to-end tests for the C SDK.
#
# Architecture
# ------------
# * In-process  : ONE native cmocka executable (`az_iot_tests_e2e`) plays BOTH
#                 halves of every scenario. The device side is the shipping SDK
#                 over the Paho MQTT adapter (DPS x509 individual enrollment);
#                 the cloud side is the `az_iot_e2e_service` facade (vendored
#                 AMQP for telemetry/c2d, HTTPS+SAS for method/twin).
# * Resources   : provisioned per job via the shared iot-sdks-e2e-fx script
#                 (same one ci-dotnet uses) and ALWAYS torn down.
#
# Scope
# -----
# This workflow runs the fast scenarios (telemetry/c2d/method/twin) AND the
# mocked Device Update (ADU) e2e suite (az_iot_tests_e2e_adu), which drives a
# signed deployment through the device twin with the crypto/platform ops mocked
# -- no Device Update account is required, so it is fast. A separate workflow
# (ci-c-e2e-adu.yml) is reserved for the future real-ADU suite (which provisions
# an actual Device Update account and triggers updates THROUGH the ADU service);
# until that lands it runs this same mocked suite nightly as a placeholder.
#
# Stages
# ------
# Resources are provisioned EXACTLY ONCE and shared by every test leg:
#   1. setup    : provision the resource group + emit the test-config script
#                 ONCE (via the reusable provision-e2e-resources step), publish
#                 it as an artifact, and expose the resource-group name.
#   2. test     : the Windows AND Linux test legs (matrix). Each builds the
#                 native e2e test, downloads the shared test-config, materializes
#                 the device X.509 material to files, and runs `ctest -R e2e`.
#   3. teardown : always() deletes the shared resource group (via the reusable
#                 destroy-e2e-resources step). It recomputes the group name from
#                 the run id rather than reading a setup output, so it also cleans
#                 up after a CANCELLED setup job (see the `env` block below).
#
# The provision/destroy steps live in .github/actions/{provision,destroy}-e2e-
# resources so other pipelines (e.g. ci-dotnet) can reuse them.

name: ci-c-e2e

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'c/**'
      - 'common/**'
      # This workflow and the provisioning wiring it depends on: a change to any
      # of them alters what the e2e legs actually do, so it has to be validated
      # against real Azure rather than merged on the strength of the other jobs.
      - '.github/workflows/ci-c-e2e.yml'
      - '.github/actions/provision-e2e-resources/**'
      - '.github/actions/destroy-e2e-resources/**'
  push:
    branches: [ main ]
    paths:
      - 'c/**'
      - 'common/**'
      - '.github/workflows/ci-c-e2e.yml'
      - '.github/actions/provision-e2e-resources/**'
      - '.github/actions/destroy-e2e-resources/**'
  schedule:
    - cron: '0 11 * * *'  # Nightly at 4am PST

# Cancel superseded runs on the same ref to avoid leaking parallel resource groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write   # required for azure/login OIDC

# Resource group name derived from the RUN, not from a random GUID published as a
# job output. A CANCELLED job does not propagate its `outputs`, so a teardown that
# reads `needs.setup.outputs.rg` receives an empty string and silently deletes
# nothing while the group stays behind. Both setup and teardown compute this name
# independently, so teardown never depends on setup completing.
env:
  E2E_RESOURCE_GROUP: CSDKE2EFast-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  setup:
    name: setup (provision)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Provision resources
        id: provision
        uses: ./.github/actions/provision-e2e-resources
        with:
          rg-name: ${{ env.E2E_RESOURCE_GROUP }}
          # Two DPS enrollments so the parallel Linux/Windows test legs can each
          # claim their own device (see the per-leg device-index selection below)
          # and never share a device twin.
          dps-x509-individual-enrollments: '2'
          # Provision an Azure Storage account associated with the hub so the
          # always-run file-upload e2e (az_iot_tests_e2e_fileupload) can obtain a
          # SAS URI and upload a blob.
          enable-file-upload: 'true'

      - name: Upload test config
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-config
          path: test_config/set_test_env_vars.ps1
          retention-days: 1
          if-no-files-found: error

  test:
    name: ${{ matrix.os }}
    needs: setup
    strategy:
      fail-fast: false
      # Both OSes run in parallel. Linux is the faster leg, but Windows is kept
      # deliberately: it is the only leg that exercises the Schannel TLS path in
      # the test harness's AMQP transport (the shipping device SDK is MQTT/Paho
      # on both), and it preserves Windows local-dev parity.
      matrix:
        include:
          # The Linux leg builds instrumented (linux-gcc-e2e-coverage) so its run
          # contributes to the coverage picture. e2e is where the feature clients
          # are actually driven end to end, and unit tests alone cannot reach
          # those paths. Running it twice -- once plain, once instrumented --
          # would double the Azure resources this workflow consumes, so it runs
          # once, instrumented. gcov overhead is CPU-only and this suite is
          # network-bound, so it does not move the wall clock.
          - os: ubuntu-latest
            preset: linux-gcc-e2e-coverage
            device-index: 0
          - os: windows-latest
            preset: windows-msvc-debug
            device-index: 1
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install ninja (Linux)
        if: runner.os == 'Linux'
        # libcurl backs the file upload sample's HTTP hook; without it CMake builds
        # the sample with a stub hook that cannot perform the Classic control-plane
        # calls, and the sample run below would prove nothing.
        #
        # softhsm2 + opensc back the non-extractable-key custody suite: a token
        # to hold the device key and the tool that writes it there. The OpenSSL
        # pkcs11 provider the handshake signs through is built from source (see
        # eng/setup-pkcs11-provider.sh for why the packaged one will not do),
        # which is what meson and pkg-config are for.
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build libcurl4-openssl-dev \
                                                          softhsm2 opensc meson pkg-config
          python3 -m pip install --upgrade 'gcovr==7.2'

      - name: Build e2e tests
        working-directory: c
        # The custody suite (a device key that lives inside a PKCS#11 token) is
        # Linux-only for now: it needs an OpenSSL pkcs11 provider, which the
        # Windows runner image does not carry.
        run: |
          cmake --preset ${{ matrix.preset }} -DAZ_IOT_BUILD_E2E=ON -DAZ_IOT_WITH_PAHO=ON ${{ runner.os == 'Linux' && '-DAZ_IOT_BUILD_E2E_PKCS11=ON' || '' }}
          cmake --build --preset ${{ matrix.preset }} ${{ runner.os == 'Windows' && '--config Debug' || '' }} --target az_iot_tests_e2e az_iot_tests_e2e_adu az_iot_tests_e2e_fileupload
          ${{ runner.os == 'Linux' && format('cmake --build --preset {0} --target az_iot_tests_e2e_custody', matrix.preset) || '' }}

      - name: Build the file upload sample (Linux)
        if: runner.os == 'Linux'
        working-directory: c
        run: cmake --build --preset ${{ matrix.preset }} --target az_iot_sample_file_upload

      - name: Download shared test config
        uses: actions/download-artifact@v4
        with:
          name: e2e-test-config
          path: test_config

      - name: Run e2e
        shell: pwsh
        run: |
          # Service-side config (IOTHUB_*, IOT_DPS_*) is set by the generated script.
          . ./test_config/set_test_env_vars.ps1

          # Select this leg's device. Two DPS enrollments are provisioned; the
          # Linux and Windows legs each claim a DISTINCT one (via matrix
          # device-index) so they never share a device twin -- the mocked ADU
          # suite patches large desired properties, and a shared twin would bloat
          # the other leg's twin GET and flake test_twin. Fall back to the
          # unsuffixed index-0 vars if an older (pre-indexing) provisioning script
          # is fetched from iot-sdks-e2e-fx master.
          $idx = '${{ matrix.device-index }}'
          $regId   = (Get-Item "env:IOT_DPS_INDIVIDUAL_REGISTRATION_ID_$idx" -ErrorAction SilentlyContinue).Value
          $certB64 = (Get-Item "env:IOT_DPS_INDIVIDUAL_X509_CERTIFICATE_$idx" -ErrorAction SilentlyContinue).Value
          $keyB64  = (Get-Item "env:IOT_DPS_INDIVIDUAL_X509_KEY_$idx" -ErrorAction SilentlyContinue).Value
          if (-not $regId -or -not $certB64 -or -not $keyB64) {
            Write-Host "Indexed device $idx not available; using the shared index-0 device."
            $regId   = $env:IOT_DPS_INDIVIDUAL_REGISTRATION_ID
            $certB64 = $env:IOT_DPS_INDIVIDUAL_X509_CERTIFICATE
            $keyB64  = $env:IOT_DPS_INDIVIDUAL_X509_KEY
          }
          Write-Host "e2e device (index $idx): $regId"

          # Materialize the device X.509 material to files. The in-process test
          # reads cert/key/CA by PATH, so CI decodes the base64 PEMs and builds a
          # CA trust bundle here (no network download).
          $dir = Join-Path ([System.IO.Path]::GetTempPath()) ("az-iot-c-e2e-" + [Guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $certPath = Join-Path $dir "device-cert.pem"
          $keyPath  = Join-Path $dir "device-key.pem"
          $caPath   = Join-Path $dir "trusted-ca.pem"

          [System.IO.File]::WriteAllText($certPath,
            [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($certB64)))
          [System.IO.File]::WriteAllText($keyPath,
            [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($keyB64)))

          if ($IsLinux -and (Test-Path "/etc/ssl/certs/ca-certificates.crt")) {
            Copy-Item "/etc/ssl/certs/ca-certificates.crt" $caPath
          }
          else {
            # Export the machine + user Root stores as a PEM bundle.
            $sb = New-Object System.Text.StringBuilder
            foreach ($loc in @('LocalMachine', 'CurrentUser')) {
              $store = New-Object System.Security.Cryptography.X509Certificates.X509Store('Root', $loc)
              $store.Open('ReadOnly')
              foreach ($c in $store.Certificates) { [void]$sb.AppendLine($c.ExportCertificatePem()) }
              $store.Close()
            }
            [System.IO.File]::WriteAllText($caPath, $sb.ToString())
          }

          # Map the config's DPS vars onto the names the test consumes.
          $env:AZ_IOT_DPS_ID_SCOPE        = $env:IOT_DPS_ID_SCOPE
          $env:AZ_IOT_DPS_REGISTRATION_ID = $regId
          $env:AZ_IOT_CLIENT_CERT         = $certPath
          $env:AZ_IOT_CLIENT_KEY          = $keyPath
          $env:AZ_IOT_TRUSTED_CA          = $caPath
          if ($env:IOT_DPS_GLOBAL_ENDPOINT) { $env:AZ_IOT_DPS_GLOBAL_ENDPOINT = $env:IOT_DPS_GLOBAL_ENDPOINT }

          # Republish the DEVICE-side configuration (an id scope, a registration id
          # and three file paths -- no secrets) so the sample step below can reuse
          # this leg's device without re-materializing the X.509 material.
          foreach ($name in @('AZ_IOT_DPS_ID_SCOPE', 'AZ_IOT_DPS_REGISTRATION_ID',
                              'AZ_IOT_CLIENT_CERT', 'AZ_IOT_CLIENT_KEY',
                              'AZ_IOT_TRUSTED_CA', 'AZ_IOT_DPS_GLOBAL_ENDPOINT')) {
            $value = (Get-Item "env:$name" -ErrorAction SilentlyContinue).Value
            if ($value) { "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Append }
          }

          New-Item -ItemType Directory -Path ./test_config/results -Force | Out-Null
          $cfg = if ($IsWindows) { @('-C', 'Debug') } else { @() }
          # `-R e2e` runs the fast suite (az_iot_tests_e2e) and the mocked ADU
          # suite (az_iot_tests_e2e_adu). The CSR enrollment test is not built
          # here -- it needs a DPS enrollment linked to a signing CA, which only
          # ci-c-e2e-csr provisions, so it lives behind AZ_IOT_BUILD_E2E_CSR.
          # The adu_crypto_openssl unit test is not matched by the e2e name
          # filter, so it stays out of this job.
          # The custody suite is excluded here and run by its own step below: it
          # needs the device key moved into a PKCS#11 token first.
          ctest --test-dir c/build/${{ matrix.preset }} @cfg -R e2e -E custody `
            --verbose --no-tests=error --timeout 900 `
            --output-junit ./test_config/results/e2e-${{ matrix.os }}.xml

      - name: Run the PKCS#11 custody e2e (Linux)
        if: runner.os == 'Linux'
        shell: pwsh
        # The "Storage / custody" scenario of docs/eng/certificate-management.md:
        # the SAME device provisions through DPS and talks to the hub, but with
        # its private key inside a SoftHSM2 token instead of on disk. Nothing is
        # stubbed -- if the token were not signing the TLS handshake the hub
        # would refuse the connection.
        #
        # It runs in pwsh, and re-sources the generated config, because the
        # SERVICE-side connection strings live only in that script: the earlier
        # step republishes the device-side values (paths and ids, no secrets) to
        # GITHUB_ENV and deliberately not those.
        #
        # --keep-key-file: the earlier suites in this job read the key by path,
        # and the leg's device is torn down with the resource group anyway.
        run: |
          . ./test_config/set_test_env_vars.ps1

          $exports = & bash -c 'set -e; c/eng/setup-pkcs11-provider.sh; c/eng/setup-softhsm.sh "$AZ_IOT_CLIENT_KEY" --keep-key-file'
          if ($LASTEXITCODE -ne 0) { throw "PKCS#11 token provisioning failed ($LASTEXITCODE)" }
          foreach ($line in $exports) {
            if ($line -match "^export ([A-Za-z0-9_]+)='(.*)'$") {
              [System.Environment]::SetEnvironmentVariable($Matches[1], $Matches[2])
            }
          }
          # Fail here, not thirty lines into a test log, if the provider cannot
          # be loaded: without it the token cannot sign.
          & openssl list -providers -provider pkcs11 > $null
          if ($LASTEXITCODE -ne 0) { throw "the OpenSSL pkcs11 provider did not load" }

          # Verbose OpenSSL handshake errors. A custody failure otherwise
          # surfaces as Paho's "TCP/TLS connect failure", which says nothing
          # about which half of the credential the stack rejected.
          $env:AZ_IOT_PAHO_TRACE = 'error'

          ctest --test-dir c/build/${{ matrix.preset }} -R e2e_custody `
            --verbose --no-tests=error --timeout 900 `
            --output-junit ./test_config/results/e2e-custody-${{ matrix.os }}.xml
          if ($LASTEXITCODE -ne 0) { throw "custody e2e failed ($LASTEXITCODE)" }

      - name: Run the file upload sample (Linux)
        if: runner.os == 'Linux'
        shell: pwsh
        # The sample is the reference integration of the application HTTP hook the
        # Classic file-upload control plane requires (this SDK ships no HTTP
        # client). Building it proves nothing about that hook, so run it against
        # the real hub: it provisions, requests a SAS URI, PUTs the blob with
        # libcurl and reports completion, exiting non-zero if any step fails.
        run: |
          $exe = "c/build/${{ matrix.preset }}/samples/az_iot_sample_file_upload"
          if (-not (Test-Path $exe)) { throw "sample not built at $exe" }
          & $exe
          if ($LASTEXITCODE -ne 0) { throw "file upload sample failed ($LASTEXITCODE)" }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.os }}
          path: ./test_config/results/**/*.xml
          if-no-files-found: ignore

      - name: Collect coverage (Linux)
        # Deliberately not `if: always()`. A failed or timed-out e2e run leaves
        # partial or absent .gcda, and feeding that into the combined report
        # would understate coverage for a reason unrelated to the change.
        if: runner.os == 'Linux' && success()
        working-directory: c
        run: bash eng/collect-coverage.sh build/linux-gcc-e2e-coverage coverage/e2e.json e2e-linux

      - name: Upload coverage tracefile (Linux)
        if: runner.os == 'Linux' && success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-trace-e2e
          path: c/coverage/e2e.json
          if-no-files-found: error

  teardown:
    name: teardown (delete resources)
    needs: [setup, test]
    # `always()` also covers cancellation. The group name comes from the workflow
    # `env` (not from `needs.setup.outputs`), so a cancelled setup still gets torn
    # down; the destroy action no-ops when the group was never created.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Delete Azure resources
        uses: ./.github/actions/destroy-e2e-resources
        with:
          resource-group: ${{ env.E2E_RESOURCE_GROUP }}

