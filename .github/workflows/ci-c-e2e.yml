# End-to-end tests for the C SDK.
#
# Architecture
# ------------
# * Device side  : the native `az_iot_e2e_agent` (built by CMake) provisions via
#                  DPS (x509 individual enrollment) and runs one scenario.
# * Service side : a dotnet harness (c/tests/e2e/driver) reuses the
#                  Microsoft.Azure.Devices service client + the EventHub endpoint
#                  to drive/verify each scenario. It launches the agent.
# * Resources    : provisioned per job via the shared iot-sdks-e2e-fx script
#                  (same one ci-dotnet uses) and ALWAYS torn down.
#
# Scope
# -----
# This workflow runs the FAST scenarios (telemetry/c2d/method/twin,
# Category=Fast). Device Update (ADU) lives in a separate workflow
# (ci-c-e2e-adu.yml) because its service provisioning is slow (~25 min) and it
# runs on a different trigger cadence.
#
# Stages
# ------
# Resources are provisioned EXACTLY ONCE and shared by every test leg:
#   1. setup    : provision the resource group + emit the test-config script
#                 ONCE (via the reusable provision-e2e-resources step), publish
#                 it as an artifact, and expose the resource-group name.
#   2. test     : the Windows AND Linux test legs (matrix). Each builds its own
#                 agent, downloads the shared test-config, and runs Category=Fast.
#   3. teardown : always() deletes the shared resource group (via the reusable
#                 destroy-e2e-resources step).
#
# The provision/destroy steps live in .github/actions/{provision,destroy}-e2e-
# resources so other pipelines (e.g. ci-dotnet) can reuse them.

name: ci-c-e2e

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'c/**'
      - 'common/**'
  push:
    branches: [ main ]
    paths:
      - 'c/**'
      - 'common/**'
  schedule:
    - cron: '0 11 * * *'  # Nightly at 4am PST

# Cancel superseded runs on the same ref to avoid leaking parallel resource groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write   # required for azure/login OIDC

jobs:
  setup:
    name: setup (provision)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      rg: ${{ steps.provision.outputs.resource-group }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Provision resources
        id: provision
        uses: ./.github/actions/provision-e2e-resources
        with:
          rg-prefix: CSDKE2EFast-

      - name: Upload test config
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-config
          path: test_config/set_test_env_vars.ps1
          retention-days: 1
          if-no-files-found: error

  test:
    name: ${{ matrix.os }}
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: linux-gcc-debug
            agent_glob: c/build/linux-gcc-debug/tests/e2e/az_iot_e2e_agent
          - os: windows-latest
            preset: windows-msvc-debug
            agent_glob: c/build/windows-msvc-debug/tests/e2e/Debug/az_iot_e2e_agent.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Build e2e device agent
        working-directory: c
        run: |
          cmake --preset ${{ matrix.preset }} -DAZ_IOT_BUILD_E2E=ON -DAZ_IOT_WITH_PAHO=ON
          cmake --build --preset ${{ matrix.preset }} ${{ runner.os == 'Windows' && '--config Debug' || '' }} --target az_iot_e2e_agent

      - name: Locate agent binary
        shell: pwsh
        run: |
          $path = "${{ matrix.agent_glob }}"
          if (-not (Test-Path $path)) { throw "agent binary not found at $path" }
          $full = (Resolve-Path $path).Path
          "AZ_IOT_E2E_AGENT_PATH=$full" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Download shared test config
        uses: actions/download-artifact@v4
        with:
          name: e2e-test-config
          path: test_config

      - name: Run e2e
        shell: pwsh
        run: |
          . ./test_config/set_test_env_vars.ps1
          dotnet test ./c/tests/e2e/driver/Azure.Iot.Sdk.C.E2E.csproj `
            --filter "Category=Fast" `
            --logger "trx;LogFileName=e2e-${{ matrix.os }}.trx" `
            --results-directory ./test_config/results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.os }}
          path: ./test_config/results/**/*.trx
          if-no-files-found: ignore

  teardown:
    name: teardown (delete resources)
    needs: [setup, test]
    if: always() && needs.setup.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Delete Azure resources
        uses: ./.github/actions/destroy-e2e-resources
        with:
          resource-group: ${{ needs.setup.outputs.rg }}

