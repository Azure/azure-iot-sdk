# End-to-end tests for the C SDK.
#
# Architecture
# ------------
# * In-process  : ONE native cmocka executable (`az_iot_tests_e2e`) plays BOTH
#                 halves of every scenario. The device side is the shipping SDK
#                 over the Paho MQTT adapter (DPS x509 individual enrollment);
#                 the cloud side is the `az_iot_e2e_service` facade (vendored
#                 AMQP for telemetry/c2d, HTTPS+SAS for method/twin).
# * Resources   : provisioned per job via the shared iot-sdks-e2e-fx composite
#                 actions (same ones ci-dotnet uses) and ALWAYS torn down.
#
# Scope
# -----
# This workflow runs the fast scenarios (telemetry/c2d/method/twin) and the file
# upload suite. It previously also ran a mocked Device Update (ADU) suite
# (az_iot_tests_e2e_adu) that drove a signed deployment through the device twin.
# That suite retired with the removal of ADU's twin delivery channel and is
# awaiting a rewrite against the new channel, so it is not built or run here.
# The separate ci-c-e2e-adu.yml workflow is parked for the same reason.
#
# Stages
# ------
# Resources are provisioned EXACTLY ONCE and shared by every test leg:
#   1. setup    : provision the resource group + emit the test-config script
#                 ONCE (via the reusable provision-e2e-resources step), publish
#                 it as an artifact, and expose the resource-group name.
#      openssl  : in parallel, builds the OpenSSL the test legs use into the
#                 cache, once per OS (.github/actions/install-openssl).
#   2. test     : one job per OS (Windows, Linux) and test group (core,
#                 transport per adapter, sas), each with its own device. Each
#                 builds the native e2e tests, gets its test-config, materializes
#                 the device X.509 material to files, and runs its group.
#      coverage : merges the Linux groups' tracefiles into coverage-trace-e2e.
#   3. teardown : always() deletes the shared resource group (via the reusable
#                 destroy-e2e-resources step). It recomputes the group name from
#                 the run id rather than reading a setup output, so it also cleans
#                 up after a CANCELLED setup job (see the `env` block below).
#
# The provision/destroy steps are the shared composite actions
# Azure/iot-sdks-e2e-fx/actions/{provision,destroy}-e2e-resources, pinned to a
# tag, so every language pipeline runs the same provisioning code.
#
# Shared environment (temporary, opt-in)
# --------------------------------------
# When the repository variable E2E_SHARED_ID_SCOPE is set, PULL REQUEST runs skip
# setup/teardown and use a long-lived IoT Hub + DPS instead. Each leg issues its
# own device certificate from the DPS X.509 enrollment group's CA, and takes the
# DPS symmetric-key group's key for the SAS suite (c/eng/e2e-shared-device.ps1),
# so legs never share a device and no Azure call is made. Test code gets the
# hub's 'service' policy key, plus, for the TPM suite, a DPS policy with
# EnrollmentWrite + RegistrationStatusWrite and a hub policy with RegistryWrite
# (its enrollment and device cleanup); the test job never logs in to Azure. Same
# tests. Push and nightly runs always provision. Unset the variable to return to
# per-run provisioning.

name: ci-c-e2e

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'c/**'
      - '!c/**/*.md'
      - 'common/**'
      - '!common/**/*.md'
      # This workflow: a change to it alters what the e2e legs actually do, so
      # it has to be validated against real Azure rather than merged on the
      # strength of the other jobs. The provisioning actions now live in
      # Azure/iot-sdks-e2e-fx and are pinned to a tag, so a change there only
      # reaches this repository when the pin below is moved.
      - '.github/workflows/ci-c-e2e.yml'
      - '.github/actions/install-openssl/**'
  push:
    branches: [ main ]
    paths:
      - 'c/**'
      - '!c/**/*.md'
      - 'common/**'
      - '!common/**/*.md'
      - '.github/workflows/ci-c-e2e.yml'
      - '.github/actions/install-openssl/**'
  schedule:
    - cron: '0 11 * * *'  # Nightly at 4am PST

# Cancel superseded runs on the same ref to avoid leaking parallel resource groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Resource group name derived from the RUN, not from a random GUID published as a
# job output. A CANCELLED job does not propagate its `outputs`, so a teardown that
# reads `needs.setup.outputs.rg` receives an empty string and silently deletes
# nothing while the group stays behind. Both setup and teardown compute this name
# independently, so teardown never depends on setup completing.
env:
  E2E_RESOURCE_GROUP: CSDKE2EFast-${{ github.run_id }}-${{ github.run_attempt }}
  # 'true' when this run uses the shared environment (see header). Job-level
  # `if:` cannot read `env`, so the setup and teardown jobs repeat the expression.
  E2E_SHARED: ${{ vars.E2E_SHARED_ID_SCOPE != '' && github.event_name == 'pull_request' }}

jobs:
  setup:
    permissions:
      contents: read
      id-token: write   # azure/login OIDC
    name: setup (provision)
    if: ${{ !(vars.E2E_SHARED_ID_SCOPE != '' && github.event_name == 'pull_request') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Azure Login via OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Provision resources
        id: provision
        uses: Azure/iot-sdks-e2e-fx/actions/provision-e2e-resources@9109e1ce6d9d19bbc750f4715b85db1f5167190e # v1.0.1 + dps-symmkey-group-enrollment-devices (#456)
        with:
          rg-name: ${{ env.E2E_RESOURCE_GROUP }}
          # The shared action defaults to EastUS; these pipelines run in
          # eastus2euap, the region this subscription's IoT Hub scale unit is
          # pinned to -- a hub created anywhere else is rejected with IH400059.
          # An undefined repository variable arrives as an empty string, which
          # would otherwise override the action default, so the fallback is here.
          azure-location: ${{ vars.E2E_AZURE_LOCATION || 'eastus2euap' }}
          # One DPS enrollment per test job (3 legs x 4 groups) so parallel jobs
          # never share a device or its twin (device index: see the test job).
          dps-x509-individual-enrollments: '12'
          # A symmetric-key enrollment group for the SAS e2e suite
          # (az_iot_tests_e2e_sas); each leg registers its own device under it.
          dps-symmkey-group-enrollment-devices: '1'
          # Provision an Azure Storage account associated with the hub so the
          # always-run file-upload e2e (az_iot_tests_e2e_fileupload) can obtain a
          # SAS URI and upload a blob.
          enable-file-upload: 'true'

      # One Event Hubs consumer group per test job, e2e-<device index>: Event
      # Hubs allows 5 readers per partition per group, and the test-config leaves
      # IOTHUB_EVENTHUB_CONSUMER_GROUP unset, i.e. every job on $Default.
      - name: Create consumer groups
        run: |
          set -euo pipefail
          hub="$(az iot hub list -g "$E2E_RESOURCE_GROUP" --query '[0].name' -o tsv)"
          [ -n "$hub" ] || { echo "::error::no IoT Hub in $E2E_RESOURCE_GROUP"; exit 1; }
          for i in $(seq 0 11); do
            az iot hub consumer-group create -g "$E2E_RESOURCE_GROUP" --hub-name "$hub" -n "e2e-$i" -o none
          done

      - name: Upload test config
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-test-config
          path: test_config/set_test_env_vars.ps1
          retention-days: 1
          if-no-files-found: error

  # Builds OpenSSL once per run and OS, so the test legs restore it from the
  # cache instead of each building it on a cache miss.
  openssl:
    name: OpenSSL ${{ matrix.openssl }} (${{ matrix.os }})
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: windows-latest
            openssl: '4.1.0'
          - os: ubuntu-24.04
            openssl: '4.1.0'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Install OpenSSL ${{ matrix.openssl }}
        uses: ./.github/actions/install-openssl # zizmor: ignore[self-repository]
        with:
          version: ${{ matrix.openssl }}

  test:
    name: ${{ matrix.os }}${{ matrix.os == 'ubuntu-24.04' && matrix.openssl != 'system' && format(' / OpenSSL {0}', matrix.openssl) || '' }} / ${{ matrix.group }}
    needs: [ setup, openssl ]
    # Runs after setup, or without it in shared mode (setup skipped).
    if: ${{ !cancelled() && (needs.setup.result == 'success' || needs.setup.result == 'skipped') && needs.openssl.result == 'success' }}
    # Runs pull-request code: no Azure OIDC token.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # Both OSes run in parallel. Linux is the faster leg, but Windows is kept
      # deliberately: it is the only leg that exercises the Schannel TLS path in
      # the test harness's AMQP transport (the shipping device SDK is MQTT/Paho
      # on both), and it preserves Windows local-dev parity.
      # Each OS runs as four groups, each on its own device: one device's suites
      # cannot overlap, and serially one OS took ~7 min of tests. transport and
      # sas are the slow suites (~100 s per adapter); core is the rest.
      # Linux runs twice: on the distribution's OpenSSL 3.0 (the minimum
      # supported) and on 4.1.0; Windows runs on 4.1.0, the version its
      # installers ship. 'system' is the runner's own OpenSSL.
      # Device index = os-index * 4 + group-index (0..11).
      matrix:
        os: [ ubuntu-24.04, windows-latest ]
        openssl: [ system, '4.1.0' ]
        group: [ core, transport-paho, transport-az_mqtt, sas ]
        exclude:
          - os: windows-latest
            openssl: system
        include:
          # The Linux leg builds instrumented (linux-gcc-e2e-coverage) so its run
          # contributes to the coverage picture. e2e is where the feature clients
          # are actually driven end to end, and unit tests alone cannot reach
          # those paths. Running it twice -- once plain, once instrumented --
          # would double the Azure resources this workflow consumes, so it runs
          # once, instrumented. gcov overhead is CPU-only and this suite is
          # network-bound, so it does not move the wall clock.
          - os: ubuntu-24.04
            preset: linux-gcc-e2e-coverage
            os-index: 0
          - os: windows-latest
            preset: windows-msvc-debug
            os-index: 1
          # Not instrumented: the 3.0 leg already contributes the coverage.
          - os: ubuntu-24.04
            openssl: '4.1.0'
            preset: linux-gcc-debug
            os-index: 2
          - group: core
            group-index: 0
            tests: e2e
            tests-exclude: '^az_iot_tests_e2e_(transport|sas)(_az_mqtt)?$'
          - group: transport-paho
            group-index: 1
            tests: '^az_iot_tests_e2e_transport$'
          - group: transport-az_mqtt
            group-index: 2
            tests: '^az_iot_tests_e2e_transport_az_mqtt$'
          - group: sas
            group-index: 3
            tests: '^az_iot_tests_e2e_sas(_az_mqtt)?$'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      # Restored from the cache the openssl job filled
      # (.github/actions/install-openssl).
      - name: Install OpenSSL ${{ matrix.openssl }}
        if: matrix.openssl != 'system'
        uses: ./.github/actions/install-openssl # zizmor: ignore[self-repository]
        with:
          version: ${{ matrix.openssl }}

      - name: Install ninja (Linux)
        if: runner.os == 'Linux'
        # libcurl backs the file upload sample's HTTP hook; without it CMake builds
        # the sample with a stub hook that cannot perform the Classic control-plane
        # calls, and the sample run below would prove nothing.
        #
        # softhsm2 + opensc back the non-extractable-key custody suite: a token
        # to hold the device key and the tool that writes it there. The OpenSSL
        # pkcs11 provider the handshake signs through is built from source (see
        # eng/setup-pkcs11-provider.sh for why the packaged one will not do),
        # which is what meson and pkg-config are for.
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build libcurl4-openssl-dev \
                                                          softhsm2 opensc meson pkg-config
          python3 -m pip install --upgrade 'gcovr==7.2'

      - name: Build e2e tests
        working-directory: c
        # The custody suite (a device key that lives inside a PKCS#11 token) is
        # Linux-only for now: it needs an OpenSSL pkcs11 provider, which the
        # Windows runner image does not carry.
        run: |
          cmake --preset ${{ matrix.preset }} -DAZ_IOT_BUILD_E2E=ON -DAZ_IOT_WITH_PAHO=ON -DAZ_IOT_WITH_AZ_MQTT=ON ${{ runner.os == 'Linux' && '-DAZ_IOT_BUILD_E2E_PKCS11=ON' || '' }}
          cmake --build --preset ${{ matrix.preset }} ${{ runner.os == 'Windows' && '--config Debug' || '' }} --target az_iot_tests_e2e az_iot_tests_e2e_fileupload az_iot_tests_e2e_transport az_iot_tests_e2e_amqp_link az_iot_tests_e2e_notify_time az_iot_tests_e2e_http_headers az_iot_tests_e2e_sas az_iot_tests_e2e_tpm az_iot_tests_e2e_az_mqtt az_iot_tests_e2e_fileupload_az_mqtt az_iot_tests_e2e_transport_az_mqtt az_iot_tests_e2e_sas_az_mqtt az_iot_tests_e2e_tpm_az_mqtt
          ${{ runner.os == 'Linux' && format('cmake --build --preset {0} --target az_iot_tests_e2e_custody az_iot_tests_e2e_custody_az_mqtt az_iot_tests_e2e_amqp_transport_sigpipe', matrix.preset) || '' }}

      - name: Build the file upload sample (Linux)
        if: runner.os == 'Linux'
        working-directory: c
        run: cmake --build --preset ${{ matrix.preset }} --target az_iot_sample_unified_file_upload

      # Provisioned runs read events on this job's own consumer group (created
      # by setup). On the shared environment the generated test config sets it.
      - name: Select the device index
        shell: bash
        env:
          OS_INDEX: ${{ matrix.os-index }}
          GROUP_INDEX: ${{ matrix.group-index }}
        run: |
          idx=$((OS_INDEX * 4 + GROUP_INDEX))
          echo "E2E_DEVICE_INDEX=$idx" >> "$GITHUB_ENV"
          if [ "$E2E_SHARED" != 'true' ]; then
            echo "IOTHUB_EVENTHUB_CONSUMER_GROUP=e2e-$idx" >> "$GITHUB_ENV"
          fi

      - name: Download shared test config
        if: env.E2E_SHARED != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: e2e-test-config
          path: test_config

      - name: Issue a device on the shared environment
        if: env.E2E_SHARED == 'true'
        shell: pwsh
        env:
          E2E_SHARED_GROUP_CA: ${{ secrets.E2E_SHARED_GROUP_CA }}
          E2E_SHARED_IOTHUB_CS: ${{ secrets.E2E_SHARED_IOTHUB_CS }}
          E2E_SHARED_EVENTHUB_CS: ${{ secrets.E2E_SHARED_EVENTHUB_CS }}
          E2E_SHARED_ID_SCOPE: ${{ vars.E2E_SHARED_ID_SCOPE }}
          E2E_SHARED_SAS_GROUP_KEY: ${{ secrets.E2E_SHARED_SAS_GROUP_KEY }}
          E2E_SHARED_DPS_CS: ${{ secrets.E2E_SHARED_DPS_CS }}
          E2E_SHARED_IOTHUB_REGISTRY_CS: ${{ secrets.E2E_SHARED_IOTHUB_REGISTRY_CS }}
          E2E_RUN_ID: ${{ github.run_id }}
          E2E_RUN_ATTEMPT: ${{ github.run_attempt }}
        # Spread jobs over consumer groups e2e-0..e2e-9: Event Hubs allows 5
        # readers per partition per group, and each job reads every partition.
        run: |
          $env:E2E_REGISTRATION_ID = "ci-$($env:E2E_RUN_ID)-$($env:E2E_RUN_ATTEMPT)-$($env:E2E_DEVICE_INDEX)"
          $group = 'e2e-' + (([long]$env:E2E_RUN_ID * 8 + [int]$env:E2E_DEVICE_INDEX) % 10)
          ./c/eng/e2e-shared-device.ps1 -RegistrationId $env:E2E_REGISTRATION_ID `
            -DeviceIndex ([int]$env:E2E_DEVICE_INDEX) -ConsumerGroup $group `
            -OutFile test_config/set_test_env_vars.ps1

      - name: Run e2e
        shell: pwsh
        env:
          E2E_TESTS: ${{ matrix.tests }}
          E2E_EXCLUDE: ${{ matrix.tests-exclude }}
        run: |
          # Service-side config (IOTHUB_*, IOT_DPS_*) is set by the generated script.
          . ./test_config/set_test_env_vars.ps1

          # Select this job's device: one DPS enrollment per job (index from
          # the "Select the device index" step), so no two jobs share a device
          # or its twin. Fall back to the unsuffixed index-0 vars if the pinned
          # provisioning action emits a pre-indexing test config.
          $idx = $env:E2E_DEVICE_INDEX
          $regId   = (Get-Item "env:IOT_DPS_INDIVIDUAL_REGISTRATION_ID_$idx" -ErrorAction SilentlyContinue).Value
          $certB64 = (Get-Item "env:IOT_DPS_INDIVIDUAL_X509_CERTIFICATE_$idx" -ErrorAction SilentlyContinue).Value
          $keyB64  = (Get-Item "env:IOT_DPS_INDIVIDUAL_X509_KEY_$idx" -ErrorAction SilentlyContinue).Value
          if (-not $regId -or -not $certB64 -or -not $keyB64) {
            Write-Host "Indexed device $idx not available; using the shared index-0 device."
            $regId   = $env:IOT_DPS_INDIVIDUAL_REGISTRATION_ID
            $certB64 = $env:IOT_DPS_INDIVIDUAL_X509_CERTIFICATE
            $keyB64  = $env:IOT_DPS_INDIVIDUAL_X509_KEY
          }
          Write-Host "e2e device (index $idx): $regId"

          # Materialize the device X.509 material to files. The in-process test
          # reads cert/key/CA by PATH, so CI decodes the base64 PEMs and builds a
          # CA trust bundle here (no network download).
          $dir = Join-Path ([System.IO.Path]::GetTempPath()) ("az-iot-c-e2e-" + [Guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $certPath = Join-Path $dir "device-cert.pem"
          $keyPath  = Join-Path $dir "device-key.pem"
          $caPath   = Join-Path $dir "trusted-ca.pem"

          [System.IO.File]::WriteAllText($certPath,
            [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($certB64)))
          [System.IO.File]::WriteAllText($keyPath,
            [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($keyB64)))

          if ($IsLinux -and (Test-Path "/etc/ssl/certs/ca-certificates.crt")) {
            Copy-Item "/etc/ssl/certs/ca-certificates.crt" $caPath
          }
          else {
            # Export the machine + user Root stores as a PEM bundle.
            $sb = New-Object System.Text.StringBuilder
            foreach ($loc in @('LocalMachine', 'CurrentUser')) {
              $store = New-Object System.Security.Cryptography.X509Certificates.X509Store('Root', $loc)
              $store.Open('ReadOnly')
              foreach ($c in $store.Certificates) { [void]$sb.AppendLine($c.ExportCertificatePem()) }
              $store.Close()
            }
            [System.IO.File]::WriteAllText($caPath, $sb.ToString())
          }

          # Map the config's DPS vars onto the names the test consumes.
          $env:AZ_IOT_DPS_ID_SCOPE        = $env:IOT_DPS_ID_SCOPE
          $env:AZ_IOT_DPS_REGISTRATION_ID = $regId
          $env:AZ_IOT_CLIENT_CERT         = $certPath
          $env:AZ_IOT_CLIENT_KEY          = $keyPath
          $env:AZ_IOT_TRUSTED_CA          = $caPath
          if ($env:IOT_DPS_GLOBAL_ENDPOINT) { $env:AZ_IOT_DPS_GLOBAL_ENDPOINT = $env:IOT_DPS_GLOBAL_ENDPOINT }
          # SAS suite: the symmetric-key group (provisioned, or the shared one) and
          # a per-leg registration ID under it.
          if (-not $env:IOT_DPS_SYMM_KEY_GROUP_PRIMARY_KEY) {
            throw "IOT_DPS_SYMM_KEY_GROUP_PRIMARY_KEY not found in the test config; the SAS suite needs a DPS symmetric-key enrollment group."
          }
          Write-Host "::add-mask::$($env:IOT_DPS_SYMM_KEY_GROUP_PRIMARY_KEY)"
          $env:AZ_IOT_DPS_SAS_GROUP_KEY = $env:IOT_DPS_SYMM_KEY_GROUP_PRIMARY_KEY
          $env:AZ_IOT_DPS_SAS_REGISTRATION_ID = "sas-${{ github.run_id }}-${{ github.run_attempt }}-$idx"

          # Republish the DEVICE-side configuration (an id scope, a registration id
          # and three file paths -- no secrets) so the sample step below can reuse
          # this leg's device without re-materializing the X.509 material.
          foreach ($name in @('AZ_IOT_DPS_ID_SCOPE', 'AZ_IOT_DPS_REGISTRATION_ID',
                              'AZ_IOT_CLIENT_CERT', 'AZ_IOT_CLIENT_KEY',
                              'AZ_IOT_TRUSTED_CA', 'AZ_IOT_DPS_GLOBAL_ENDPOINT')) {
            $value = (Get-Item "env:$name" -ErrorAction SilentlyContinue).Value
            if ($value) { "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Append }
          }

          New-Item -ItemType Directory -Path ./test_config/results -Force | Out-Null
          $cfg = if ($IsWindows) { @('-C', 'Debug') } else { @() }
          # `-R e2e` runs the fast suite (az_iot_tests_e2e), the file upload
          # suite and the transport suite (WebSockets, and MQTT through an HTTP
          # proxy; its proxy scenarios skip themselves when no proxy is
          # configured for the leg), the DPS TPM suite, and the AMQP link,
          # notification-time and HTTP header parsing tests (no Azure resources).
          # The mocked ADU suite retired with ADU's twin delivery channel
          # and is not built. The CSR enrollment test is not built
          # here -- it needs a DPS enrollment linked to a signing CA, which only
          # ci-c-e2e-csr provisions, so it lives behind AZ_IOT_BUILD_E2E_CSR.
          # The crypto_openssl unit test is not matched by the e2e name
          # filter, so it stays out of this job.
          # The custody suite is excluded here and run by its own step below: it
          # needs the device key moved into a PKCS#11 token first.
          # This job's group: -R/-E from the matrix; custody always excluded.
          $exclude = if ($env:E2E_EXCLUDE) { "custody|$($env:E2E_EXCLUDE)" } else { 'custody' }
          ctest --test-dir c/build/${{ matrix.preset }} @cfg -R $env:E2E_TESTS -E $exclude `
            --verbose --no-tests=error --timeout 900 `
            --output-junit ./test_config/results/e2e-${{ matrix.os }}-${{ matrix.openssl }}-${{ matrix.group }}.xml

      - name: Run the PKCS#11 custody e2e (Linux)
        if: runner.os == 'Linux' && matrix.group == 'core'
        shell: pwsh
        env:
          # pkcs11-provider 0.6 (the script's default) does not build on OpenSSL 4.x.
          PKCS11_PROVIDER_TAG: ${{ matrix.openssl != 'system' && 'v1.3.0' || '' }}
        # The "Storage / custody" scenario of docs/eng/certificate-management.md:
        # the SAME device provisions through DPS and talks to the hub, but with
        # its private key inside a SoftHSM2 token instead of on disk. Nothing is
        # stubbed -- if the token were not signing the TLS handshake the hub
        # would refuse the connection.
        #
        # It runs in pwsh, and re-sources the generated config, because the
        # SERVICE-side connection strings live only in that script: the earlier
        # step republishes the device-side values (paths and ids, no secrets) to
        # GITHUB_ENV and deliberately not those.
        #
        # --keep-key-file: the earlier suites in this job read the key by path,
        # and the leg's device is torn down with the resource group anyway.
        run: |
          . ./test_config/set_test_env_vars.ps1

          # eval the provider script rather than merely running it, so
          # setup-softhsm.sh sees OPENSSL_MODULES and writes an explicit
          # "module = .../pkcs11.so" into the configuration it generates. The
          # coverage job in ci-c.yml does the same. Naming the module makes the
          # configuration independent of OPENSSL_MODULES at run time.
          $exports = & bash -c 'set -e; mods="$(c/eng/setup-pkcs11-provider.sh)"; eval "$mods"; echo "$mods"; c/eng/setup-softhsm.sh "$AZ_IOT_CLIENT_KEY" --keep-key-file'
          if ($LASTEXITCODE -ne 0) { throw "PKCS#11 token provisioning failed ($LASTEXITCODE)" }
          foreach ($line in $exports) {
            if ($line -match "^export ([A-Za-z0-9_]+)='(.*)'$") {
              [System.Environment]::SetEnvironmentVariable($Matches[1], $Matches[2])
            }
          }

          # What the run will actually use. Printed rather than discarded: a
          # custody failure is otherwise indistinguishable from a configuration
          # that was never applied.
          Write-Host "--- OPENSSL_CONF = $env:OPENSSL_CONF"
          Get-Content $env:OPENSSL_CONF | Write-Host

          # The provider must be active from the CONFIGURATION ALONE. The previous
          # check passed "-provider pkcs11", which loads it explicitly and so could
          # not tell a configuration that is in effect from one that is not -- the
          # exact difference that matters here, because the adapter loads the
          # provider at run time regardless and that path is the one that fails.
          $providers = & openssl list -providers 2>&1 | Out-String
          Write-Host "--- providers active from configuration:`n$providers"
          if ($LASTEXITCODE -ne 0) {
            throw "openssl list -providers failed ($LASTEXITCODE)"
          }
          # Match the provider's own entry in the list -- a line holding just its
          # name -- not the substring anywhere in the output. $providers carries
          # stderr too, so a load error that merely mentions pkcs11 must not read
          # as success.
          if ($providers -notmatch '(?m)^\s+pkcs11\s*$') {
            throw "the pkcs11 provider is not active from OPENSSL_CONF; the custody path would fall back to a run-time load"
          }

          # Verbose OpenSSL handshake errors. A custody failure otherwise
          # surfaces as Paho's "TCP/TLS connect failure", which says nothing
          # about which half of the credential the stack rejected.
          $env:AZ_IOT_PAHO_TRACE = 'error'
          $env:AZ_IOT_E2E_LOG_LEVEL = 'DEBUG'

          ctest --test-dir c/build/${{ matrix.preset }} -R e2e_custody `
            --verbose --no-tests=error --timeout 900 `
            --output-junit ./test_config/results/e2e-custody-${{ matrix.os }}.xml
          if ($LASTEXITCODE -ne 0) { throw "custody e2e failed ($LASTEXITCODE)" }

      - name: Run the file upload sample (Linux)
        if: runner.os == 'Linux' && matrix.group == 'core'
        shell: pwsh
        # The sample is the reference integration of the application HTTP hook the
        # Classic file-upload control plane requires (this SDK ships no HTTP
        # client). Building it proves nothing about that hook, so run it against
        # the real hub: it provisions, requests a SAS URI, PUTs the blob with
        # libcurl and reports completion, exiting non-zero if any step fails.
        run: |
          $exe = "c/build/${{ matrix.preset }}/samples/unified/az_iot_sample_file_upload"
          if (-not (Test-Path $exe)) { throw "sample not built at $exe" }
          & $exe
          if ($LASTEXITCODE -ne 0) { throw "file upload sample failed ($LASTEXITCODE)" }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-results-${{ matrix.os }}-${{ matrix.openssl }}-${{ matrix.group }}
          path: ./test_config/results/**/*.xml
          if-no-files-found: ignore

      - name: Collect coverage (Linux)
        # Deliberately not `if: always()`. A failed or timed-out e2e run leaves
        # partial or absent .gcda, and feeding that into the combined report
        # would understate coverage for a reason unrelated to the change.
        if: matrix.preset == 'linux-gcc-e2e-coverage' && success()
        working-directory: c
        run: bash eng/collect-coverage.sh build/linux-gcc-e2e-coverage coverage/e2e.json e2e-linux

      - name: Upload coverage tracefile (Linux)
        if: matrix.preset == 'linux-gcc-e2e-coverage' && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-trace-e2e-linux-${{ matrix.group }}
          path: c/coverage/e2e.json
          if-no-files-found: error

  # One e2e tracefile for ci-c-coverage-combined: the union of the Linux groups.
  # Only when every test job succeeded, as before: a failed group leaves partial
  # coverage, and merging it would understate coverage for an unrelated reason.
  coverage:
    name: coverage (merge)
    needs: test
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install gcovr
        run: python3 -m pip install --upgrade 'gcovr==7.2'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-trace-e2e-linux-*
          path: traces
      - name: Merge tracefiles
        run: |
          set -euo pipefail
          mapfile -t files < <(find traces -name '*.json' | sort)
          if [ "${#files[@]}" -ne 4 ]; then
            echo "::error::expected 4 Linux tracefiles, got ${#files[@]}"
            exit 1
          fi
          args=()
          for f in "${files[@]}"; do echo "  $f"; args+=(--add-tracefile "$f"); done
          mkdir -p c/coverage
          gcovr --root c "${args[@]}" --merge-mode-functions=separate --json c/coverage/e2e.json
      - name: Upload coverage tracefile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-trace-e2e
          path: c/coverage/e2e.json
          if-no-files-found: error

  teardown:
    permissions:
      contents: read
      id-token: write   # azure/login OIDC
    name: teardown (delete resources)
    needs: [setup, test]
    # `always()` also covers cancellation. The group name comes from the workflow
    # `env` (not from `needs.setup.outputs`), so a cancelled setup still gets torn
    # down; the destroy action no-ops when the group was never created. Skipped in
    # shared mode: the shared group outlives the run.
    if: ${{ always() && !(vars.E2E_SHARED_ID_SCOPE != '' && github.event_name == 'pull_request') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Azure Login via OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Delete Azure resources
        uses: Azure/iot-sdks-e2e-fx/actions/destroy-e2e-resources@b96d2aa2eb2b36e1e4dfbdb04aa56cf3dccecf8a # v1.0.1
        with:
          resource-group: ${{ env.E2E_RESOURCE_GROUP }}

