# Builds the .NET solution and runs the unit tests on Linux and Windows. Needs no Azure resources,
# unlike ci-dotnet.yml (end-to-end).
name: ci-dotnet-build

on:
  push:
    branches: [ main ]
  # No workflow-level `paths:` filter: a workflow that never triggers reports no check, which
  # would block a required check. The `changes` job below skips work instead.
  pull_request:
  workflow_dispatch:
    inputs:
      full_logging:
        description: Enable detailed build/test output and SDK traces (logs may contain sensitive data)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_VERBOSITY: ${{ (inputs.full_logging || vars.DOTNET_FULL_LOGGING == 'true') && 'detailed' || 'minimal' }}
  DOTNET_TEST_LOGGER_VERBOSITY: ${{ (inputs.full_logging || vars.DOTNET_FULL_LOGGING == 'true') && 'detailed' || 'normal' }}
  AZ_IOT_TEST_FULL_LOGGING: ${{ inputs.full_logging || vars.DOTNET_FULL_LOGGING == 'true' }}
  AZ_IOT_TEST_LOG_DIRECTORY: ${{ github.workspace }}/coverage/sdk-logs

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # dorny/paths-filter lists PR files through the API.
    outputs:
      dotnet: ${{ steps.filter.outputs.dotnet == 'true' || steps.filter.outputs.common == 'true' || steps.filter.outputs.workflow == 'true' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            dotnet:
              - 'dotnet/**'
              - '!dotnet/**/*.md'
            common:
              - 'common/**'
              - '!common/**/*.md'
            workflow:
              - '.github/workflows/ci-dotnet-build.yml'

  build-gate:
    name: build + unit tests gate
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check build and test outcomes
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::Change detection did not succeed ($CHANGES_RESULT)"
            exit 1
          fi
          if [ "$BUILD_RESULT" != "success" ] && [ "$BUILD_RESULT" != "skipped" ]; then
            echo "::error::Build or unit tests did not succeed ($BUILD_RESULT)"
            exit 1
          fi

  build:
    name: build + unit tests (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.dotnet == 'true' || github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Build
        shell: pwsh
        run: dotnet build Project.slnx --configuration Release --verbosity "$env:DOTNET_VERBOSITY"

      - name: Unit tests
        shell: pwsh
        run: >
          dotnet test tests/Microsoft.Azure.Iot.Device.UnitTests/Microsoft.Azure.Iot.Device.UnitTests.csproj
          --configuration Release --no-build
          --verbosity "$env:DOTNET_VERBOSITY"
          --logger:"trx;LogFilePrefix=unit-tests"
          --logger:"console;verbosity=$env:DOTNET_TEST_LOGGER_VERBOSITY"
          --results-directory "$env:GITHUB_WORKSPACE/coverage"
          -- xunit.diagnosticMessages=$env:AZ_IOT_TEST_FULL_LOGGING xunit.internalDiagnosticMessages=$env:AZ_IOT_TEST_FULL_LOGGING

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-report-${{ matrix.os }}
          path: ./coverage/
          if-no-files-found: warn
          retention-days: 7
