name: ci-dotnet

on:
  workflow_dispatch:
    inputs:
      full_logging:
        description: Enable detailed build/test output and SDK/MQTT traces (logs may contain sensitive data)
        type: boolean
        default: false
  pull_request:
    paths:
      - 'dotnet/**'
      - '!dotnet/**/*.md'
      - 'common/**'
      - '!common/**/*.md'
      - '.github/workflows/ci-dotnet.yml'
  push:
    branches: [ main ]
    paths:
      - 'dotnet/**'
      - '!dotnet/**/*.md'
      - 'common/**'
      - '!common/**/*.md'
      - '.github/workflows/ci-dotnet.yml'
  schedule:
    - cron: '0 11 * * *'  # Nightly at 4am PST

# Cancel superseded runs on the same ref to avoid leaking parallel resource groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Resource group name derived from the RUN, not from a random GUID published as a
# job output. A CANCELLED job does not propagate its `outputs`, so a teardown that
# reads `needs.setup.outputs.rg` receives an empty string and silently deletes
# nothing while the group stays behind. Both setup and teardown compute this name
# independently, so teardown never depends on setup completing.
env:
  E2E_RESOURCE_GROUP: DotnetE2ETestPipeline-${{ github.run_id }}-${{ github.run_attempt }}
  DOTNET_VERBOSITY: ${{ (inputs.full_logging || vars.DOTNET_FULL_LOGGING == 'true') && 'detailed' || 'minimal' }}
  DOTNET_TEST_LOGGER_VERBOSITY: ${{ (inputs.full_logging || vars.DOTNET_FULL_LOGGING == 'true') && 'detailed' || 'normal' }}
  AZ_IOT_TEST_FULL_LOGGING: ${{ inputs.full_logging || vars.DOTNET_FULL_LOGGING == 'true' }}
  AZ_IOT_TEST_LOG_DIRECTORY: ${{ github.workspace }}/coverage/sdk-logs

jobs:
  setup:
    permissions:
      contents: read
      id-token: write   # azure/login OIDC
    name: setup (provision)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Azure Login via OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Provision resources
        id: provision
        uses: Azure/iot-sdks-e2e-fx/actions/provision-e2e-resources@b96d2aa2eb2b36e1e4dfbdb04aa56cf3dccecf8a # v1.0.1
        with:
          rg-name: ${{ env.E2E_RESOURCE_GROUP }}
          # The shared action defaults to EastUS; these pipelines run in
          # eastus2euap, the region this subscription's IoT Hub scale unit is
          # pinned to -- a hub created anywhere else is rejected with IH400059.
          # An undefined repository variable arrives as an empty string, which
          # would otherwise override the action default, so the fallback is here.
          azure-location: ${{ vars.E2E_AZURE_LOCATION || 'eastus2euap' }}
          enable-file-upload: 'true'
          enable-certificate-management: 'false'
          dps-x509-group-enrollment-devices: '2'
          dps-x509-individual-enrollments: '2'

      - name: Upload test config
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-test-config
          path: test_config/set_test_env_vars.ps1
          retention-days: 1
          if-no-files-found: error

  test:
    name: ${{ matrix.os }}
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            device-index: 0
          - os: windows-latest
            device-index: 1
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Build e2e tests
        working-directory: dotnet
        run: |
          dotnet build ./Project.slnx --verbosity "$env:DOTNET_VERBOSITY"
        shell: pwsh

      - name: Download shared test config
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: e2e-test-config
          path: test_config

      - name: Run e2e
        shell: pwsh
        run: |
          # Service-side config (IOTHUB_*, IOT_DPS_*) is set by the generated script.
          . ./test_config/set_test_env_vars.ps1

          # Map the config's DPS vars onto the names the test consumes.
          $env:AZ_IOT_DPS_ID_SCOPE        = $env:IOT_DPS_ID_SCOPE
          if ($env:IOT_DPS_GLOBAL_ENDPOINT) { $env:AZ_IOT_DPS_GLOBAL_ENDPOINT = $env:IOT_DPS_GLOBAL_ENDPOINT }

          # Tests labeled Category=CertificateManagement run in ci-dotnet-e2e-csr;
          # all other tests, including those without a category, run here.
          dotnet test ./dotnet/Project.slnx `
            --filter "Category!=CertificateManagement" `
            --verbosity "$env:DOTNET_VERBOSITY" `
            --collect:"XPlat Code Coverage" `
            --logger:"trx" `
            --logger:"console;verbosity=$env:DOTNET_TEST_LOGGER_VERBOSITY" `
            --results-directory ./coverage `
            -- xunit.parallelizeAssembly=true xunit.diagnosticMessages=$env:AZ_IOT_TEST_FULL_LOGGING xunit.internalDiagnosticMessages=$env:AZ_IOT_TEST_FULL_LOGGING

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-report-${{ matrix.os }}
          path: ./coverage/
          if-no-files-found: warn
          retention-days: 7

      - uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        id: test-reporter
        if: always()
        with:
          name: dotnet test report
          path: 'coverage/**/*.trx'
          reporter: dotnet-trx  

      - name: Annotate Test Report
        if: always()
        env:
          REPORT_URL: ${{ steps.test-reporter.outputs.url_html }}
        run: echo "Test Report $REPORT_URL" >> "$GITHUB_STEP_SUMMARY"

  report-coverage:
    runs-on: ubuntu-24.04 # Irongut tool is only usable on linux, so this is a separate job from the windows and linux jobs that runs the tests
    name: Code coverage
    strategy:
          fail-fast: false
          matrix:
            include:
              - os: ubuntu-24.04
              - os: windows-latest
    needs: [test]
    permissions:
      contents: read
    steps:
    - name: Download Test Report Artifact
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: test-report-${{ matrix.os }}
        path: ./coverage/

    - name: Code Coverage Summary Report
      uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
      with:
        filename: ./coverage/**/coverage.cobertura.xml
        format: markdown
        hide_branch_rate: false
        hide_complexity: false
        indicators: true
        output: both

  teardown:
    permissions:
      contents: read
      id-token: write   # azure/login OIDC
    name: teardown (delete resources)
    needs: [setup, test]
    # `always()` also covers cancellation. The group name comes from the workflow
    # `env` (not from `needs.setup.outputs`), so a cancelled setup still gets torn
    # down; the destroy action no-ops when the group was never created.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Azure Login via OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Delete Azure resources
        uses: Azure/iot-sdks-e2e-fx/actions/destroy-e2e-resources@b96d2aa2eb2b36e1e4dfbdb04aa56cf3dccecf8a # v1.0.1
        with:
          resource-group: ${{ env.E2E_RESOURCE_GROUP }}
