name: Dotnet Continuous Integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'dotnet/**'
      - 'common/**'
  push:
    branches:
    - main
    paths:
      - 'dotnet/**'
      - 'common/**'
  schedule:
  - cron: '0 11 * * *'  # Nightly at 4am PST


# only allow one run / branch at a time
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  checks: write
  id-token: write
    
jobs:
  build:
    runs-on: ubuntu-latest
    name: CI-dotnet
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v6

    - name: Azure Login via OIDC
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Create Azure Test Resources
      uses: azure/powershell@v3
      with:
        azPSVersion: "latest"
        inlineScript: |
          Write-Host "Downloading setup script from Azure/iot-sdks-e2e-fx repo..."
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/Azure/iot-sdks-e2e-fx/refs/heads/master/scripts/Azure.Iot.Sdk.Test.psm1" -OutFile "./Azure.Iot.Sdk.Test.psm1"
          Write-Host "Importing setup script powershell module"
          Import-Module "./Azure.Iot.Sdk.Test.psm1"
          Write-Host "Creating new resource group"
          $ResourceGroupName = New-AzureResourceGroupName -Prefix "DotnetE2ETestPipeline-" -OutFile "test_config/azure-resource-group-name.txt"
          Write-Host "Adding Azure resources to the new resource group with name " $ResourceGroupName
          $TestEnvInfo = New-AzIotTestEnvironment -AzureLocation "EastUS" -ResourceGroup $ResourceGroupName
          New-AzIotCSDKE2ETestConfig -TestEnvInfo $TestEnvInfo -Target powershell -OutFile test_config/set_test_env_vars.ps1
          chmod +x ./test_config/set_test_env_vars.ps1
          ./test_config/set_test_env_vars.ps1
          dotnet test ./dotnet/Project.slnx --collect:"XPlat Code Coverage" --logger:"trx;LogFileName=test-results.trx" --environment IOTHUB_CONNECTION_STRING=$env:IOTHUB_CONNECTION_STRING --environment IOT_DPS_CONNECTION_STRING=$env:IOT_DPS_CONNECTION_STRING --environment IOT_DPS_ID_SCOPE=$env:IOT_DPS_ID_SCOPE -- xunit.parallelizeAssembly=true

    - name: Microsoft.Azure.Devices.Client.IntegrationTests Package Code Coverage
      uses: irongut/CodeCoverageSummary@v1.3.0
      if: always()
      with:
        filename: ./dotnet/**/**.IntegrationTests/TestResults/*/coverage.cobertura.xml
        format: markdown
        hide_branch_rate: false
        hide_complexity: false
        indicators: true
        output: both

    - name: Microsoft.Azure.Devices.Client.UnitTests Package Code Coverage
      uses: irongut/CodeCoverageSummary@v1.3.0
      if: always()
      with:
        filename: ./dotnet/**/**.UnitTests/TestResults/*/coverage.cobertura.xml
        format: markdown
        hide_branch_rate: false
        hide_complexity: false
        indicators: true
        output: both

    - name: Delete Azure Test Resources
      uses: azure/powershell@v3
      if: always()
      with:
        azPSVersion: "latest"
        inlineScript: |
          $AZURE_RESOURCE_GROUP_NAME = $(cat ./test_config/azure-resource-group-name.txt)
          Write-Host "Deleting Azure resource group: " $AZURE_RESOURCE_GROUP_NAME
          az group delete --name $AZURE_RESOURCE_GROUP_NAME --yes --no-wait

    - uses: dorny/test-reporter@v3
      id: test-reporter
      if: always()
      with:
        name: dotnet test report
        path: '**/test-results.trx'
        reporter: dotnet-trx  

    - name: Annotate Test Report
      if: always()
      run: echo Test Report ${{ steps.test-reporter.outputs.url_html }} >> $GITHUB_STEP_SUMMARY
