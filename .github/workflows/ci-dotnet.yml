name: ci-dotnet

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'dotnet/**'
      - 'common/**'
  push:
    branches: [ main ]
    paths:
      - 'dotnet/**'
      - 'common/**'
  schedule:
    - cron: '0 11 * * *'  # Nightly at 4am PST

# Cancel superseded runs on the same ref to avoid leaking parallel resource groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write   # required for azure/login OIDC

# Resource group name derived from the RUN, not from a random GUID published as a
# job output. A CANCELLED job does not propagate its `outputs`, so a teardown that
# reads `needs.setup.outputs.rg` receives an empty string and silently deletes
# nothing while the group stays behind. Both setup and teardown compute this name
# independently, so teardown never depends on setup completing.
env:
  E2E_RESOURCE_GROUP: DotnetE2ETestPipeline-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  setup:
    name: setup (provision)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  test:
    name: ${{ matrix.os }}
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            device-index: 0
          - os: windows-latest
            device-index: 1
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Build e2e tests
        working-directory: dotnet
        run: |
          dotnet build ./Project.slnx

      - name: Run e2e
        shell: pwsh
        run: |
          dotnet test ./dotnet/Project.slnx `
            --collect:"XPlat Code Coverage" `
            --logger:"trx;LogFileName=test-results.trx" `
            -- xunit.parallelizeAssembly=true

      - name: Copy Test Report
        shell: pwsh
        run: |
          Copy-Item -Path "./**/Microsoft.Azure.Devices.Client.UnitTests/TestResults/*/coverage.cobertura.xml" -Destination "./coverage/Microsoft.Azure.Devices.Client.UnitTests/coverage.cobertura.xml"

      - name: Upload Test Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.os }}
          path: ./coverage/*
          if-no-files-found: error

      - uses: dorny/test-reporter@v3
        id: test-reporter
        if: always()
        with:
          name: dotnet test report
          path: '**/test-results.trx'
          reporter: dotnet-trx  

      - name: Annotate Test Report
        if: always()
        run: echo Test Report ${{ steps.test-reporter.outputs.url_html }} >> $GITHUB_STEP_SUMMARY

  report-coverage:
    runs-on: ubuntu-latest # Irongut tool is only usable on linux, so this is a separate job from the windows and linux jobs that runs the tests
    name: Code coverage
    strategy:
          fail-fast: false
          matrix:
            include:
              - os: ubuntu-latest
              - os: windows-latest
    needs: [test]
    permissions:
      contents: read
    steps:
    - name: Download Test Report Artifact
      uses: actions/download-artifact@v4
      with:
        name: test-report-${{ matrix.os }}

    - name: Code Coverage Summary Report
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: coverage/${{ matrix.os }}/**/Microsoft.Azure.Devices.Client.UnitTests/TestResults/*/coverage.cobertura.xml
        format: markdown
        hide_branch_rate: false
        hide_complexity: false
        indicators: true
        output: both

  teardown:
    name: teardown (delete resources)
    needs: [setup, test]
    # `always()` also covers cancellation. The group name comes from the workflow
    # `env` (not from `needs.setup.outputs`), so a cancelled setup still gets torn
    # down; the destroy action no-ops when the group was never created.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Delete Azure resources
        uses: ./.github/actions/destroy-e2e-resources
        with:
          resource-group: ${{ env.E2E_RESOURCE_GROUP }}

