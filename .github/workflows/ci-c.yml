name: ci-c

on:
  push:
    branches: [ main, 'dev/c' ]
  # No workflow-level `paths:` filter. Path filtering happens in the `changes`
  # job below and is applied per job via `if:`. A workflow that never triggers
  # reports no checks at all, which deadlocks any required status check on a PR
  # that touches nothing under c/ ("Expected - waiting for status to be
  # reported"). A job skipped by a job-level `if:` still reports a check run,
  # and GitHub treats that as satisfied.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# All run steps execute from the c/ project directory (where CMakePresets.json
# lives). Path-based fields (paths filters, working-directory overrides, artifact
# paths) stay relative to the repo root and are qualified with c/ explicitly.
defaults:
  run:
    working-directory: c

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-24.04
    # dorny/paths-filter calls the pulls/listFiles API on pull_request events.
    # Without pull-requests:read it fails with "Resource not accessible by
    # integration".
    permissions:
      contents: read
      pull-requests: read
    outputs:
      c: ${{ steps.filter.outputs.c == 'true' || steps.filter.outputs.common == 'true' || steps.filter.outputs.workflow == 'true' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          # `every`: a file counts only if it matches all patterns of a filter,
          # so the `!` patterns exclude Markdown. Hence one filter per path root.
          predicate-quantifier: every
          filters: |
            c:
              - 'c/**'
              - '!c/**/*.md'
            common:
              - 'common/**'
              - '!common/**/*.md'
            # A change to this workflow decides what the build/test legs do,
            # so it has to run them.
            workflow:
              - '.github/workflows/ci-c.yml'

  # The Paho-OFF legs build the whole tree on az_mqtt. Every leg checks that
  # nothing depends on an adapter it was configured without
  # (eng/check-dependencies.cmake); the Paho-ON legs also prove the check finds
  # Paho when it is there.
  build:
    name: ${{ matrix.preset }} / ${{ matrix.build_type }}${{ matrix.with_paho == 'OFF' && ' / no Paho' || '' }}
    needs: changes
    if: needs.changes.outputs.c == 'true' || github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            preset: linux-gcc-debug
            build_type: Debug
            with_paho: ON
          - os: ubuntu-24.04
            preset: linux-clang-debug
            build_type: Debug
            with_paho: ON
          - os: windows-latest
            preset: windows-msvc-debug
            build_type: Debug
            with_paho: ON
          - os: ubuntu-24.04
            preset: linux-gcc-debug
            build_type: Debug
            with_paho: OFF
          - os: windows-latest
            preset: windows-msvc-debug
            build_type: Debug
            with_paho: OFF
    runs-on: ${{ matrix.os }}

    # Mosquitto service container for the MQTT iface conformance suite.
    # GitHub Actions service containers only run on Linux runners. The Windows
    # preset does not set AZ_IOT_BUILD_CONFORMANCE_TESTS, so those suites are
    # not registered there and nothing needs a broker.
    services:
      mosquitto:
        image: ${{ matrix.os == 'ubuntu-24.04' && 'eclipse-mosquitto:2' || '' }}
        ports:
          - 1883:1883
        # A real liveness probe: mosquitto_pub succeeds only once the broker is
        # accepting connections. The previous `mosquitto_sub '$SYS/#' ||
        # exit 0` form reported healthy unconditionally, so the conformance
        # suites could race broker startup. That was harmless only while those
        # suites were silently skipping -- they now fail instead.
        options: >-
          --health-cmd="mosquitto_pub -h localhost -p 1883 -t healthcheck -m ok"
          --health-interval=5s
          --health-retries=10
          --health-start-period=5s

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Install ninja (Linux)
        if: runner.os == 'Linux'
        # libssl-dev is explicit rather than assumed from the runner image: the
        # Linux presets set AZ_IOT_BUILD_CONFORMANCE_TESTS_TLS, and that option
        # fails the configure step outright when OpenSSL is missing instead of
        # dropping the certificate-validation tests.
        # libcurl: the samples that use it (dps_tpm, file_upload's upload path,
        # software_update/pc/http_download)
        # are expected to build.
        run: sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev libcurl4-openssl-dev

      - name: Configure
        run: |
          cmake -DBUILD_DIR=build/${{ matrix.preset }} -DMODE=prepare -P eng/check-dependencies.cmake
          cmake --preset ${{ matrix.preset }} -DAZ_IOT_WITH_PAHO=${{ matrix.with_paho }} -DAZ_IOT_WITH_AZ_MQTT=ON
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --config ${{ matrix.build_type }}
      # Every connecting sample is built for every adapter. Windows: no libcurl
      # (dps_tpm), and az_mqtt has no OpenSSL TLS there for key references (hsm_pkcs11).
      - name: Check dependencies
        run: >
          cmake -DBUILD_DIR=build/${{ matrix.preset }} -DCONFIG=${{ matrix.build_type }}
          "-DFORBID=rust_mqtt${{ matrix.with_paho == 'OFF' && ';paho' || '' }}"
          "-DEXPECT_SAMPLES=${{ matrix.with_paho == 'OFF' && 'az_mqtt' || 'paho;az_mqtt' }}"
          "-DEXPECT_SAMPLES_EXCEPT=${{ runner.os == 'Windows' && 'dps_tpm;http_download;hsm_pkcs11:az_mqtt' || '' }}"
          -P eng/check-dependencies.cmake
      - name: Check dependencies (negative control)
        if: matrix.with_paho == 'ON'
        run: >
          cmake -DBUILD_DIR=build/${{ matrix.preset }} -DCONFIG=${{ matrix.build_type }}
          -DFORBID=paho -DEXPECT_FAIL=ON -P eng/check-dependencies.cmake

      - name: Test
        env:
          # This job does not run inside a container, so the mosquitto service
          # container is published on the runner's own localhost -- NOT at the
          # service label `mosquitto`, which only resolves for containerized
          # jobs. Only the Linux presets register the conformance suites
          # (AZ_IOT_BUILD_CONFORMANCE_TESTS is set in linux-base), so on Windows
          # there is nothing that wants a broker and nothing to point at one.
          AZ_IOT_MQTT_BROKER_HOST: ${{ runner.os == 'Linux' && 'localhost' || '' }}
          AZ_IOT_MQTT_BROKER_PORT: ${{ runner.os == 'Linux' && '1883' || '' }}
          # The Paho harness declares AZ_IOT_CONFORMANCE_CAP_KEY_CUSTODY, and an
          # unproven capability now FAILS the suite rather than warning. The
          # Linux legs DO build the TLS conformance cases (linux-base sets
          # AZ_IOT_BUILD_CONFORMANCE_TESTS_TLS); what they lack is a PKCS#11
          # token and a certificate, so they cannot exercise that contract.
          # Accepting that here is a deliberate choice, not an accident: the
          # coverage job below provisions a real token and proves it on every
          # push.
          AZ_IOT_CONFORMANCE_ALLOW_UNPROVEN: '1'
        run: ctest --preset ${{ matrix.preset }} ${{ runner.os == 'Windows' && format('-C {0}', matrix.build_type) || '' }} --output-on-failure

  conventions:
    name: coding conventions (c/src)
    needs: changes
    if: needs.changes.outputs.c == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Guards the rules in c/docs/eng/coding-conventions.md. Cheap and
      # dependency-free on purpose: it is the only part of those rules that a
      # reviewer cannot forget to apply.
      - name: Check for banned constructs
        run: bash eng/check-banned-constructs.sh
      - name: Check generation layering
        run: bash eng/check-layering.sh
      - name: Check version consistency
        run: bash eng/check-version.sh
      - name: Check log components
        run: bash eng/check-log-components.sh
      - name: Check race-detector suppressions
        run: >
          bash eng/check-race-suppressions.sh
          && bash eng/check-race-suppressions.sh --self-test
      # Pinned: clang-format output differs between major versions, so an
      # unpinned binary would make the gate flap when the runner image moves.
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - name: Check formatting
        env:
          CLANG_FORMAT: clang-format-18
        run: bash eng/code-style.sh check

  # C99 is the language baseline. The later standards guard forward
  # compatibility: C23 makes bool, true, false, static_assert, alignas,
  # alignof, thread_local, nullptr and typeof keywords, and GCC 15 defaults to
  # gnu23. The c99 leg keeps the check name of the former c99-strict job.
  c-standards:
    name: ${{ matrix.std }}-strict (gcc -pedantic)
    needs: changes
    if: needs.changes.outputs.c == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - std: c99
            cmake_std: '99'
          - std: c11
            cmake_std: '11'
          - std: c17
            cmake_std: '17'
          - std: c23
            cmake_std: '23'
    env:
      # Pinned for every leg so only the standard varies. GCC 14 is the first
      # release that accepts -std=c23.
      CC: gcc-14
    services:
      mosquitto:
        image: eclipse-mosquitto:2
        ports:
          - 1883:1883
        # This job previously had no health check at all, which was harmless
        # only because AZ_IOT_AEG_BUILD_TESTS meant it never ran a test. It now
        # builds and runs the conformance suites, which connect immediately, so
        # it needs to wait for the broker like every other job.
        options: >-
          --health-cmd="mosquitto_pub -h localhost -p 1883 -t healthcheck -m ok"
          --health-interval=5s
          --health-retries=10
          --health-start-period=5s
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build gcc-14
      - name: Configure (${{ matrix.std }} strict)
        # CMAKE_C_STANDARD sets the standard of first-party targets, which
        # would otherwise override the -std in CMAKE_C_FLAGS; the flag covers
        # FetchContent dependencies that do not set one.
        run: >
          cmake -S . -B build/${{ matrix.std }}-strict -G Ninja
          -DCMAKE_C_COMPILER=${{ env.CC }}
          -DCMAKE_C_STANDARD=${{ matrix.cmake_std }}
          -DAZ_IOT_WITH_PAHO=ON
          -DAZ_IOT_BUILD_TESTS=ON
          -DAZ_IOT_BUILD_CONFORMANCE_TESTS=ON
          -DCMAKE_C_FLAGS="-std=${{ matrix.std }} -pedantic -Wall -Wextra -Werror"
      - name: Verify the requested standard is in effect
        # Fails if any first-party object would build under another standard,
        # e.g. a hard-coded C99. The last -std= on a compile line wins. _deps/
        # is excluded: azure-sdk-for-c pins its own C_STANDARD 99. CMake spells
        # C23 as -std=c2x or -std=c23 depending on its version.
        working-directory: c/build/${{ matrix.std }}-strict
        run: |
          want='^-std=${{ matrix.std }}$'
          [ '${{ matrix.std }}' = c23 ] && want='^-std=c(23|2x)$'
          awk -v want="$want" '
            /^build [^:]*\.o: C_COMPILER__/ { obj = $2; sub(/:$/, "", obj); next }
            obj != "" && /^ *FLAGS = / {
              std = "none"; n = split($0, a, " ")
              for (i = 1; i <= n; i++) if (a[i] ~ /^-std=/) std = a[i]
              if (obj !~ /^_deps\//) {
                checked++
                if (std !~ want) { print "::error::" obj " builds with " std; bad = 1 }
              }
              obj = ""
            }
            END {
              print checked + 0 " first-party objects checked"
              exit (bad || !checked)
            }' build.ninja
      - name: Build
        run: cmake --build build/${{ matrix.std }}-strict
      - name: Test
        env:
          AZ_IOT_MQTT_BROKER_HOST: localhost
          AZ_IOT_MQTT_BROKER_PORT: '1883'
          # The Paho harness declares AZ_IOT_CONFORMANCE_CAP_KEY_CUSTODY, and an
          # unproven capability now FAILS the suite rather than warning. This
          # build configures without AZ_IOT_BUILD_CONFORMANCE_TESTS_TLS and has
          # no PKCS#11 token, so it cannot exercise that contract. Accepting
          # that here is a deliberate choice, not an accident: the coverage job
          # below provisions a real token and proves it on every push.
          AZ_IOT_CONFORMANCE_ALLOW_UNPROVEN: '1'
        run: ctest --test-dir build/${{ matrix.std }}-strict --output-on-failure

  # ---------------------------------------------------------------------------
  # Memory-checker jobs. Run the full test set (excluding the broker-gated
  # conformance harnesses) under a runtime sanitizer:
  #   * Linux  : Valgrind  (ctest -T memcheck driven by MEMORYCHECK_COMMAND).
  #   * Windows: MSVC AddressSanitizer (`/fsanitize=address`).
  # AppVerifier is the "classic" Windows equivalent but is registry-driven via
  # Image File Execution Options, brittle in a CI matrix, and can't be
  # configured per-build-tree. ASan via MSVC has been the recommended Windows
  # heap/UAF/OOB checker since VS 16.9 and works directly with the cmocka test
  # exes the rest of this workflow already builds.
  # ---------------------------------------------------------------------------

  valgrind:
    name: linux-gcc / valgrind
    needs: changes
    if: needs.changes.outputs.c == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    services:
      mosquitto:
        image: eclipse-mosquitto:2
        ports:
          - 1883:1883
        options: >-
          --health-cmd="mosquitto_pub -h localhost -p 1883 -t healthcheck -m ok"
          --health-interval=5s
          --health-retries=10
          --health-start-period=5s
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build valgrind
      - name: Configure
        run: >
          cmake --preset linux-gcc-debug
          -DAZ_IOT_WITH_PAHO=ON
          -DAZ_IOT_WITH_RUST_MQTT=ON
      - name: Build
        run: cmake --build --preset linux-gcc-debug
      - name: Test under valgrind
        env:
          # Set for completeness. This step excludes the conformance suites
          # anyway (-E conformance): running a live-broker network suite under
          # valgrind is slow and its failures would be about the broker, not
          # about memory.
          AZ_IOT_MQTT_BROKER_HOST: localhost
          AZ_IOT_MQTT_BROKER_PORT: '1883'
        working-directory: c/build/linux-gcc-debug
        run: |
          ctest --output-on-failure -E conformance \
            --overwrite MemoryCheckCommand=/usr/bin/valgrind \
            --overwrite "MemoryCheckCommandOptions=--error-exitcode=1 --leak-check=full --show-leak-kinds=definite,possible --track-origins=yes --errors-for-leak-kinds=definite,possible" \
            -T memcheck
          if grep -lE "Defects: [1-9]" Testing/Temporary/MemoryChecker.*.log 2>/dev/null; then
            echo "::error::valgrind found memory defects"
            grep -E "Defects: [1-9]" Testing/Temporary/MemoryChecker.*.log
            exit 1
          fi
      - name: Upload valgrind logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: valgrind-logs
          path: c/build/linux-gcc-debug/Testing/Temporary/MemoryChecker.*.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Race detection. Separate from the valgrind job above because it answers a
  # different question, with a different tool.
  #
  # memcheck and ASan look at WHICH memory is touched, not at which thread
  # touched it or under which lock, so neither can see a data race. A race
  # whose timing does not bite on the runner is invisible to them: the Paho
  # adapter once published a queued event to the consumer thread and then kept
  # writing to it, and every other job passed.
  #
  # Runs every ctest test labelled "race" (az_iot_add_cmocka_test(... RACE
  # ...)) through eng/run-race-detectors.sh, which fails on a reported error,
  # a failed test, or a run that ended without an ERROR SUMMARY. A new
  # threaded test joins by carrying the label.
  #
  # One leg per tool; either reporting an error fails the job. They implement
  # happens-before differently and DRD also reports lock-order and mutex
  # misuse, so running both is coverage rather than duplication. Suppressions:
  # eng/sanitizers/<tool>.supp, third-party code only
  # (eng/check-race-suppressions.sh); every suppression used is in the log.
  # ---------------------------------------------------------------------------
  race-detector:
    name: linux-gcc / ${{ matrix.tool }}
    needs: changes
    if: needs.changes.outputs.c == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      mosquitto:
        image: eclipse-mosquitto:2
        ports:
          - 1883:1883
        options: >-
          --health-cmd="mosquitto_pub -h localhost -p 1883 -t healthcheck -m ok"
          --health-interval=5s
          --health-retries=10
          --health-start-period=5s
    strategy:
      fail-fast: false
      matrix:
        tool: [ helgrind, drd ]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build valgrind libssl-dev
      - name: Configure
        # Conformance ON registers the real-stack race tests (Paho conformance,
        # reconnect, teardown) against the broker service. RACE_ANNOTATIONS
        # describes the SDK's atomic spin lock to the tools (valgrind
        # package ships <valgrind/helgrind.h>).
        run: >
          cmake --preset linux-gcc-debug
          -DAZ_IOT_WITH_PAHO=ON
          -DAZ_IOT_RACE_ANNOTATIONS=ON
          -DAZ_IOT_BUILD_CONFORMANCE_TESTS=ON
          -DAZ_IOT_BUILD_CONFORMANCE_TESTS_TLS=ON
      - name: Build
        run: cmake --build --preset linux-gcc-debug
      - name: Race-labelled tests under ${{ matrix.tool }}
        env:
          AZ_IOT_MQTT_BROKER_HOST: localhost
          AZ_IOT_MQTT_BROKER_PORT: '1883'
          # No PKCS#11 token on this leg.
          AZ_IOT_CONFORMANCE_ALLOW_UNPROVEN: '1'
          # The tools slow the stack ~10-50x; lengthens test waits only.
          AZ_IOT_TEST_TIMEOUT_SCALE: '30'
        run: bash eng/run-race-detectors.sh ${{ matrix.tool }}
      - name: Upload race-detector logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: race-detector-logs-${{ matrix.tool }}
          path: c/build/linux-gcc-debug/race-logs/
          if-no-files-found: ignore

  asan-windows:
    name: windows-msvc / ASan
    needs: changes
    if: needs.changes.outputs.c == 'true' || github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Configure (MSVC AddressSanitizer)
        # Disable Paho here: pulling it in through FetchContent forces the
        # /MD[d] runtime which conflicts with /fsanitize=address's internal
        # runtime selection on some toolchain builds. The first-party suites,
        # the az_mqtt adapter (Schannel) and the rust_mqtt shell are what ASan
        # vets here.
        #
        # NOTE: until this commit these were AZ_IOT_AEG_* -- names no option
        # ever declared -- so Paho was in fact ON here, contradicting the
        # paragraph above. It is genuinely OFF now.
        shell: pwsh
        run: >
          cmake --preset windows-msvc-debug
          -DAZ_IOT_WITH_PAHO=OFF
          -DAZ_IOT_WITH_AZ_MQTT=ON
          -DAZ_IOT_WITH_RUST_MQTT=ON
          -DCMAKE_C_FLAGS="/fsanitize=address /Zi"
      - name: Build
        run: cmake --build --preset windows-msvc-debug --config Debug
      - name: Test under ASan
        # ASan reports a non-zero exit code on any detected defect; ctest
        # surfaces that as a test failure in the standard way. The Windows
        # preset does not register the conformance suites, so -E conformance is
        # belt-and-braces rather than load-bearing.
        run: ctest --preset windows-msvc-debug -C Debug --output-on-failure -E conformance

  # AddressSanitizer + UndefinedBehaviorSanitizer on Linux, including the
  # conformance suites against a real broker. Paho is built instrumented too.
  asan-ubsan-linux:
    name: linux-clang / ASan + UBSan
    needs: changes
    if: needs.changes.outputs.c == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      mosquitto:
        image: eclipse-mosquitto:2
        ports:
          - 1883:1883
        options: >-
          --health-cmd="mosquitto_pub -h localhost -p 1883 -t healthcheck -m ok"
          --health-interval=5s
          --health-retries=10
          --health-start-period=5s
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev
      - name: Configure
        # UBSan stays recoverable so eng/sanitizers/ubsan.supp can silence
        # third-party findings; halt_on_error below still stops on any other.
        run: >
          cmake --preset linux-clang-debug
          -DAZ_IOT_WITH_PAHO=ON
          -DAZ_IOT_WITH_RUST_MQTT=ON
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build --preset linux-clang-debug
      - name: Test under ASan + UBSan
        env:
          AZ_IOT_MQTT_BROKER_HOST: localhost
          AZ_IOT_MQTT_BROKER_PORT: '1883'
          # Same reason as the build job: no PKCS#11 token on this leg.
          AZ_IOT_CONFORMANCE_ALLOW_UNPROVEN: '1'
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1:strict_string_checks=1:check_initialization_order=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1:suppressions=${{ github.workspace }}/c/eng/sanitizers/ubsan.supp
        # Function-name suppressions (and readable stacks) need clang's own symbolizer.
        run: |
          symbolizer="$(clang -print-prog-name=llvm-symbolizer)"
          test -x "$symbolizer"
          export ASAN_SYMBOLIZER_PATH="$symbolizer"
          export UBSAN_OPTIONS="$UBSAN_OPTIONS:external_symbolizer_path=$symbolizer"
          ctest --preset linux-clang-debug --output-on-failure

  # ThreadSanitizer over the whole ctest set, conformance against a real broker
  # included. Paho is built instrumented too. TSan needs fewer ASLR bits than
  # the runner kernel's default, hence the sysctl.
  tsan-linux:
    name: linux-gcc / TSan
    needs: changes
    if: needs.changes.outputs.c == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      mosquitto:
        image: eclipse-mosquitto:2
        ports:
          - 1883:1883
        options: >-
          --health-cmd="mosquitto_pub -h localhost -p 1883 -t healthcheck -m ok"
          --health-interval=5s
          --health-retries=10
          --health-start-period=5s
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev
      - name: Configure
        # _GNU_SOURCE: replacing CMAKE_C_FLAGS otherwise leaves cmocka without
        # sigjmp_buf under -std=c99.
        run: >
          cmake --preset linux-gcc-debug
          -DAZ_IOT_WITH_PAHO=ON
          -DAZ_IOT_WITH_AZ_MQTT=ON
          -DCMAKE_C_FLAGS="-D_GNU_SOURCE -fsanitize=thread -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=thread"
      - name: Build
        run: cmake --build --preset linux-gcc-debug
      - name: Reduce ASLR entropy for TSan
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Test under TSan
        env:
          AZ_IOT_MQTT_BROKER_HOST: localhost
          AZ_IOT_MQTT_BROKER_PORT: '1883'
          # No PKCS#11 token on this leg.
          AZ_IOT_CONFORMANCE_ALLOW_UNPROVEN: '1'
          # TSan slows the stack ~5-15x; lengthens test waits only.
          AZ_IOT_TEST_TIMEOUT_SCALE: '10'
          TSAN_OPTIONS: halt_on_error=0:exitcode=66:second_deadlock_stack=1:history_size=4:suppressions=${{ github.workspace }}/c/eng/sanitizers/tsan.supp
        run: ctest --preset linux-gcc-debug --output-on-failure --timeout 1800

  # ---------------------------------------------------------------------------
  # Software updates mbedTLS crypto adapter, once per maintained mbedTLS branch
  # (3.6 LTS, 4.1 LTS, latest). No distro ships these, so each leg builds the
  # pinned release. The known-answer suite also runs under valgrind.
  # ---------------------------------------------------------------------------
  crypto-mbedtls:
    name: crypto / mbedTLS ${{ matrix.mbedtls }}
    needs: changes
    if: needs.changes.outputs.c == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mbedtls: [ '3.6.7', '4.1.1', '4.2.0' ]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev valgrind
      - name: Build mbedTLS ${{ matrix.mbedtls }}
        run: bash eng/install-mbedtls.sh ${{ matrix.mbedtls }} "$RUNNER_TEMP/mbedtls"
      - name: Configure
        run: >
          cmake -S . -B build/su-mbedtls -G Ninja
          -DCMAKE_C_COMPILER=gcc -DCMAKE_BUILD_TYPE=Debug
          -DAZ_IOT_BUILD_TESTS=ON -DAZ_IOT_WITH_PAHO=OFF -DAZ_IOT_BUILD_SAMPLES=OFF
          -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/mbedtls"
      - name: Build
        run: cmake --build build/su-mbedtls --target az_iot_tests_crypto_mbedtls az_iot_tests_crypto_openssl
      - name: Test
        run: ctest --test-dir build/su-mbedtls --output-on-failure -R '^az_iot_tests_crypto_' --no-tests=error
      - name: Test under valgrind
        run: >
          valgrind --error-exitcode=1 --leak-check=full --show-leak-kinds=definite,possible
          --track-origins=yes --errors-for-leak-kinds=definite,possible
          build/su-mbedtls/tests/az_iot_tests_crypto_mbedtls

  # ---------------------------------------------------------------------------
  # az_mqtt adapter conformance, every capability it implements: proxy (the
  # suite's own), WebSockets (a Mosquitto WebSocket listener) and, on OpenSSL,
  # the key-reference custody route (a SoftHSM token, as in coverage-c). The
  # build job also runs these suites, without WebSockets or a token.
  # ---------------------------------------------------------------------------
  az-mqtt:
    name: az_mqtt adapter / ${{ matrix.tls }}
    needs: changes
    if: needs.changes.outputs.c == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - tls: openssl
            mbedtls: ''
          - tls: mbedtls
            mbedtls: '4.1.1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install deps
        run: >
          sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev mosquitto
          mosquitto-clients softhsm2 opensc meson pkg-config
      - name: Start Mosquitto (TCP 1883, WebSocket 8080)
        run: |
          sudo systemctl stop mosquitto || true
          printf 'listener 1883 127.0.0.1\nallow_anonymous true\nlistener 8080 127.0.0.1\nprotocol websockets\n' \
            > "$RUNNER_TEMP/mosquitto.conf"
          mosquitto -d -c "$RUNNER_TEMP/mosquitto.conf"
          for _ in $(seq 1 20); do
            mosquitto_pub -h 127.0.0.1 -p 1883 -t az-iot/probe -m ok && break
            sleep 1
          done
          mosquitto_pub -h 127.0.0.1 -p 1883 -t az-iot/probe -m ok
      - name: Build mbedTLS ${{ matrix.mbedtls }}
        if: matrix.mbedtls != ''
        run: |
          bash eng/install-mbedtls.sh ${{ matrix.mbedtls }} "$RUNNER_TEMP/mbedtls"
          echo "CMAKE_PREFIX_PATH=$RUNNER_TEMP/mbedtls" >> "$GITHUB_ENV"
      - name: Provision a PKCS#11 token
        if: matrix.tls == 'openssl'
        run: |
          eval "$(eng/setup-pkcs11-provider.sh)"
          echo "OPENSSL_MODULES=$OPENSSL_MODULES" >> "$GITHUB_ENV"
          openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 \
                          -out "$RUNNER_TEMP/custody-key.pem"
          openssl req -new -x509 -key "$RUNNER_TEMP/custody-key.pem" \
                      -out "$RUNNER_TEMP/custody-cert.pem" -days 2 \
                      -subj "/CN=az-iot-conformance-custody" \
                      -addext "basicConstraints=critical,CA:FALSE" \
                      -addext "extendedKeyUsage=clientAuth"
          eng/setup-softhsm.sh "$RUNNER_TEMP/custody-key.pem" > "$RUNNER_TEMP/softhsm-env.sh"
          sed -E "s/^export ([A-Za-z0-9_]+)='(.*)'\$/\1=\2/" \
              "$RUNNER_TEMP/softhsm-env.sh" >> "$GITHUB_ENV"
          . "$RUNNER_TEMP/softhsm-env.sh"
          openssl list -providers -provider pkcs11 > /dev/null
          {
            echo "AZ_IOT_CONFORMANCE_KEY_URI=$AZ_IOT_CLIENT_KEY_URI"
            echo "AZ_IOT_CONFORMANCE_KEY_ENGINE=$AZ_IOT_CRYPTO_ENGINE_ID"
            echo "AZ_IOT_CONFORMANCE_CLIENT_CERT=$RUNNER_TEMP/custody-cert.pem"
          } >> "$GITHUB_ENV"
      - name: Configure
        run: >
          cmake -S . -B build/az-mqtt -G Ninja
          -DCMAKE_C_COMPILER=gcc -DCMAKE_BUILD_TYPE=Debug
          -DAZ_IOT_BUILD_TESTS=ON -DAZ_IOT_BUILD_SAMPLES=OFF -DAZ_IOT_WITH_PAHO=OFF
          -DAZ_IOT_WITH_AZ_MQTT=ON -DAZ_IOT_AZ_MQTT_TLS=${{ matrix.tls }}
          -DAZ_IOT_BUILD_CONFORMANCE_TESTS=ON -DAZ_IOT_BUILD_CONFORMANCE_TESTS_TLS=ON
      - name: Build
        run: cmake --build build/az-mqtt --target az_iot_conformance_az_mqtt_v3 az_iot_conformance_az_mqtt_v5 az_iot_az_mqtt_adapter_broker
      - name: Conformance
        env:
          AZ_IOT_MQTT_BROKER_HOST: 127.0.0.1
          AZ_IOT_MQTT_BROKER_PORT: '1883'
          AZ_IOT_CONFORMANCE_WS_PORT: '8080'
          AZ_IOT_CONFORMANCE_WS_PATH: /mqtt
        run: ctest --test-dir build/az-mqtt --output-on-failure -R '^az_iot_(conformance_az_mqtt_|az_mqtt_adapter_broker$)' --no-tests=error

  # ---------------------------------------------------------------------------
  # No Paho, no OpenSSL, no libcurl: the whole tree (tests, samples) on az_mqtt
  # over mbedTLS, with the mbedTLS crypto backend, must build, pass and install
  # without referencing any of them. The az_mqtt suites run against Mosquitto;
  # their TLS case needs the OpenSSL test proxy, so it is proven by
  # az-mqtt / mbedtls instead (AZ_IOT_CONFORMANCE_ALLOW_UNPROVEN).
  # ---------------------------------------------------------------------------
  deps-isolation:
    name: deps-isolation / az_mqtt + mbedTLS (no Paho, OpenSSL, libcurl)
    needs: changes
    if: needs.changes.outputs.c == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build mosquitto mosquitto-clients
      - name: Start Mosquitto (TCP 1883, WebSocket 8080)
        run: |
          sudo systemctl stop mosquitto || true
          printf 'listener 1883 127.0.0.1\nallow_anonymous true\nlistener 8080 127.0.0.1\nprotocol websockets\n' \
            > "$RUNNER_TEMP/mosquitto.conf"
          mosquitto -d -c "$RUNNER_TEMP/mosquitto.conf"
          for _ in $(seq 1 20); do
            mosquitto_pub -h 127.0.0.1 -p 1883 -t az-iot/probe -m ok && break
            sleep 1
          done
          mosquitto_pub -h 127.0.0.1 -p 1883 -t az-iot/probe -m ok
      - name: Build mbedTLS 4.1.1
        run: bash eng/install-mbedtls.sh 4.1.1 "$RUNNER_TEMP/mbedtls"
      - name: Configure
        run: >
          cmake -DBUILD_DIR=build/isolation -DMODE=prepare -P eng/check-dependencies.cmake &&
          cmake -S . -B build/isolation -G Ninja
          -DCMAKE_C_COMPILER=gcc -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/mbedtls"
          -DCMAKE_DISABLE_FIND_PACKAGE_OpenSSL=ON -DCMAKE_DISABLE_FIND_PACKAGE_CURL=ON
          -DAZ_IOT_WITH_PAHO=OFF -DAZ_IOT_WITH_AZ_MQTT=ON -DAZ_IOT_AZ_MQTT_TLS=mbedtls
          -DAZ_IOT_WITH_CRYPTO_OPENSSL=OFF -DAZ_IOT_WITH_CERT_PROVIDER_MANAGED=OFF
          -DAZ_IOT_BUILD_TESTS=ON -DAZ_IOT_BUILD_SAMPLES=ON -DAZ_IOT_BUILD_CONFORMANCE_TESTS=ON
      - name: Build
        run: cmake --build build/isolation
      - name: Test
        env:
          AZ_IOT_MQTT_BROKER_HOST: 127.0.0.1
          AZ_IOT_MQTT_BROKER_PORT: '1883'
          AZ_IOT_CONFORMANCE_WS_PORT: '8080'
          AZ_IOT_CONFORMANCE_WS_PATH: /mqtt
          AZ_IOT_CONFORMANCE_ALLOW_UNPROVEN: '1'
        run: ctest --test-dir build/isolation --output-on-failure --no-tests=error
      - name: Install
        run: cmake --install build/isolation --prefix "$RUNNER_TEMP/az-iot-sdk"
      # Not built: the samples that need OpenSSL (managed provider, CSR, PKCS#11
      # custody, OpenSSL-signed tokens, simulated TPM).
      - name: Check dependencies
        run: >
          cmake -DBUILD_DIR=build/isolation -DINSTALL_PREFIX="$RUNNER_TEMP/az-iot-sdk"
          "-DFORBID=paho;rust_mqtt;openssl;curl"
          -DEXPECT_SAMPLES=az_mqtt
          "-DEXPECT_SAMPLES_EXCEPT=custom_certificate_provider;dps_csr_managed;dps_persist_assignment;hub_renew;dps_sas_key_issued_cert;user_provided_sas_token;dps_tpm;http_download;hsm_pkcs11"
          -P eng/check-dependencies.cmake

  # Optimized build (so _FORTIFY_SOURCE is active) checked by
  # eng/check-hardening.sh, then the unit tests run against it. Both compilers,
  # static and shared: flags are probed per toolchain, and FORTIFY differs
  # between them (glibc makes some libc calls macros under clang).
  hardening-linux:
    name: linux-${{ matrix.compiler }}${{ matrix.shared == 'ON' && '-shared' || '' }} / hardening (RelWithDebInfo)
    needs: changes
    if: needs.changes.outputs.c == 'true' || github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        compiler: [ gcc, clang ]
        shared: [ 'OFF', 'ON' ]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev
      - name: Configure
        run: >
          cmake -DBUILD_DIR=build/hardening -DMODE=prepare -P eng/check-dependencies.cmake &&
          cmake -S . -B build/hardening -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=${{ matrix.compiler }}
          -DBUILD_SHARED_LIBS=${{ matrix.shared }}
          -DAZ_IOT_BUILD_TESTS=ON
          -DAZ_IOT_WITH_PAHO=ON
          -DAZ_IOT_WITH_RUST_MQTT=ON
      - name: Build
        run: cmake --build build/hardening
      - name: Check binaries
        run: bash eng/check-hardening.sh build/hardening
      # az_mqtt is off by default: nothing may depend on it.
      - name: Check dependencies
        run: cmake -DBUILD_DIR=build/hardening -DFORBID=az_mqtt -P eng/check-dependencies.cmake
      - name: Unit tests
        run: ctest --test-dir build/hardening --output-on-failure

  # MSVC counterpart: /guard:cf, /CETCOMPAT and /sdl, checked with dumpbin.
  # Samples are off in the shared leg: Windows shared builds put every
  # executable in one bin/, and sample names repeat across groups (as in the
  # install job).
  hardening-windows:
    name: windows-msvc${{ matrix.shared == 'ON' && '-shared' || '' }} / hardening (RelWithDebInfo)
    needs: changes
    if: needs.changes.outputs.c == 'true' || github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        shared: [ 'OFF', 'ON' ]
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: c
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Configure
        run: >
          cmake -DBUILD_DIR=build/hardening -DMODE=prepare -P eng/check-dependencies.cmake &&
          cmake -S . -B build/hardening -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DBUILD_SHARED_LIBS=${{ matrix.shared }}
          -DAZ_IOT_BUILD_SAMPLES=${{ matrix.shared == 'ON' && 'OFF' || 'ON' }}
          -DAZ_IOT_BUILD_TESTS=ON
          -DAZ_IOT_WITH_PAHO=ON
          -DAZ_IOT_WITH_RUST_MQTT=ON
      - name: Build
        run: cmake --build build/hardening
      - name: Check binaries
        run: bash eng/check-hardening.sh build/hardening
      # az_mqtt is off by default: nothing may depend on it.
      - name: Check dependencies
        run: cmake -DBUILD_DIR=build/hardening -DFORBID=az_mqtt -P eng/check-dependencies.cmake
      - name: Unit tests
        run: ctest --test-dir build/hardening --output-on-failure

  # Installed dependencies on MSVC: azure-sdk-for-c from eng/install-deps.sh
  # (Release in lib, Debug in debug/lib) and Paho from vcpkg (c/vcpkg.json
  # `installed-paho`, static triplet for /MT[d]). Debug and Release are each
  # built, unit-tested, installed and consumed (c/tests/install).
  # VCPKG_APPLOCAL_DEPS=OFF: a static triplet has no DLLs to copy, and the
  # post-link copy step fails on locked files under parallel Ninja links.
  installed-deps-windows:
    name: windows-msvc / installed deps
    needs: changes
    if: needs.changes.outputs.c == 'true' || github.event_name != 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: c
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      # The runner's vcpkg clone must contain the manifest's builtin-baseline.
      - name: Locate vcpkg
        shell: pwsh
        run: |
          $root = $env:VCPKG_INSTALLATION_ROOT
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          git -C $root rev-parse --verify --quiet "$baseline^{commit}" | Out-Null
          if ($LASTEXITCODE) {
            $fetch = @('fetch', '--quiet', 'origin')
            if ((git -C $root rev-parse --is-shallow-repository) -eq 'true') {
              $fetch = @('fetch', '--quiet', '--unshallow', 'origin')
            }
            git -C $root @fetch
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          "AZ_IOT_VCPKG=$root" >> $env:GITHUB_ENV
      - name: Set paths
        run: |
          tmp="$(cygpath -m "$RUNNER_TEMP")"
          {
            echo "AZ_IOT_DEPS=$tmp/deps"
            echo "AZ_IOT_BUILD=$tmp/build"
            echo "AZ_IOT_TOOLCHAIN=$(cygpath -m "$AZ_IOT_VCPKG")/scripts/buildsystems/vcpkg.cmake"
          } >> "$GITHUB_ENV"
      - name: Install azure-sdk-for-c
        run: bash eng/install-deps.sh "$AZ_IOT_DEPS" azure-sdk-for-c
      - name: Configure
        run: >
          cmake -S . -B "$AZ_IOT_BUILD" -G "Ninja Multi-Config"
          -DCMAKE_TOOLCHAIN_FILE="$AZ_IOT_TOOLCHAIN"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static
          -DVCPKG_MANIFEST_FEATURES=installed-paho
          -DVCPKG_APPLOCAL_DEPS=OFF
          -DCMAKE_PREFIX_PATH="$AZ_IOT_DEPS"
          -DAZ_IOT_USE_INSTALLED_AZURE_SDK_FOR_C=ON
          -DAZ_IOT_USE_INSTALLED_PAHO=ON
          -DAZ_IOT_BUILD_TESTS=ON
          -DAZ_IOT_BUILD_SAMPLES=OFF
      - name: Build, test, install and consume
        run: |
          set -euo pipefail
          # The consumer resolves the vcpkg packages (Paho, OpenSSL) per configuration.
          vcpkg_args=(
            -DCMAKE_TOOLCHAIN_FILE="$AZ_IOT_TOOLCHAIN"
            -DVCPKG_TARGET_TRIPLET=x64-windows-static
            -DVCPKG_INSTALLED_DIR="$AZ_IOT_BUILD/vcpkg_installed"
            -DVCPKG_MANIFEST_MODE=OFF
            -DVCPKG_APPLOCAL_DEPS=OFF
          )
          for cfg in Debug Release; do
            cmake --build "$AZ_IOT_BUILD" --config "$cfg"
            ctest --test-dir "$AZ_IOT_BUILD" -C "$cfg" --output-on-failure --no-tests=error
            prefix="$AZ_IOT_BUILD-$cfg-prefix"
            cmake --install "$AZ_IOT_BUILD" --config "$cfg" --prefix "$prefix"
            cmake -S tests/install -B "$AZ_IOT_BUILD-$cfg-consumer" -G Ninja \
              -DCMAKE_BUILD_TYPE="$cfg" "${vcpkg_args[@]}" \
              -DCMAKE_PREFIX_PATH="$prefix;$AZ_IOT_DEPS" \
              -DAZ_IOT_EXPECTED_COMPONENTS="core;mqttv3;mqttv5;adapter_paho;crypto_openssl;certificate_provider_managed"
            cmake --build "$AZ_IOT_BUILD-$cfg-consumer"
            ctest --test-dir "$AZ_IOT_BUILD-$cfg-consumer" --output-on-failure --no-tests=error
          done

  # ---------------------------------------------------------------------------
  # The installed package (cmake --install, find_package(azure-iot-sdk)).
  #
  # A Release build with every shipped adapter is unit-tested and installed.
  # c/tests/install then builds and runs against the install prefix alone: the
  # build tree is deleted first, and the prefix must hold no path back into the
  # checkout. Each adapter is a REQUIRED component there, so one dropping out of
  # the package fails the job. mbedTLS is Linux-only, as in crypto-mbedtls.
  # Configured with one prefix and installed with `--prefix` to another: the
  # installed files must use the install-time prefix.
  # The -shared variants build core, mqttv3 and mqttv5 as shared libraries.
  # -installed-deps uses azure-sdk-for-c and Paho from a prefix (AZ_IOT_USE_INSTALLED_*).
  # -no-paho builds without Paho: neither the build nor the package may reference
  # it, and asking the package for adapter_paho must fail.
  # ---------------------------------------------------------------------------
  install:
    name: install / ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.c == 'true' || github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-gcc
            shared: 'OFF'
            mbedtls: '3.6.7'
            components: core;mqttv3;mqttv5;adapter_paho;adapter_az_mqtt;adapter_rust_mqtt;crypto_openssl;crypto_mbedtls;certificate_provider_managed
          - os: ubuntu-24.04
            name: linux-gcc-shared
            shared: 'ON'
            mbedtls: '3.6.7'
            components: core;mqttv3;mqttv5;adapter_paho;adapter_az_mqtt;adapter_rust_mqtt;crypto_openssl;crypto_mbedtls;certificate_provider_managed
          # azure-sdk-for-c and Paho from an install prefix (eng/install-deps.sh), not fetched.
          - os: ubuntu-24.04
            name: linux-gcc-installed-deps
            shared: 'OFF'
            mbedtls: '3.6.7'
            installed_deps: 'ON'
            components: core;mqttv3;mqttv5;adapter_paho;adapter_az_mqtt;adapter_rust_mqtt;crypto_openssl;crypto_mbedtls;certificate_provider_managed
          - os: windows-latest
            name: windows-msvc
            shared: 'OFF'
            mbedtls: ''
            components: core;mqttv3;mqttv5;adapter_paho;adapter_az_mqtt;adapter_rust_mqtt;crypto_openssl;certificate_provider_managed
          - os: windows-latest
            name: windows-msvc-shared
            shared: 'ON'
            mbedtls: ''
            components: core;mqttv3;mqttv5;adapter_paho;adapter_az_mqtt;adapter_rust_mqtt;crypto_openssl;certificate_provider_managed
          - os: ubuntu-24.04
            name: linux-gcc-no-paho
            shared: 'OFF'
            mbedtls: '3.6.7'
            with_paho: 'OFF'
            components: core;mqttv3;mqttv5;adapter_az_mqtt;adapter_rust_mqtt;crypto_openssl;crypto_mbedtls;certificate_provider_managed
          - os: windows-latest
            name: windows-msvc-no-paho
            shared: 'OFF'
            mbedtls: ''
            with_paho: 'OFF'
            components: core;mqttv3;mqttv5;adapter_az_mqtt;adapter_rust_mqtt;crypto_openssl;certificate_provider_managed
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: c
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev pkg-config

      - name: Set paths
        # Forward slashes on Windows: these values end up in CMake files.
        run: |
          tmp="$(cygpath -m "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")"
          mbedtls=""
          if [ -n "${{ matrix.mbedtls }}" ]; then mbedtls="$tmp/mbedtls"; fi
          deps=""
          if [ "${{ matrix.installed_deps }}" = "ON" ]; then deps="$tmp/deps"; fi
          {
            echo "AZ_IOT_CONFIGURED_PREFIX=$tmp/az-iot-sdk-configured"
            echo "AZ_IOT_PREFIX=$tmp/az-iot-sdk"
            echo "AZ_IOT_CONSUMER=$tmp/install-test"
            echo "AZ_IOT_MBEDTLS=$mbedtls"
            echo "AZ_IOT_DEPS=$deps"
          } >> "$GITHUB_ENV"

      - name: Build mbedTLS ${{ matrix.mbedtls }}
        if: matrix.mbedtls != ''
        run: bash eng/install-mbedtls.sh ${{ matrix.mbedtls }} "$AZ_IOT_MBEDTLS"

      - name: Install azure-sdk-for-c and Paho
        if: matrix.installed_deps == 'ON'
        run: bash eng/install-deps.sh "$AZ_IOT_DEPS"

      - name: Configure
        run: >
          cmake -DBUILD_DIR=build/install -DMODE=prepare -P eng/check-dependencies.cmake &&
          cmake -S . -B build/install -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX="$AZ_IOT_CONFIGURED_PREFIX"
          -DCMAKE_PREFIX_PATH="$AZ_IOT_MBEDTLS;$AZ_IOT_DEPS"
          -DAZ_IOT_USE_INSTALLED_AZURE_SDK_FOR_C=${{ matrix.installed_deps || 'OFF' }}
          -DAZ_IOT_USE_INSTALLED_PAHO=${{ matrix.installed_deps || 'OFF' }}
          -DAZ_IOT_WITH_PAHO=${{ matrix.with_paho || 'ON' }}
          -DAZ_IOT_BUILD_TESTS=ON
          -DAZ_IOT_BUILD_SAMPLES=OFF
          -DAZ_IOT_WITH_RUST_MQTT=ON
          -DAZ_IOT_WITH_AZ_MQTT=ON
          -DBUILD_SHARED_LIBS=${{ matrix.shared }}
      - name: Build
        run: cmake --build build/install
      - name: Unit tests
        run: ctest --test-dir build/install --output-on-failure --no-tests=error

      - name: Install
        run: cmake --install build/install --prefix "$AZ_IOT_PREFIX"
      - name: Check dependencies (no Paho)
        if: matrix.with_paho == 'OFF'
        run: >
          cmake -DBUILD_DIR=build/install -DINSTALL_PREFIX="$AZ_IOT_PREFIX"
          -DFORBID=paho -P eng/check-dependencies.cmake
      - name: Check the installed tree
        run: |
          test -f "$AZ_IOT_PREFIX/lib/cmake/azure-iot-sdk/azure-iot-sdk-config.cmake"
          # Test-only dependencies do not ship.
          if find "$AZ_IOT_PREFIX" -iname '*cmocka*' | grep .; then
            echo "::error::cmocka was installed"
            exit 1
          fi
          ws="$(cygpath -m "$GITHUB_WORKSPACE" 2>/dev/null || echo "$GITHUB_WORKSPACE")"
          if grep -rIil -F "$ws" "$AZ_IOT_PREFIX"; then
            echo "::error::installed files reference the checkout ($ws)"
            exit 1
          fi
          if grep -rIil -F "$AZ_IOT_CONFIGURED_PREFIX" "$AZ_IOT_PREFIX"; then
            echo "::error::installed files reference the configure-time prefix"
            exit 1
          fi
          test ! -e "$AZ_IOT_CONFIGURED_PREFIX"
          # Installed dependencies are used, not fetched.
          if [ -n "$AZ_IOT_DEPS" ]; then
            shopt -s nullglob
            fetched=(build/install/_deps/azure_sdk_for_c-* build/install/_deps/paho_mqtt_c-*)
            shopt -u nullglob
            if [ "${#fetched[@]}" -ne 0 ]; then
              echo "::error::fetched instead of using $AZ_IOT_DEPS: ${fetched[*]}"
              exit 1
            fi
          fi
          rm -rf build/install

      - name: Configure the consumer
        run: >
          cmake -S tests/install -B "$AZ_IOT_CONSUMER" -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$AZ_IOT_PREFIX;$AZ_IOT_MBEDTLS;$AZ_IOT_DEPS"
          -DAZ_IOT_EXPECTED_COMPONENTS="${{ matrix.components }}"
      - name: Build the consumer
        run: cmake --build "$AZ_IOT_CONSUMER"
      - name: Put the installed DLLs on PATH (Windows, shared)
        if: runner.os == 'Windows' && matrix.shared == 'ON'
        run: cygpath -w "$AZ_IOT_PREFIX/bin" >> "$GITHUB_PATH"
      - name: Test the consumer
        run: ctest --test-dir "$AZ_IOT_CONSUMER" --output-on-failure --no-tests=error
      - name: The package has no adapter_paho (no Paho)
        if: matrix.with_paho == 'OFF'
        run: |
          if cmake -S tests/install -B "$RUNNER_TEMP/no-paho-consumer" -G Ninja \
               -DCMAKE_PREFIX_PATH="$AZ_IOT_PREFIX;$AZ_IOT_MBEDTLS" \
               -DAZ_IOT_EXPECTED_COMPONENTS="core;adapter_paho" > "$RUNNER_TEMP/no-paho.log" 2>&1; then
            echo "::error::find_package(azure-iot-sdk COMPONENTS adapter_paho) succeeded"
            exit 1
          fi
          # Refused by the component check, not by anything else.
          grep -q 'set azure-iot-sdk_FOUND to FALSE' "$RUNNER_TEMP/no-paho.log"
      - name: Check the exact-version binding (shared)
        # No ABI guarantee: a consumer must bind to this exact release, and on
        # Linux must fail to load when only another release is present.
        if: matrix.shared == 'ON'
        run: |
          # Full version, pre-release label included; the CMake package version is numeric only.
          ver=$(sed -n 's/^#define AZ_IOT_VERSION_STRING "\([^"]*\)".*/\1/p' \
            "$AZ_IOT_PREFIX/include/azure/iot/az_iot_version.h")
          test -n "$ver"
          exe="$AZ_IOT_CONSUMER/install_test_mqttv5"
          if [ "$RUNNER_OS" = "Windows" ]; then
            deps=$(dumpbin -nologo -dependents "$exe.exe")
            want="az_iot_core-$ver.dll az_iot_mqttv5-$ver.dll"
          else
            deps=$(readelf -d "$exe")
            want="[libaz_iot_core.so.$ver] [libaz_iot_mqttv5.so.$ver]"
          fi
          for w in $want; do
            if ! grep -qiF -- "$w" <<< "$deps"; then
              echo "::error::$exe does not depend on $w"
              echo "$deps"
              exit 1
            fi
          done
          if [ "$RUNNER_OS" != "Windows" ]; then
            libs=("$AZ_IOT_PREFIX"/lib/libaz_iot_*.so."$ver")
            for f in "${libs[@]}"; do mv "$f" "${f%"$ver"}9.9.9"; done
            status=0
            "$exe" > /dev/null 2>&1 || status=$?
            for f in "${libs[@]}"; do mv "${f%"$ver"}9.9.9" "$f"; done
            if [ "$status" -eq 0 ]; then
              echo "::error::$exe ran with only a different release installed"
              exit 1
            fi
          fi

      # No CMake: the .pc files alone must give a working compile and link line.
      # MSVC builds install no .pc files.
      - name: Build and run the pkg-config consumer (Linux)
        if: runner.os == 'Linux'
        run: |
          export PKG_CONFIG_PATH="$AZ_IOT_PREFIX/lib/pkgconfig:$AZ_IOT_MBEDTLS/lib/pkgconfig"
          # pkg-config sets no runtime search path for the shared libraries.
          if [ "${{ matrix.shared }}" = "ON" ]; then
            export LD_LIBRARY_PATH="$AZ_IOT_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          fi
          IFS=';' read -ra comps <<< "${{ matrix.components }}"
          bash tests/install/pkg-config-test.sh --run "$RUNNER_TEMP/pkg-config-test" "${comps[@]}"

  # ---------------------------------------------------------------------------
  # c/ embedded with add_subdirectory() (c/tests/subproject), so paths that
  # assume c/ is the top-level project fail here. Unit tests and samples are on
  # so their CMake files are covered too.
  # ---------------------------------------------------------------------------
  subproject:
    name: subproject / ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.c == 'true' || github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-gcc
          - os: windows-latest
            name: windows-msvc
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: c
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev
      - name: Configure
        run: >
          cmake -S tests/subproject -B build/subproject -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DAZ_IOT_BUILD_TESTS=ON
          -DAZ_IOT_WITH_RUST_MQTT=ON
          -DAZ_IOT_WITH_AZ_MQTT=ON
      - name: Build
        run: cmake --build build/subproject
      - name: Test
        run: ctest --test-dir build/subproject --output-on-failure --no-tests=error

  # ---------------------------------------------------------------------------
  # Code coverage (gcov/gcovr) for first-party code -- c/src and c/adapters.
  #
  # Report-only, deliberately. The per-component floors in
  # c/tests/coverage-components.json are now SET -- derived from the measured
  # unit+conformance numbers -- so the table marks each component PASS or FAIL.
  # `--enforce` is still absent, so none of that can fail the build yet, and the
  # report says so in as many words. Adding --enforce is the remaining step, at
  # which point a per-component regression or a shipped adapter dropping out of
  # the build blocks the merge.
  #
  # Design: c/docs/eng/code-coverage.md
  # ---------------------------------------------------------------------------
  coverage-c:
    name: coverage (linux-gcc)
    needs: changes
    if: needs.changes.outputs.c == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    env:
      # Exact number of CTest suites the coverage preset must register. An
      # inequality only caught the build collapsing to nothing; it could not
      # catch a suite quietly dropping out, which is the failure this repo
      # actually had -- coverage computed over fewer tests than anyone thought.
      # Now that no suite decides at run time whether to participate, the count
      # is deterministic, so assert it exactly. Bump this when adding a suite.
      EXPECTED_TESTS: '68'
    services:
      mosquitto:
        image: eclipse-mosquitto:2
        ports:
          - 1883:1883
        # A real liveness probe: mosquitto_pub succeeds only if the broker
        # accepted a connection.
        options: >-
          --health-cmd="mosquitto_pub -h localhost -p 1883 -t healthcheck -m ok"
          --health-interval=5s
          --health-retries=10
          --health-start-period=5s
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # diff-cover compares against the merge base.
          fetch-depth: 0

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libssl-dev mosquitto-clients \
                                  softhsm2 opensc meson pkg-config
          python3 -m pip install --upgrade 'gcovr==7.2' 'diff-cover==9.2.0'

      # The mbedTLS crypto adapter is shipped; without it the suite count below fails.
      - name: Build mbedTLS
        run: |
          bash eng/install-mbedtls.sh 4.1.1 "$RUNNER_TEMP/mbedtls"
          echo "CMAKE_PREFIX_PATH=$RUNNER_TEMP/mbedtls" >> "$GITHUB_ENV"

      # The non-extractable-key custody suite drives a REAL PKCS#11 token. It is
      # built only when one is going to be supplied and fails when it is not, so
      # the token is provisioned here rather than left to a self-skip. Its
      # coverage is not optional either: the success path of
      # adapters/paho/az_iot_paho_key_custody.c exists only when a token is
      # present.
      - name: Provision a PKCS#11 token
        run: |
          eval "$(eng/setup-pkcs11-provider.sh)"
          echo "OPENSSL_MODULES=$OPENSSL_MODULES" >> "$GITHUB_ENV"
          openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 \
                          -out "$RUNNER_TEMP/custody-key.pem"

          # Issue the certificate BEFORE the key goes into the token: the
          # conformance custody case presents it to a TLS server while the
          # private half stays in the token, so the two must be the same key
          # pair -- and setup-softhsm.sh deletes the PEM once it has imported
          # it, which is the point of the exercise. The test proxy terminates
          # the handshake and accepts any client certificate, so self-signed is
          # enough and its trust chain is irrelevant.
          openssl req -new -x509 -key "$RUNNER_TEMP/custody-key.pem" \
                      -out "$RUNNER_TEMP/custody-cert.pem" -days 2 \
                      -subj "/CN=az-iot-conformance-custody" \
                      -addext "basicConstraints=critical,CA:FALSE" \
                      -addext "extendedKeyUsage=clientAuth"

          eng/setup-softhsm.sh "$RUNNER_TEMP/custody-key.pem" > "$RUNNER_TEMP/softhsm-env.sh"
          # "export NAME='value'" -> the NAME=value lines GITHUB_ENV takes.
          sed -E "s/^export ([A-Za-z0-9_]+)='(.*)'\$/\1=\2/" \
              "$RUNNER_TEMP/softhsm-env.sh" >> "$GITHUB_ENV"
          . "$RUNNER_TEMP/softhsm-env.sh"
          # Fail here, not thirty lines into a test log, if the OpenSSL pkcs11
          # provider is not installed: without it the token cannot sign.
          openssl list -providers -provider pkcs11 > /dev/null

          {
            echo "AZ_IOT_CONFORMANCE_KEY_URI=$AZ_IOT_CLIENT_KEY_URI"
            echo "AZ_IOT_CONFORMANCE_KEY_ENGINE=$AZ_IOT_CRYPTO_ENGINE_ID"
            echo "AZ_IOT_CONFORMANCE_CLIENT_CERT=$RUNNER_TEMP/custody-cert.pem"
          } >> "$GITHUB_ENV"

      - name: Verify MQTT broker is reachable
        # The conformance suites are where nearly all Paho adapter coverage
        # comes from, and they no longer excuse themselves when the broker is
        # missing -- they fail. Probing here turns an infrastructure outage into
        # an obvious error at the top of the log rather than a wall of
        # connection failures further down.
        run: mosquitto_pub -h localhost -p 1883 -t az-iot/coverage/probe -m ok

      - name: Configure
        # The TLS conformance cases are already on here (linux-base sets
        # AZ_IOT_BUILD_CONFORMANCE_TESTS_TLS), so what this job adds is the
        # token material exported above. The harness declares
        # AZ_IOT_CONFORMANCE_CAP_KEY_CUSTODY and a declared capability that is
        # never exercised fails the run, so this is the job that proves it.
        run: cmake --preset linux-gcc-coverage -DAZ_IOT_BUILD_PKCS11_TESTS=ON

      - name: Build
        run: cmake --build --preset linux-gcc-coverage

      - name: Sentinel - test suites were actually discovered
        run: |
          discovered=$(ctest --test-dir build/linux-gcc-coverage --show-only=json-v1 | jq '.tests | length')
          echo "discovered $discovered test suites (expected exactly $EXPECTED_TESTS)"
          if [ "$discovered" -ne "$EXPECTED_TESTS" ]; then
            echo "::error::discovered $discovered test suites, expected exactly $EXPECTED_TESTS."
            echo "If you added or removed a suite, update EXPECTED_TESTS in this workflow."
            ctest --test-dir build/linux-gcc-coverage -N
            exit 1
          fi

      - name: Test
        env:
          # Service containers are reachable on localhost for jobs that do not
          # themselves run in a container -- NOT at the service label.
          AZ_IOT_MQTT_BROKER_HOST: localhost
          AZ_IOT_MQTT_BROKER_PORT: '1883'
        run: ctest --preset linux-gcc-coverage -E e2e

      - name: Generate coverage report
        run: |
          mkdir -p build/linux-gcc-coverage/coverage/html
          gcovr --root "$PWD" "$PWD/build/linux-gcc-coverage" \
                --filter "$PWD/src/" --filter "$PWD/adapters/" \
                --exclude '.*/_deps/.*' \
                --exclude '.*/tests/.*' \
                --exclude '.*/samples/.*' \
                --cobertura build/linux-gcc-coverage/coverage/cobertura.xml --cobertura-pretty \
                --lcov build/linux-gcc-coverage/coverage/lcov.info \
                --json-summary build/linux-gcc-coverage/coverage/summary.json --json-summary-pretty \
                --html-details build/linux-gcc-coverage/coverage/html/index.html \
                --txt --print-summary

      - name: Collect coverage tracefile
        # The merge-able intermediate, produced by the same script the e2e legs
        # use so the filter sets cannot drift apart. Tracefiles built with
        # different --filter/--exclude sets combine into a quietly wrong number
        # rather than an obvious error.
        run: bash eng/collect-coverage.sh build/linux-gcc-coverage coverage/unit.json unit-conformance

      - name: Upload coverage tracefile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-trace-unit
          path: c/coverage/unit.json
          if-no-files-found: error

      - name: Per-component summary
        # Floors are set but NOT enforced: no --enforce here, so a component
        # below its floor is reported and does not fail the job. Verified
        # satisfiable against both the per-PR and nightly datasets before being
        # committed, so turning --enforce on is a one-line change when wanted.
        run: |
          python3 tests/coverage_report.py \
            --summary build/linux-gcc-coverage/coverage/summary.json \
            --components tests/coverage-components.json \
            --source-root "$PWD" \
            --output build/linux-gcc-coverage/coverage/summary.md
          cat build/linux-gcc-coverage/coverage/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Patch coverage (report-only)
        if: github.event_name == 'pull_request'
        # No --fail-under yet. This publishes the number so the 80% patch floor
        # can be adopted against real data rather than a guess -- the same
        # approach used for the per-component floors, which were set from
        # measured values rather than chosen up front.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          diff-cover build/linux-gcc-coverage/coverage/cobertura.xml \
            --compare-branch "origin/$BASE_REF" \
            --markdown-report build/linux-gcc-coverage/coverage/patch.md \
            --src-roots . || echo "::warning::diff-cover failed; patch coverage not reported"
          {
            echo ""
            echo "## Patch coverage (report-only)"
            echo ""
            # diff-cover may have failed before writing the report. This step is
            # informational, so a missing file must not fail the job.
            if [ -f build/linux-gcc-coverage/coverage/patch.md ]; then
              cat build/linux-gcc-coverage/coverage/patch.md
            else
              echo "_diff-cover produced no report._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-c
          path: c/build/linux-gcc-coverage/coverage/
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # ESP-IDF builds: one job per ESP32 sample, target and profile, each through
  # eng/esp-idf-build.sh (fails on any compiler warning). Build checks only:
  # secure profiles are signed with a key generated per build and discarded.
  # ---------------------------------------------------------------------------
  esp-idf:
    name: esp-idf / ${{ matrix.sample }} / ${{ matrix.target }} / ${{ matrix.profile }}
    needs: changes
    if: needs.changes.outputs.c == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    container:
      # espressif/idf:v6.0, pinned by digest.
      image: espressif/idf:v6.0@sha256:59df146f64aa0b13886a13a74682ad157482b446f5cc16582500803c95c71401
    defaults:
      run:
        shell: bash
        working-directory: c
    strategy:
      fail-fast: false
      matrix:
        sample: [ software_update/esp32 ]
        target: [ esp32, esp32c3, esp32s3, esp32c6 ]
        profile: [ default, secure ]
        include:
          - sample: software_update/esp32
            target: esp32
            profile: secure_esp32_legacy
          - sample: software_update/esp32
            target: esp32
            profile: secure_virtual_efuse
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # The ESP-IDF component builds azure-sdk-for-c from c/deps.
          submodules: true
      - name: Build
        env:
          SAMPLE: ${{ matrix.sample }}
          TARGET: ${{ matrix.target }}
          PROFILE: ${{ matrix.profile }}
        run: |
          # The container runs as root over a runner-owned checkout; ESP-IDF
          # runs git (app version) in it.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh" > /dev/null
          bash eng/esp-idf-build.sh "samples/$SAMPLE" "$TARGET" "$PROFILE"

  # Single check name for the esp-idf matrix, which reports one check per cell.
  # Same rules as coverage-gate below.
  esp-idf-gate:
    name: esp-idf-gate
    needs: [changes, esp-idf]
    if: always()
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check esp-idf job outcome
        env:
          changes_result: ${{ needs.changes.result }}
          esp_idf_result: ${{ needs.esp-idf.result }}
        run: |
          echo "changes: $changes_result"
          echo "esp-idf: $esp_idf_result"
          if [ "$changes_result" != "success" ]; then
            echo "::error::esp-idf gate: change detection did not succeed ($changes_result)"
            exit 1
          fi
          if [ "$esp_idf_result" = "success" ] || [ "$esp_idf_result" = "skipped" ]; then
            exit 0
          fi
          echo "::error::esp-idf gate failed (esp-idf: $esp_idf_result)"
          exit 1

  # Single stable check name for branch-protection to reference. It reports on
  # every pull request, passes when the coverage job legitimately did not need
  # to run, and fails whenever the coverage job failed. `if: always()` is what
  # lets it run despite a failed dependency.
  coverage-gate:
    name: coverage-gate
    needs: [changes, coverage-c]
    if: always()
    runs-on: ubuntu-24.04
    # This job does not check out the repo, so the workflow-level
    # working-directory of c/ would not exist.
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check coverage job outcome
        run: |
          changes_result='${{ needs.changes.result }}'
          coverage_result='${{ needs.coverage-c.result }}'
          echo "changes:    $changes_result"
          echo "coverage-c: $coverage_result"

          # A broken `changes` job skips coverage-c, and a skipped coverage-c
          # would otherwise be read as "no C code touched" and pass. Never let
          # an infrastructure failure upstream produce a green gate.
          if [ "$changes_result" != "success" ]; then
            echo "::error::coverage gate: change detection did not succeed ($changes_result), so coverage was never evaluated"
            exit 1
          fi

          if [ "$coverage_result" = "success" ] || [ "$coverage_result" = "skipped" ]; then
            exit 0
          fi
          echo "::error::coverage gate failed (coverage-c: $coverage_result)"
          exit 1

