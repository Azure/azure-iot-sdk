# End-to-end CSR-based DPS enrollment (certificate management) test for the C SDK.
#
# Why a separate workflow
# -----------------------
# The certificate-management CSR scenario needs a HEAVIER environment than the
# fast e2e job: the Device Provisioning Service must be provisioned with Azure
# Device Registration (ADR) integration so it can issue an OPERATIONAL
# certificate in response to a device's CSR. The fast ci-c-e2e job provisions a
# plain DPS, so it does not build the CSR test at all -- `az_iot_tests_e2e_csr`
# exists only where AZ_IOT_BUILD_E2E_CSR is set, which is here. This workflow
# provisions the cert-management environment (via `enable-certificate-management`
# on the shared provision step) and actually exercises the CSR path.
#
# Architecture
# ------------
# In-process: the native `az_iot_tests_e2e_csr` CTest is the device. It
#   1. authenticates to DPS with an X.509 BOOTSTRAP identity (a leaf signed by
#      the enrollment group's signing CA),
#   2. sends a CSR (from the OpenSSL managed certificate provider) in the DPS
#      register body (request_operational_certificate=true),
#   3. receives the DPS-issued operational certificate chain, and
#   4. connects to the assigned IoT Hub with the issued OPERATIONAL identity.
# Reaching CONNECTED with the issued cert is the hub's proof it authenticated a
# DPS-issued certificate. Both the EC (P-256) and RSA-2048 key types are driven.
#
# The environment is provisioned with an X.509 enrollment GROUP linked to a
# signing CA (only a group linked to a CA can issue an operational cert for a
# CSR; a plain individual enrollment cannot). The group's issuer is an
# intermediate CA the framework creates, so the provisioning step also mints a
# bootstrap device identity UNDER the group (a leaf signed by that issuer) and
# emits it as IOT_DPS_GROUP_X509_* for the test to use directly.
#
# Stages
# ------
#   1. setup    : provision the cert-management resource group ONCE (DPS + ADR +
#                 the X.509 enrollment group), mint the bootstrap identity, and
#                 publish the config as an artifact.
#   2. test     : build `az_iot_tests_e2e_csr` (AZ_IOT_BUILD_E2E_CSR=ON),
#                 materialize the bootstrap chain + key, and run
#                 `ctest -R e2e_csr`.
#   3. teardown : always() deletes the resource group. It recomputes the group
#                 name from the run id rather than reading a setup output, so it
#                 also cleans up after a CANCELLED setup job (see `env` below).
#
# The provision/destroy steps are the shared composite actions
# Azure/iot-sdks-e2e-fx/actions/{provision,destroy}-e2e-resources, pinned to a tag.
#
# Shared environment (temporary, opt-in)
# --------------------------------------
# When the repository variable E2E_CSR_SHARED_ID_SCOPE is set, PULL REQUEST runs
# skip setup/teardown and use a long-lived cert-management environment instead.
# Each run issues its own bootstrap device from the enrollment group's issuing CA
# (c/eng/e2e-shared-device.ps1 -Csr); the test job never logs in to Azure. Same
# test. Push and nightly runs always provision. Unset the variable to return to
# per-run provisioning.

name: ci-c-e2e-csr

on:
  workflow_dispatch:
  pull_request:
    paths:
      # CSR / certificate-management device-side code.
      - 'c/src/core/connection_client.c'
      - 'c/src/core/cert_util.c'
      - 'c/src/core/internal/cert_util.h'
      - 'c/adapters/cert_openssl/**'
      - 'c/inc/azure/iot/az_iot_certificate_provider.h'
      - 'c/inc/azure/iot/az_iot_connection_client.h'
      # The e2e harness (shared device fixture + CSR test + service facade).
      - 'c/tests/e2e/**'
      - 'c/eng/e2e-shared-device.ps1'
      - '.github/workflows/ci-c-e2e-csr.yml'
  push:
    branches: [ main ]
    paths:
      - 'c/src/core/connection_client.c'
      - 'c/src/core/cert_util.c'
      - 'c/src/core/internal/cert_util.h'
      - 'c/adapters/cert_openssl/**'
      - 'c/inc/azure/iot/az_iot_certificate_provider.h'
      - 'c/inc/azure/iot/az_iot_connection_client.h'
      - 'c/tests/e2e/**'
      - 'c/eng/e2e-shared-device.ps1'
      - '.github/workflows/ci-c-e2e-csr.yml'
  schedule:
    - cron: '0 12 * * *'  # Nightly at 5am PST (offset from the fast + ADU workflows)

# Cancel superseded runs on the same ref to avoid leaking parallel resource groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Resource group name derived from the RUN, not from a random GUID published as a
# job output. A CANCELLED job does not propagate its `outputs`, so a teardown that
# reads `needs.setup.outputs.rg` receives an empty string and silently deletes
# nothing ("No resource group name available") while the group stays behind --
# exactly how `cancel-in-progress` runs leaked CSDKE2ECert-* groups. Both setup and
# teardown compute this name independently, so teardown never depends on setup.
env:
  E2E_RESOURCE_GROUP: CSDKE2ECert-${{ github.run_id }}-${{ github.run_attempt }}
  # 'true' when this run uses the shared environment (see header). Job-level
  # `if:` cannot read `env`, so the setup and teardown jobs repeat the expression.
  E2E_SHARED: ${{ vars.E2E_CSR_SHARED_ID_SCOPE != '' && github.event_name == 'pull_request' }}

jobs:
  setup:
    permissions:
      contents: read
      id-token: write   # azure/login OIDC
    name: setup (provision)
    if: ${{ !(vars.E2E_CSR_SHARED_ID_SCOPE != '' && github.event_name == 'pull_request') }}
    runs-on: ubuntu-24.04
    # Cert-management provisioning is heavier than the fast path: it creates an
    # ADR namespace/policy, role assignments, and an ADR-integrated DPS.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Azure Login via OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Provision cert-management resources
        id: provision
        uses: Azure/iot-sdks-e2e-fx/actions/provision-e2e-resources@9109e1ce6d9d19bbc750f4715b85db1f5167190e # v1.0.1 + dps-symmkey-group-enrollment-devices (#456)
        with:
          rg-name: ${{ env.E2E_RESOURCE_GROUP }}
          # The shared action defaults to EastUS; these pipelines run in
          # eastus2euap, the region this subscription's IoT Hub scale unit is
          # pinned to -- a hub created anywhere else is rejected with IH400059.
          # An undefined repository variable arrives as an empty string, which
          # would otherwise override the action default, so the fallback is here.
          azure-location: ${{ vars.E2E_AZURE_LOCATION || 'eastus2euap' }}
          # Provision the DPS with Azure Device Registration (ADR) integration so
          # the enrollment can issue an operational certificate for the device CSR.
          enable-certificate-management: 'true'
          # Create an X.509 enrollment GROUP linked to the provisioned signing CA
          # (emitted as PROVISIONING_ROOT_CERT). The device presents a bootstrap
          # leaf signed by that CA; DPS authenticates it against the group and
          # issues the operational certificate in response to the CSR.
          dps-x509-group-enrollment-devices: '1'
          # An individual enrollment is also required: the C test-config cmdlet
          # unconditionally reads IndividualX509[0], so provision at least one.
          dps-x509-individual-enrollments: '1'
          # A symmetric-key enrollment group, also linked to the signing CA, for
          # SAS onboarding with a DPS-issued certificate (az_iot_tests_e2e_csr_sas).
          dps-symmkey-group-enrollment-devices: '1'

      - name: Upload test config
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-csr-test-config
          path: test_config/set_test_env_vars.ps1
          retention-days: 1
          if-no-files-found: error

  test:
    name: csr (ubuntu-24.04)
    needs: setup
    # Runs after setup, or without it in shared mode (setup skipped).
    if: ${{ !cancelled() && (needs.setup.result == 'success' || needs.setup.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install ninja (Linux)
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          python3 -m pip install --upgrade 'gcovr==7.2'

      - name: Build CSR e2e test
        working-directory: c
        run: |
          cmake --preset linux-gcc-e2e-coverage -DAZ_IOT_BUILD_E2E_CSR=ON ${{ env.E2E_SHARED != 'true' && '-DAZ_IOT_BUILD_E2E_SAS=ON' || '' }}
          cmake --build --preset linux-gcc-e2e-coverage --target az_iot_tests_e2e_csr ${{ env.E2E_SHARED != 'true' && 'az_iot_tests_e2e_csr_sas' || '' }}

      - name: Download shared test config
        if: env.E2E_SHARED != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: e2e-csr-test-config
          path: test_config

      - name: Issue a bootstrap device on the shared environment
        if: env.E2E_SHARED == 'true'
        shell: pwsh
        env:
          E2E_CSR_SHARED_GROUP_CA: ${{ secrets.E2E_CSR_SHARED_GROUP_CA }}
          E2E_CSR_SHARED_ID_SCOPE: ${{ vars.E2E_CSR_SHARED_ID_SCOPE }}
          E2E_CSR_SHARED_DPS_HOST: ${{ vars.E2E_CSR_SHARED_DPS_HOST }}
          E2E_REGISTRATION_ID: ci-csr-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          ./c/eng/e2e-shared-device.ps1 -Csr -RegistrationId $env:E2E_REGISTRATION_ID `
            -OutFile test_config/set_test_env_vars.ps1

      - name: Run CSR e2e
        shell: pwsh
        run: |
          # Service-side config (IOT_DPS_*, IOT_DPS_GROUP_X509_*) is set by the
          # generated script.
          . ./test_config/set_test_env_vars.ps1

          # The provisioning step minted the BOOTSTRAP identity under the X.509
          # enrollment group: a leaf signed by the group's issuer CA, emitted as a
          # base64 PEM full chain (leaf + issuer CA + root) plus its key. Presenting
          # it authenticates the device to the group; DPS then issues the
          # operational certificate in response to the CSR.
          $regId   = $env:IOT_DPS_GROUP_X509_REGISTRATION_ID
          $certB64 = $env:IOT_DPS_GROUP_X509_CERTIFICATE
          $keyB64  = $env:IOT_DPS_GROUP_X509_KEY
          if (-not $regId -or -not $certB64 -or -not $keyB64) {
            throw "IOT_DPS_GROUP_X509_* not found in the provisioning config; the environment was not provisioned with an X.509 enrollment group."
          }
          Write-Host "CSR e2e bootstrap device: $regId"

          $dir = Join-Path ([System.IO.Path]::GetTempPath()) ("az-iot-c-e2e-csr-" + [Guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $certPath = Join-Path $dir "device-cert.pem"
          $keyPath  = Join-Path $dir "device-key.pem"
          $caPath   = Join-Path $dir "trusted-ca.pem"

          # Materialize the bootstrap chain + key. The in-process test reads
          # cert/key/CA by PATH.
          [System.IO.File]::WriteAllText($certPath,
            [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($certB64)))
          [System.IO.File]::WriteAllText($keyPath,
            [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($keyB64)))
          # Trusted CA for the DPS/hub SERVER TLS validation = the system bundle.
          Copy-Item "/etc/ssl/certs/ca-certificates.crt" $caPath

          # Map onto the names the test consumes.
          $env:AZ_IOT_DPS_ID_SCOPE        = $env:IOT_DPS_ID_SCOPE
          $env:AZ_IOT_DPS_REGISTRATION_ID = $regId
          $env:AZ_IOT_CLIENT_CERT         = $certPath
          $env:AZ_IOT_CLIENT_KEY          = $keyPath
          $env:AZ_IOT_TRUSTED_CA          = $caPath
          if ($env:IOT_DPS_GLOBAL_ENDPOINT) { $env:AZ_IOT_DPS_GLOBAL_ENDPOINT = $env:IOT_DPS_GLOBAL_ENDPOINT }
          # SAS suite (built only when not shared): the symmetric-key group.
          if ($env:IOT_DPS_SYMM_KEY_GROUP_PRIMARY_KEY) {
            Write-Host "::add-mask::$($env:IOT_DPS_SYMM_KEY_GROUP_PRIMARY_KEY)"
            $env:AZ_IOT_DPS_SAS_GROUP_KEY = $env:IOT_DPS_SYMM_KEY_GROUP_PRIMARY_KEY
            $env:AZ_IOT_DPS_SAS_REGISTRATION_ID = "sas-csr-${{ github.run_id }}-${{ github.run_attempt }}"
          }
          # Verbose SDK logging so a connect/DPS failure surfaces its reason.
          $env:AZ_IOT_E2E_LOG_LEVEL = 'TRACE'

          New-Item -ItemType Directory -Path ./test_config/results -Force | Out-Null
          # `-R e2e_csr` selects az_iot_tests_e2e_csr, and az_iot_tests_e2e_csr_sas
          # when built.
          ctest --test-dir c/build/linux-gcc-e2e-coverage -R e2e_csr `
            --verbose --no-tests=error --timeout 900 `
            --output-junit ./test_config/results/e2e-csr.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-csr-results
          path: ./test_config/results/**/*.xml
          if-no-files-found: ignore

      - name: Collect coverage
        # Not `if: always()` -- a failed run leaves partial or absent .gcda, and
        # merging that would understate coverage for an unrelated reason.
        if: success()
        working-directory: c
        run: bash eng/collect-coverage.sh build/linux-gcc-e2e-coverage coverage/e2e-csr.json e2e-csr

      - name: Upload coverage tracefile
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-trace-e2e-csr
          path: c/coverage/e2e-csr.json
          if-no-files-found: error

  teardown:
    permissions:
      contents: read
      id-token: write   # azure/login OIDC
    name: teardown (delete resources)
    needs: [setup, test]
    # `always()` also covers cancellation. The group name comes from the workflow
    # `env` (not from `needs.setup.outputs`), so a cancelled setup still gets torn
    # down; the destroy action no-ops when the group was never created. Skipped in
    # shared mode: the shared group outlives the run.
    if: ${{ always() && !(vars.E2E_CSR_SHARED_ID_SCOPE != '' && github.event_name == 'pull_request') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Azure Login via OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Delete Azure resources
        uses: Azure/iot-sdks-e2e-fx/actions/destroy-e2e-resources@b96d2aa2eb2b36e1e4dfbdb04aa56cf3dccecf8a # v1.0.1
        with:
          resource-group: ${{ env.E2E_RESOURCE_GROUP }}
