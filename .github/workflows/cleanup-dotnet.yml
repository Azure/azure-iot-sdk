name: cleanup-dotnet

# The job that runs nightly to delete any lingering Azure test resources from the dotnet CI pipeline

on:
  schedule:
  - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write
    
jobs:
  build:
    runs-on: ubuntu-latest
    name: Nightly cleanup
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v6

    - name: Azure Login via OIDC
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Delete Azure Test Resources
      uses: azure/powershell@v3
      if: always()
      with:
        azPSVersion: "latest"
        inlineScript: |
          $jsonContent = az group list
          $jsonArray = $jsonContent | ConvertFrom-Json

          # Loop through each item
          foreach ($resourceGroupJsonObject in $jsonArray) {
              $rgName = $($resourceGroupJsonObject.name)
              if ($rgName.StartsWith("DotnetE2ETestPipeline-")) 
              {
                  Write-Host "Deleting resource group with name:" $rgName
                  az group delete --name $rgName --yes
              }
          }
