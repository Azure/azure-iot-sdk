# Fails when any .NET project references a NuGet package (direct or transitive) with a known
# vulnerability. Daily as well, because new advisories apply to unchanged code.
name: ci-dotnet-vulnerable-packages

on:
  push:
    branches: [ main ]
  # No workflow-level `paths:` filter: a workflow that never triggers reports no check, which
  # would block a required check. The `changes` job below skips work instead.
  pull_request:
  schedule:
    - cron: '0 13 * * *'  # Daily, 13:00 UTC.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # dorny/paths-filter lists PR files through the API.
    outputs:
      dotnet: ${{ steps.filter.outputs.dotnet == 'true' || steps.filter.outputs.workflow == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            dotnet:
              - 'dotnet/**'
              - '!dotnet/**/*.md'
            workflow:
              - '.github/workflows/ci-dotnet-vulnerable-packages.yml'

  vulnerable-packages:
    name: vulnerable packages
    needs: changes
    if: needs.changes.outputs.dotnet == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Check
        run: bash dotnet/eng/check-vulnerable-packages.sh
