# End-to-end Device Update (ADU) tests for the C SDK.
#
# This is the slow-lane counterpart to ci-c-e2e.yml. It is kept separate because
# provisioning the Azure Device Update account/instance takes ~25 min, so it
# must NOT gate the fast feedback loop. It runs:
#   * on PRs that touch ADU code paths (the `paths` filter below),
#   * nightly (regression), and
#   * on manual dispatch.
#
# Architecture
# ------------
# Like ci-c-e2e.yml, this is fully in-process: there is NO dotnet harness. The
# ADU scenario runs as the native `az_iot_tests_e2e_adu` CTest.
#
# NOTE: the device-side ADU update scenario is not implemented yet. Today
# `az_iot_tests_e2e_adu` is a placeholder that gates on the provisioned
# environment and reports a CTest skip; the value of this pipeline right now is
# exercising the (slow) ADU-enabled provisioning + gating + teardown so those
# never regress. When the real scenario lands it will connect a device (reuse
# the device-material materialization from ci-c-e2e.yml) and drive the update
# via 'az iot du' (which needs an Azure OIDC login in the test job).
#
# Stages
# ------
# Resources (incl. the Device Update account/instance) are provisioned EXACTLY
# ONCE by the setup job and shared by both test legs; teardown always() deletes
# them. The provision/destroy steps live in .github/actions/{provision,destroy}-
# e2e-resources so other pipelines (e.g. ci-dotnet) can reuse them.

name: ci-c-e2e-adu

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'c/src/features/adu/**'
      - 'c/adapters/adu/**'
      - 'c/inc/azure/iot/az_iot_adu.h'
      - 'c/samples/adu/**'
  schedule:
    - cron: '30 11 * * *'  # Nightly at 4:30am PST (offset from the fast workflow)

# Cancel superseded runs on the same ref to avoid leaking parallel resource groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write   # required for azure/login OIDC

jobs:
  setup:
    name: setup (provision)
    runs-on: ubuntu-latest
    # ADU service provisioning is slow (~25 min); give the setup ample headroom.
    timeout-minutes: 60
    outputs:
      rg: ${{ steps.provision.outputs.resource-group }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Provision resources (with ADU Gen1)
        id: provision
        uses: ./.github/actions/provision-e2e-resources
        with:
          rg-prefix: CSDKE2EAdu-
          enable-adu: Gen1

      - name: Upload test config
        uses: actions/upload-artifact@v4
        with:
          name: e2e-adu-test-config
          path: test_config/set_test_env_vars.ps1
          retention-days: 1
          if-no-files-found: error

  test:
    name: ${{ matrix.os }}
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: linux-gcc-debug
          - os: windows-latest
            preset: windows-msvc-debug
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Build ADU e2e test
        working-directory: c
        run: |
          cmake --preset ${{ matrix.preset }} -DAZ_IOT_BUILD_E2E=ON -DAZ_IOT_WITH_PAHO=ON
          cmake --build --preset ${{ matrix.preset }} ${{ runner.os == 'Windows' && '--config Debug' || '' }} --target az_iot_tests_e2e_adu

      - name: Download shared test config
        uses: actions/download-artifact@v4
        with:
          name: e2e-adu-test-config
          path: test_config

      - name: Run ADU e2e
        shell: pwsh
        run: |
          # Service-side config (IOTHUB_*, IOT_DPS_*) is set by the generated script.
          . ./test_config/set_test_env_vars.ps1

          New-Item -ItemType Directory -Path ./test_config/results -Force | Out-Null
          $cfg = if ($IsWindows) { @('-C', 'Debug') } else { @() }
          # `-R e2e_adu` selects ONLY az_iot_tests_e2e_adu (not the fast e2e
          # suite az_iot_tests_e2e, nor the adu_crypto_openssl unit test).
          ctest --test-dir c/build/${{ matrix.preset }} @cfg -R e2e_adu `
            --output-on-failure --no-tests=error --timeout 900 `
            --output-junit ./test_config/results/e2e-adu-${{ matrix.os }}.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-adu-results-${{ matrix.os }}
          path: ./test_config/results/**/*.xml
          if-no-files-found: ignore

  teardown:
    name: teardown (delete resources)
    needs: [setup, test]
    if: always() && needs.setup.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Delete Azure resources
        uses: ./.github/actions/destroy-e2e-resources
        with:
          resource-group: ${{ needs.setup.outputs.rg }}
