# End-to-end software updates tests for the C SDK, against the real service.
#
# Runs both software updates suites, per MQTT adapter, each adapter with its own
# new device:
#   az_iot_tests_e2e_su        the DPS channel, with no update offered
#   az_iot_tests_e2e_su_offer  offered updates through the whole client, delta
#                              ones on Linux also with the real delta processor
#                              (installed by .github/actions/install-su-delta-processor)
# then checks what the service recorded for each device and offer. The offers job
# stages the offers once; the e2e-su job runs on Linux and on Windows (MSVC; Paho
# over OpenSSL, az_mqtt over Schannel), each leg with its own devices.
#
# Runs against the shared mqttv5 environment (ci-c-e2e-mqttv5.yml), whose ADR
# namespace is linked to a Device Update instance. Offers are standing: staged
# once per version of the code that defines them (RunId 's<Get-SuE2EFixtureTag>')
# and reused by every run (New-SuE2EOffers -Reuse; c/tests/e2e/scripts/SuE2E.psm1).
# An offer reaches each new device once, so runs do not interfere; each suite
# execution gets its own new device. Nothing is deleted per run.
#
# Same-repository pull requests log in to Azure, as in ci-c-e2e.yml: opening one
# needs write access, which can already run any workflow with these secrets.
#
#   vars:    E2E_MQTTV5_SHARED_SUBSCRIPTION_ID, _RESOURCE_GROUP, _ADR_NAMESPACE,
#            _ID_SCOPE, _DPS_HOST, _LOCATION, _SU_ENDPOINT, _SU_STORAGE_ACCOUNT,
#            _SU_STORAGE_CONTAINER, and _SU_INSTANCE for the namespace repair
#            (all E2E_MQTTV5_SHARED_*)
#   secrets: E2E_MQTTV5_SHARED_GROUP_CA, E2E_MQTTV5_SHARED_IOTHUB_SERVICE_CS,
#            E2E_MQTTV5_SHARED_EVENTHUB_CS (required by e2e-shared-device.ps1),
#            AZURE_CLIENT_ID, AZURE_TENANT_ID (OIDC; ADR job and Device Update
#            import rights, and blob write on the storage account)
#
# Every test is required: an incomplete environment fails the run. Pull requests
# from forks and from Dependabot get no secrets, so they skip.

name: ci-c-e2e-adu

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'c/src/CMakeLists.txt'
      - 'c/src/sources.cmake'
      - 'c/src/core/**'
      - 'c/src/features/su/**'
      - 'c/inc/azure/iot/*.h'
      - 'c/inc/azure/iot/adapters/**'
      - 'c/adapters/paho/**'
      - 'c/adapters/az_mqtt/**'
      - 'c/adapters/crypto_openssl/**'
      - 'c/adapters/cert_openssl/**'
      - 'c/adapters/su/**'
      - 'c/eng/install-su-delta-processor.sh'
      - 'c/deps/az_mqtt/**'
      - 'c/CMakeLists.txt'
      - 'c/CMakePresets.json'
      - 'c/cmake/**'
      - 'c/tests/CMakeLists.txt'
      - 'c/tests/support/**'
      - 'c/tests/deps/**'
      - 'c/tests/e2e/**'
      - 'c/tests/unit/data/su_delta/**'
      - 'c/eng/e2e-shared-device.ps1'
      - 'c/eng/e2e-trusted-ca.ps1'
      - 'c/eng/collect-coverage.sh'
      - 'c/eng/e2e-mqttv5-adr-namespace.ps1'
      - '.github/workflows/ci-c-e2e-adu.yml'
      - '.github/actions/install-curl-windows/**'
      - '.github/actions/install-openssl/**'
      - '.github/actions/install-su-delta-processor/**'
      - '.github/workflows/ci-c-e2e-mqttv5-adr-namespace.yml'
  schedule:
    - cron: '0 12 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # As in ci-c-e2e-mqttv5.yml: the namespace (and its Software Update link) can
  # drop out of Azure. Not on pull requests, which rely on the scheduled repair
  # (every 10 minutes) in ci-c-e2e-mqttv5-adr-namespace.yml.
  adr-namespace:
    name: ADR namespace
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      id-token: write
    # actionlint 1.7.12 does not accept the $/ self-repository form yet.
    uses: ./.github/workflows/ci-c-e2e-mqttv5-adr-namespace.yml # zizmor: ignore[self-repository]
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

  # Stages the standing offers once per run; each OS leg below reads them.
  offers:
    name: software updates offers
    needs: adr-namespace
    if: >-
      ${{ !cancelled() &&
          (needs.adr-namespace.result == 'success' || needs.adr-namespace.result == 'skipped') &&
          (github.event_name != 'pull_request' ||
           (github.event.pull_request.head.repo.full_name == github.repository &&
            github.actor != 'dependabot[bot]')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write   # azure/login OIDC
    timeout-minutes: 140
    env:
      AZ_IOT_E2E_SU_SUBSCRIPTION_ID: ${{ vars.E2E_MQTTV5_SHARED_SUBSCRIPTION_ID }}
      AZ_IOT_E2E_SU_RESOURCE_GROUP: ${{ vars.E2E_MQTTV5_SHARED_RESOURCE_GROUP }}
      AZ_IOT_E2E_SU_LOCATION: ${{ vars.E2E_MQTTV5_SHARED_LOCATION }}
      AZ_IOT_E2E_SU_ADR_NAMESPACE: ${{ vars.E2E_MQTTV5_SHARED_ADR_NAMESPACE }}
      AZ_IOT_E2E_SU_ADU_ENDPOINT: ${{ vars.E2E_MQTTV5_SHARED_SU_ENDPOINT }}
      AZ_IOT_E2E_SU_STORAGE_ACCOUNT: ${{ vars.E2E_MQTTV5_SHARED_SU_STORAGE_ACCOUNT }}
      AZ_IOT_E2E_SU_STORAGE_CONTAINER: ${{ vars.E2E_MQTTV5_SHARED_SU_STORAGE_CONTAINER }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Azure Login via OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.E2E_MQTTV5_SHARED_SUBSCRIPTION_ID }}

      # Seconds when the offers are staged. Otherwise typically about 11 min; at
      # most 8 x (10 min import + 5 min job) + 10 min to Active + 5 min grace.
      - name: Ensure standing offers
        timeout-minutes: 135
        shell: pwsh
        run: |
          Import-Module ./c/tests/e2e/scripts/SuE2E.psm1
          New-SuE2EOffers -RunId "s$(Get-SuE2EFixtureTag)" -StatePath su-offers.json -Reuse

      # Offer and job names only; the test legs check each device's job results with it.
      - name: Upload the offers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: su-offers
          path: su-offers.json
          retention-days: 1
          if-no-files-found: error

  e2e-su:
    name: software updates e2e (${{ matrix.os-name }})
    needs: offers
    if: ${{ !cancelled() && needs.offers.result == 'success' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write   # azure/login OIDC
    # Above the sum of the step budgets (about 200 min), so every step's own
    # timeout fires first.
    timeout-minutes: 220
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, windows-latest ]
        include:
          # Linux builds instrumented for the combined coverage report.
          - { os: ubuntu-24.04, os-name: linux, os-tag: l, preset: linux-gcc-e2e-coverage }
          - { os: windows-latest, os-name: windows, os-tag: w, preset: windows-msvc-debug }
    env:
      AZ_IOT_PRESET: ${{ matrix.preset }}
      E2E_OS_TAG: ${{ matrix.os-tag }}
      AZ_IOT_E2E_SU_DPS_HOST: ${{ vars.E2E_MQTTV5_SHARED_DPS_HOST }}
      AZ_IOT_E2E_SU_ID_SCOPE: ${{ vars.E2E_MQTTV5_SHARED_ID_SCOPE }}
      AZ_IOT_E2E_SU_SUBSCRIPTION_ID: ${{ vars.E2E_MQTTV5_SHARED_SUBSCRIPTION_ID }}
      AZ_IOT_E2E_SU_RESOURCE_GROUP: ${{ vars.E2E_MQTTV5_SHARED_RESOURCE_GROUP }}
      AZ_IOT_E2E_SU_LOCATION: ${{ vars.E2E_MQTTV5_SHARED_LOCATION }}
      AZ_IOT_E2E_SU_ADR_NAMESPACE: ${{ vars.E2E_MQTTV5_SHARED_ADR_NAMESPACE }}
      AZ_IOT_E2E_SU_ADU_ENDPOINT: ${{ vars.E2E_MQTTV5_SHARED_SU_ENDPOINT }}
      AZ_IOT_E2E_SU_STORAGE_ACCOUNT: ${{ vars.E2E_MQTTV5_SHARED_SU_STORAGE_ACCOUNT }}
      AZ_IOT_E2E_SU_STORAGE_CONTAINER: ${{ vars.E2E_MQTTV5_SHARED_SU_STORAGE_CONTAINER }}
      SU_OFFERS_STATE: ${{ github.workspace }}/su-offers.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      # OpenSSL 4.1.0, as the Windows legs of ci-c-e2e.yml (cached per runner image).
      - name: Install OpenSSL (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/install-openssl # zizmor: ignore[self-repository]
        with:
          version: '4.1.0'

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build libcurl4-openssl-dev
          python3 -m pip install --upgrade 'gcovr==7.2'

      # The real delta processor for the MICROSOFT_DELTA offer (POSIX only, as the
      # reference microsoft/delta:1 handler).
      - name: Install the software updates delta processor (Linux)
        id: su-delta
        if: runner.os == 'Linux'
        timeout-minutes: 5
        # actionlint 1.7.12 does not accept the $/ self-repository form yet.
        uses: ./.github/actions/install-su-delta-processor # zizmor: ignore[self-repository]

      - name: Install libcurl (Windows)
        id: curl
        if: runner.os == 'Windows'
        # actionlint 1.7.12 does not accept the $/ self-repository form yet.
        uses: ./.github/actions/install-curl-windows # zizmor: ignore[self-repository]

      - name: Build
        timeout-minutes: 15
        working-directory: c
        shell: pwsh
        env:
          CMAKE_PREFIX_PATH: ${{ steps.curl.outputs.prefix }}
          SU_DELTA_LIBRARY: ${{ steps.su-delta.outputs.library }}
        run: |
          $delta = if ($IsLinux) { '-DAZ_IOT_WITH_SU_DELTA=ON', "-DAZ_IOT_SU_DELTA_TEST_LIBRARY=$env:SU_DELTA_LIBRARY" } else { @() }
          cmake --preset $env:AZ_IOT_PRESET -DAZ_IOT_BUILD_E2E=ON -DAZ_IOT_WITH_PAHO=ON -DAZ_IOT_WITH_AZ_MQTT=ON -DAZ_IOT_BUILD_E2E_SU=ON @delta
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset $env:AZ_IOT_PRESET --target az_iot_tests_e2e_su az_iot_tests_e2e_su_offer az_iot_tests_e2e_su_az_mqtt az_iot_tests_e2e_su_offer_az_mqtt

      - name: Azure Login via OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.E2E_MQTTV5_SHARED_SUBSCRIPTION_ID }}

      - name: Download the offers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: su-offers
          path: ${{ github.workspace }}

      - name: Export the offer variables
        shell: pwsh
        run: |
          Import-Module ./c/tests/e2e/scripts/SuE2E.psm1
          Export-SuE2EOfferVariables -RunId "s$(Get-SuE2EFixtureTag)"

      # A new device per suite execution: an offer reaches a device once, and the
      # offer suite starts from a device with no registration.
      - name: Issue devices
        shell: pwsh
        env:
          E2E_MQTTV5_SHARED_GROUP_CA: ${{ secrets.E2E_MQTTV5_SHARED_GROUP_CA }}
          E2E_MQTTV5_SHARED_IOTHUB_CS: ${{ secrets.E2E_MQTTV5_SHARED_IOTHUB_SERVICE_CS }}
          E2E_MQTTV5_SHARED_EVENTHUB_CS: ${{ secrets.E2E_MQTTV5_SHARED_EVENTHUB_CS }}
          E2E_MQTTV5_SHARED_ID_SCOPE: ${{ vars.E2E_MQTTV5_SHARED_ID_SCOPE }}
          E2E_MQTTV5_SHARED_DPS_HOST: ${{ vars.E2E_MQTTV5_SHARED_DPS_HOST }}
          RUN_TAG: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'su-devices'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          if (-not $IsWindows) { chmod 700 $dir }
          foreach ($device in 'paho', 'paho-offer', 'az-mqtt', 'az-mqtt-offer') {
            $regId = "ci-su-$device-$env:RUN_TAG-$env:E2E_OS_TAG"
            $config = Join-Path $dir "$device.ps1"
            ./c/eng/e2e-shared-device.ps1 -Prefix E2E_MQTTV5_SHARED -RegistrationId $regId -OutFile $config
            . $config
            [IO.File]::WriteAllBytes((Join-Path $dir "$device-cert.pem"), [Convert]::FromBase64String($env:IOT_DPS_INDIVIDUAL_X509_CERTIFICATE_0))
            [IO.File]::WriteAllBytes((Join-Path $dir "$device-key.pem"), [Convert]::FromBase64String($env:IOT_DPS_INDIVIDUAL_X509_KEY_0))
            Remove-Item $config
            if (-not $IsWindows) { chmod 600 (Join-Path $dir "$device-key.pem") }
            $name = $device.Replace('-', '_').ToUpperInvariant()
            "SU_REG_ID_$name=$regId" | Add-Content -Path $env:GITHUB_ENV
          }
          $ca = ./c/eng/e2e-trusted-ca.ps1 -Path (Join-Path $dir 'trusted-ca.pem')
          "SU_DEVICES=$dir", "AZ_IOT_E2E_SU_TRUSTED_CA=$ca" | Add-Content -Path $env:GITHUB_ENV

      # Per adapter: e2e_su (10 min budget), then e2e_su_offer (65 min: 8 offers x
      # (90 s check + 300 s workflow), plus the scenarios without an offer and
      # setup), each on its own device.
      - name: Run software updates e2e
        timeout-minutes: 160
        shell: pwsh
        env:
          AZ_IOT_CURL_PREFIX: ${{ steps.curl.outputs.prefix }}
        run: |
          if ($env:AZ_IOT_CURL_PREFIX) {
            $env:PATH = "$env:AZ_IOT_CURL_PREFIX\debug\bin;$env:AZ_IOT_CURL_PREFIX\bin;$env:PATH"
          }
          New-Item -ItemType Directory -Force -Path results | Out-Null
          $failed = @()
          foreach ($adapter in 'paho', 'az_mqtt') {
            $suffix = if ($adapter -eq 'paho') { '' } else { '_az_mqtt' }
            $device = $adapter.Replace('_', '-')
            foreach ($suite in @(@{ Name = 'su'; Device = $device; Timeout = 600 },
                                 @{ Name = 'su_offer'; Device = "$device-offer"; Timeout = 3900 })) {
              $test = "az_iot_tests_e2e_$($suite.Name)$suffix"
              $env:AZ_IOT_E2E_SU_REG_ID = [Environment]::GetEnvironmentVariable(
                'SU_REG_ID_' + $suite.Device.Replace('-', '_').ToUpperInvariant())
              $env:AZ_IOT_E2E_SU_CERT = Join-Path $env:SU_DEVICES "$($suite.Device)-cert.pem"
              $env:AZ_IOT_E2E_SU_KEY = Join-Path $env:SU_DEVICES "$($suite.Device)-key.pem"
              ctest --test-dir "c/build/$($env:AZ_IOT_PRESET)" -C Debug -R "^$test$" `
                --verbose --no-tests=error --timeout $suite.Timeout `
                --output-junit (Join-Path $env:GITHUB_WORKSPACE "results/$test-$($env:E2E_OS_TAG).xml")
              if ($LASTEXITCODE -ne 0) { $failed += $test }
            }
          }
          if ($failed) { throw "failed: $($failed -join ', ')" }

      - name: Check job results
        if: ${{ !cancelled() }}
        timeout-minutes: 25
        shell: pwsh
        run: |
          Import-Module ./c/tests/e2e/scripts/SuE2E.psm1
          $failed = @()
          # The reference microsoft/delta:1 handler is POSIX only.
          $skip = if ($IsWindows) { @('MICROSOFT_DELTA') } else { @() }
          foreach ($regId in $env:SU_REG_ID_PAHO_OFFER, $env:SU_REG_ID_AZ_MQTT_OFFER) {
            Write-Host "== $regId"
            try { Test-SuE2EOffers -StatePath $env:SU_OFFERS_STATE -RegistrationId $regId -Skip $skip }
            catch { Write-Host "::error::$regId`: $_"; $failed += $regId }
          }
          if ($failed) { exit 1 }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-su-results-${{ matrix.os-name }}
          path: results/*.xml
          if-no-files-found: ignore

      - name: Collect coverage
        # Not `if: always()`: a failed run leaves partial .gcda, which would
        # understate coverage for an unrelated reason.
        if: runner.os == 'Linux' && success()
        working-directory: c
        run: bash eng/collect-coverage.sh build/linux-gcc-e2e-coverage coverage/e2e-adu.json e2e-adu

      - name: Upload coverage tracefile
        if: runner.os == 'Linux' && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-trace-e2e-adu
          path: c/coverage/e2e-adu.json
          if-no-files-found: error
