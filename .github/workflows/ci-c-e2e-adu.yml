# End-to-end software updates tests for the C SDK, against the real service.
#
# Runs both software updates suites (`ctest -R e2e_su`):
#   az_iot_tests_e2e_su        the DPS channel, with no update offered
#   az_iot_tests_e2e_su_offer  offered updates through the whole client
#
# Every test is required: an incomplete environment fails the run.
#
# Stages (one job, so the device, its offers and their checks share one
# environment):
#   1. stage one offer per scenario       (c/tests/e2e/scripts/SuE2E.psm1)
#   2. run the device suites
#   3. check what the service recorded for each offer
#   4. always delete the offers
#
# Environment. E2E-PLACEHOLDER: runs against a standing environment described
# by the repository variables and secrets below, until the shared provisioning
# action can create one (DPS + ADR namespace + Device Update instance, linked):
#   vars:    E2E_SU_SUBSCRIPTION_ID, E2E_SU_DPS_HOST, E2E_SU_ID_SCOPE, E2E_SU_REG_ID,
#            E2E_SU_RESOURCE_GROUP, E2E_SU_LOCATION, E2E_SU_ADR_NAMESPACE, E2E_SU_ADU_ENDPOINT,
#            E2E_SU_STORAGE_ACCOUNT, E2E_SU_STORAGE_CONTAINER, E2E_SU_ARM_ENDPOINT (optional)
#   secrets: E2E_SU_DEVICE_CERT_PEM_B64, E2E_SU_DEVICE_KEY_PEM_B64 (X.509 of E2E_SU_REG_ID),
#            AZURE_CLIENT_ID, AZURE_TENANT_ID (OIDC; needs ADR job and Device Update
#            import rights, and blob write on the storage account)
#   The environment's subscription is its own variable, not the shared
#   AZURE_SUBSCRIPTION_ID secret, so it can differ from the other e2e workflows'.

name: ci-c-e2e-adu

on:
  workflow_dispatch:
  # E2E-PLACEHOLDER: add a schedule (and/or pull_request paths) once the
  # environment above exists.

# One run at a time: every run uses the same device, and two sessions for one
# device identity disconnect each other.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # azure/login OIDC

jobs:
  e2e-su:
    name: software updates e2e (linux)
    runs-on: ubuntu-24.04
    # Above the sum of the step budgets (215 min), so the always() cleanup runs.
    timeout-minutes: 240
    env:
      AZ_IOT_E2E_SU_DPS_HOST: ${{ vars.E2E_SU_DPS_HOST }}
      AZ_IOT_E2E_SU_ID_SCOPE: ${{ vars.E2E_SU_ID_SCOPE }}
      AZ_IOT_E2E_SU_REG_ID: ${{ vars.E2E_SU_REG_ID }}
      AZ_IOT_E2E_SU_SUBSCRIPTION_ID: ${{ vars.E2E_SU_SUBSCRIPTION_ID }}
      AZ_IOT_E2E_SU_RESOURCE_GROUP: ${{ vars.E2E_SU_RESOURCE_GROUP }}
      AZ_IOT_E2E_SU_LOCATION: ${{ vars.E2E_SU_LOCATION }}
      AZ_IOT_E2E_SU_ADR_NAMESPACE: ${{ vars.E2E_SU_ADR_NAMESPACE }}
      AZ_IOT_E2E_SU_ADU_ENDPOINT: ${{ vars.E2E_SU_ADU_ENDPOINT }}
      AZ_IOT_E2E_SU_STORAGE_ACCOUNT: ${{ vars.E2E_SU_STORAGE_ACCOUNT }}
      AZ_IOT_E2E_SU_STORAGE_CONTAINER: ${{ vars.E2E_SU_STORAGE_CONTAINER }}
      AZ_IOT_E2E_SU_ARM_ENDPOINT: ${{ vars.E2E_SU_ARM_ENDPOINT }}
      SU_OFFERS_STATE: ${{ github.workspace }}/su-offers.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build libcurl4-openssl-dev
          python3 -m pip install --upgrade 'gcovr==7.2'

      # Built instrumented so the run feeds the combined coverage report.
      - name: Build
        timeout-minutes: 30
        working-directory: c
        run: |
          cmake --preset linux-gcc-e2e-coverage -DAZ_IOT_WITH_PAHO=ON -DAZ_IOT_BUILD_E2E_SU=ON
          cmake --build --preset linux-gcc-e2e-coverage --target az_iot_tests_e2e_su az_iot_tests_e2e_su_offer

      - name: Materialize device credential
        env:
          CERT_B64: ${{ secrets.E2E_SU_DEVICE_CERT_PEM_B64 }}
          KEY_B64: ${{ secrets.E2E_SU_DEVICE_KEY_PEM_B64 }}
        run: |
          dir="$RUNNER_TEMP/su-device"
          mkdir -p "$dir"
          chmod 700 "$dir"
          printf '%s' "$CERT_B64" | base64 -d > "$dir/cert.pem"
          printf '%s' "$KEY_B64" | base64 -d > "$dir/key.pem"
          chmod 600 "$dir"/*.pem
          {
            echo "AZ_IOT_E2E_SU_CERT=$dir/cert.pem"
            echo "AZ_IOT_E2E_SU_KEY=$dir/key.pem"
            echo "AZ_IOT_E2E_SU_TRUSTED_CA=/etc/ssl/certs/ca-certificates.crt"
          } >> "$GITHUB_ENV"

      - name: Azure Login via OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.E2E_SU_SUBSCRIPTION_ID }}

      - name: Stage offers
        timeout-minutes: 70
        shell: pwsh
        run: |
          Import-Module ./c/tests/e2e/scripts/SuE2E.psm1
          New-SuE2EOffers -RunId "${{ github.run_id }}${{ github.run_attempt }}" -StatePath $env:SU_OFFERS_STATE

      - name: Run software updates e2e
        timeout-minutes: 50
        run: |
          mkdir -p results
          ctest --test-dir c/build/linux-gcc-e2e-coverage -R e2e_su \
            --verbose --no-tests=error --timeout 2700 \
            --output-junit "$GITHUB_WORKSPACE/results/e2e-su.xml"

      - name: Check job results
        timeout-minutes: 15
        shell: pwsh
        run: |
          Import-Module ./c/tests/e2e/scripts/SuE2E.psm1
          Test-SuE2EOffers -StatePath $env:SU_OFFERS_STATE -RegistrationId $env:AZ_IOT_E2E_SU_REG_ID

      - name: Remove offers
        if: always()
        timeout-minutes: 50
        shell: pwsh
        run: |
          Import-Module ./c/tests/e2e/scripts/SuE2E.psm1
          Remove-SuE2EOffers -StatePath $env:SU_OFFERS_STATE

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-su-results
          path: results/*.xml
          if-no-files-found: ignore

      - name: Collect coverage
        # Not `if: always()`: a failed run leaves partial .gcda, which would
        # understate coverage for an unrelated reason.
        if: success()
        working-directory: c
        run: bash eng/collect-coverage.sh build/linux-gcc-e2e-coverage coverage/e2e-adu.json e2e-adu

      - name: Upload coverage tracefile
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-trace-e2e-adu
          path: c/coverage/e2e-adu.json
          if-no-files-found: error
