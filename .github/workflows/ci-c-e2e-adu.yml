# End-to-end Device Update (ADU) tests for the C SDK.
#
# This is the slow counterpart to ci-c-e2e.yml. It is kept separate because the
# Azure Device Update service takes ~25 min to provision, so it must NOT gate
# the fast feedback loop. It runs:
#   * on PRs that touch ADU code paths (native `paths` filter below),
#   * nightly (regression), and
#   * on manual dispatch.
#
# Architecture
# ------------
# * Device side  : the native `az_iot_e2e_agent` (built by CMake) provisions via
#                  DPS (x509 individual enrollment) and runs the ADU scenario.
# * Service side : a dotnet harness (c/tests/e2e/driver) reuses the
#                  Microsoft.Azure.Devices service client + 'az iot du' to drive
#                  and verify the update. It launches the agent.
# * Resources    : provisioned per run via the shared iot-sdks-e2e-fx script
#                  (with -EnableADU Gen1) and ALWAYS torn down.
#
# Stages
# ------
# Resources (incl. the Device Update account/instance) are provisioned EXACTLY
# ONCE and shared by every test leg:
#   1. setup    : provision the resource group (with ADU Gen1) + emit the
#                 test-config script ONCE (via the reusable provision-e2e-
#                 resources step), publish it as an artifact, and expose the
#                 resource-group name.
#   2. test     : the Windows AND Linux test legs (matrix). Each builds its own
#                 agent, downloads the shared test-config, logs in to Azure (ADU
#                 scenarios call `az iot du`), and runs Category=Adu.
#   3. teardown : always() deletes the shared resource group (via the reusable
#                 destroy-e2e-resources step).
#
# The provision/destroy steps live in .github/actions/{provision,destroy}-e2e-
# resources so other pipelines (e.g. ci-dotnet) can reuse them.

name: ci-c-e2e-adu

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'c/src/features/adu/**'
      - 'c/adapters/adu/**'
      - 'c/inc/azure/iot/az_iot_adu.h'
      - 'c/samples/adu/**'
  schedule:
    - cron: '30 11 * * *'  # Nightly at 4:30am PST (offset from the fast workflow)

# Cancel superseded runs on the same ref to avoid leaking parallel resource groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write   # required for azure/login OIDC

jobs:
  setup:
    name: setup (provision)
    runs-on: ubuntu-latest
    # ADU service provisioning is slow (~25 min); give the setup ample headroom.
    timeout-minutes: 60
    outputs:
      rg: ${{ steps.provision.outputs.resource-group }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Provision resources (with ADU Gen1)
        id: provision
        uses: ./.github/actions/provision-e2e-resources
        with:
          rg-prefix: CSDKE2EAdu-
          enable-adu: Gen1

      - name: Upload test config
        uses: actions/upload-artifact@v4
        with:
          name: e2e-adu-test-config
          path: test_config/set_test_env_vars.ps1
          retention-days: 1
          if-no-files-found: error

  test:
    name: ${{ matrix.os }}
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: linux-gcc-debug
            agent_glob: c/build/linux-gcc-debug/tests/e2e/az_iot_e2e_agent
          - os: windows-latest
            preset: windows-msvc-debug
            agent_glob: c/build/windows-msvc-debug/tests/e2e/Debug/az_iot_e2e_agent.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Build e2e device agent
        working-directory: c
        run: |
          cmake --preset ${{ matrix.preset }} -DAZ_IOT_BUILD_E2E=ON -DAZ_IOT_WITH_PAHO=ON
          cmake --build --preset ${{ matrix.preset }} ${{ runner.os == 'Windows' && '--config Debug' || '' }} --target az_iot_e2e_agent

      - name: Locate agent binary
        shell: pwsh
        run: |
          $path = "${{ matrix.agent_glob }}"
          if (-not (Test-Path $path)) { throw "agent binary not found at $path" }
          $full = (Resolve-Path $path).Path
          "AZ_IOT_E2E_AGENT_PATH=$full" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Download shared test config
        uses: actions/download-artifact@v4
        with:
          name: e2e-adu-test-config
          path: test_config

      # ADU scenarios trigger updates via 'az iot du', which needs Azure auth.
      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run ADU e2e
        shell: pwsh
        run: |
          . ./test_config/set_test_env_vars.ps1
          dotnet test ./c/tests/e2e/driver/Azure.Iot.Sdk.C.E2E.csproj `
            --filter "Category=Adu" `
            --logger "trx;LogFileName=e2e-adu-${{ matrix.os }}.trx" `
            --results-directory ./test_config/results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-adu-results-${{ matrix.os }}
          path: ./test_config/results/**/*.trx
          if-no-files-found: ignore

  teardown:
    name: teardown (delete resources)
    needs: [setup, test]
    if: always() && needs.setup.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Delete Azure resources
        uses: ./.github/actions/destroy-e2e-resources
        with:
          resource-group: ${{ needs.setup.outputs.rg }}
