# End-to-end Device Update (ADU) tests for the C SDK.
#
# PARKED -- AWAITING THE ADUv2 e2e SUITE
# --------------------------------------
# The suite this workflow ran (az_iot_tests_e2e_adu) drove a deployment through a
# twin desired-property PATCH. That delivery channel has been removed: ADU is now
# driven through an az_iot_adu_channel, so the target no longer builds and the
# trigger it depended on has no equivalent until the new channel lands.
#
# The workflow is PARKED rather than deleted, so that the coverage gap between
# the removal and the rewrite stays visible instead of quietly disappearing from
# the pipeline list. Automatic triggers (pull_request paths, nightly schedule)
# are removed so it does not fail on every ADU change; workflow_dispatch is kept
# so the wiring can still be exercised by hand once the suite is restored.
#
# To restore: rewrite the scenarios against the new channel operations, re-enable
# the CMake target (-DAZ_IOT_BUILD_E2E_ADU_V2=ON, see c/tests/e2e/CMakeLists.txt),
# and put the pull_request/schedule triggers back.
#
# The device fixture and the mocked crypto/payload hooks in the existing test
# file carry over unchanged -- they are the expensive part and are deliberately
# kept.
#
# Architecture (unchanged, for whoever restores this)
# ---------------------------------------------------
# Fully in-process: the ADU scenario runs as a native CTest. Crypto and the
# platform payload operations are mocked; signature/hash correctness is covered
# by the unit tests (adu_client_test.c and the adu_crypto_openssl unit tests).
#
# Stages
# ------
# Resources are provisioned EXACTLY ONCE by the setup job and shared by both
# test legs; teardown always() deletes them. The provision/destroy steps are the
# shared composite actions Azure/iot-sdks-e2e-fx/actions/{provision,destroy}-e2e-
# resources, pinned to a tag.

name: ci-c-e2e-adu

on:
  workflow_dispatch:

# Cancel superseded runs on the same ref to avoid leaking parallel resource groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write   # required for azure/login OIDC

# Resource group name derived from the RUN, not from a random GUID published as a
# job output. A CANCELLED job does not propagate its `outputs`, so a teardown that
# reads `needs.setup.outputs.rg` receives an empty string and silently deletes
# nothing while the group stays behind. Both setup and teardown compute this name
# independently, so teardown never depends on setup completing.
env:
  E2E_RESOURCE_GROUP: CSDKE2EAdu-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  setup:
    name: setup (provision)
    runs-on: ubuntu-latest
    # Headroom for the real-ADU account/instance provisioning that the real-ADU
    # suite will add (slow). The current mocked placeholder provisions only the
    # base resources and finishes quickly.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # `enable-adu: Gen1` is wired through for the future real-ADU suite but is
      # currently a NO-OP: the shared provisioning script does not yet create a
      # Device Update account. It is kept so the switch is ready when that lands.
      - name: Provision resources
        id: provision
        uses: Azure/iot-sdks-e2e-fx/actions/provision-e2e-resources@v1
        with:
          rg-name: ${{ env.E2E_RESOURCE_GROUP }}
          # The shared action defaults to EastUS; these pipelines run in
          # eastus2euap, the region this subscription's IoT Hub scale unit is
          # pinned to -- a hub created anywhere else is rejected with IH400059.
          # An undefined repository variable arrives as an empty string, which
          # would otherwise override the action default, so the fallback is here.
          azure-location: ${{ vars.E2E_AZURE_LOCATION || 'eastus2euap' }}
          enable-adu: Gen1
          # Two DPS enrollments so the parallel Linux/Windows test legs can each
          # claim their own device (see the per-leg device-index selection below)
          # and never share a device twin.
          dps-x509-individual-enrollments: '2'

      - name: Upload test config
        uses: actions/upload-artifact@v4
        with:
          name: e2e-adu-test-config
          path: test_config/set_test_env_vars.ps1
          retention-days: 1
          if-no-files-found: error

  test:
    name: ${{ matrix.os }}
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds instrumented so this run feeds the combined coverage
          # report; see the note in ci-c-e2e.yml.
          - os: ubuntu-latest
            preset: linux-gcc-e2e-coverage
            device-index: 0
          - os: windows-latest
            preset: windows-msvc-debug
            device-index: 1
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install ninja (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          python3 -m pip install --upgrade 'gcovr==7.2'

      - name: Build ADU e2e test
        working-directory: c
        run: |
          cmake --preset ${{ matrix.preset }} -DAZ_IOT_BUILD_E2E=ON -DAZ_IOT_WITH_PAHO=ON
          cmake --build --preset ${{ matrix.preset }} ${{ runner.os == 'Windows' && '--config Debug' || '' }} --target az_iot_tests_e2e_adu

      - name: Download shared test config
        uses: actions/download-artifact@v4
        with:
          name: e2e-adu-test-config
          path: test_config

      - name: Run ADU e2e
        shell: pwsh
        run: |
          # Service-side config (IOTHUB_*, IOT_DPS_*) is set by the generated script.
          . ./test_config/set_test_env_vars.ps1

          # Select this leg's device. Two DPS enrollments are provisioned; the
          # Linux and Windows legs each claim a DISTINCT one (via matrix
          # device-index) so they never share a device twin. Fall back to the
          # unsuffixed index-0 vars if the pinned provisioning action emits a
          # pre-indexing test config.
          $idx = '${{ matrix.device-index }}'
          $regId   = (Get-Item "env:IOT_DPS_INDIVIDUAL_REGISTRATION_ID_$idx" -ErrorAction SilentlyContinue).Value
          $certB64 = (Get-Item "env:IOT_DPS_INDIVIDUAL_X509_CERTIFICATE_$idx" -ErrorAction SilentlyContinue).Value
          $keyB64  = (Get-Item "env:IOT_DPS_INDIVIDUAL_X509_KEY_$idx" -ErrorAction SilentlyContinue).Value
          if (-not $regId -or -not $certB64 -or -not $keyB64) {
            Write-Host "Indexed device $idx not available; using the shared index-0 device."
            $regId   = $env:IOT_DPS_INDIVIDUAL_REGISTRATION_ID
            $certB64 = $env:IOT_DPS_INDIVIDUAL_X509_CERTIFICATE
            $keyB64  = $env:IOT_DPS_INDIVIDUAL_X509_KEY
          }
          Write-Host "e2e device (index $idx): $regId"

          # Materialize the device X.509 material to files. The in-process test
          # reads cert/key/CA by PATH, so CI decodes the base64 PEMs and builds a
          # CA trust bundle here (no network download).
          $dir = Join-Path ([System.IO.Path]::GetTempPath()) ("az-iot-c-e2e-adu-" + [Guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $certPath = Join-Path $dir "device-cert.pem"
          $keyPath  = Join-Path $dir "device-key.pem"
          $caPath   = Join-Path $dir "trusted-ca.pem"

          [System.IO.File]::WriteAllText($certPath,
            [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($certB64)))
          [System.IO.File]::WriteAllText($keyPath,
            [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($keyB64)))

          if ($IsLinux -and (Test-Path "/etc/ssl/certs/ca-certificates.crt")) {
            Copy-Item "/etc/ssl/certs/ca-certificates.crt" $caPath
          }
          else {
            # Export the machine + user Root stores as a PEM bundle.
            $sb = New-Object System.Text.StringBuilder
            foreach ($loc in @('LocalMachine', 'CurrentUser')) {
              $store = New-Object System.Security.Cryptography.X509Certificates.X509Store('Root', $loc)
              $store.Open('ReadOnly')
              foreach ($c in $store.Certificates) { [void]$sb.AppendLine($c.ExportCertificatePem()) }
              $store.Close()
            }
            [System.IO.File]::WriteAllText($caPath, $sb.ToString())
          }

          # Map the config's DPS vars onto the names the test consumes.
          $env:AZ_IOT_DPS_ID_SCOPE        = $env:IOT_DPS_ID_SCOPE
          $env:AZ_IOT_DPS_REGISTRATION_ID = $regId
          $env:AZ_IOT_CLIENT_CERT         = $certPath
          $env:AZ_IOT_CLIENT_KEY          = $keyPath
          $env:AZ_IOT_TRUSTED_CA          = $caPath
          if ($env:IOT_DPS_GLOBAL_ENDPOINT) { $env:AZ_IOT_DPS_GLOBAL_ENDPOINT = $env:IOT_DPS_GLOBAL_ENDPOINT }

          New-Item -ItemType Directory -Path ./test_config/results -Force | Out-Null
          $cfg = if ($IsWindows) { @('-C', 'Debug') } else { @() }
          # `-R e2e_adu` selects ONLY az_iot_tests_e2e_adu (not the fast e2e
          # suite az_iot_tests_e2e, nor the adu_crypto_openssl unit test).
          ctest --test-dir c/build/${{ matrix.preset }} @cfg -R e2e_adu `
            --verbose --no-tests=error --timeout 900 `
            --output-junit ./test_config/results/e2e-adu-${{ matrix.os }}.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-adu-results-${{ matrix.os }}
          path: ./test_config/results/**/*.xml
          if-no-files-found: ignore

      - name: Collect coverage (Linux)
        # Not `if: always()` -- a failed run leaves partial or absent .gcda, and
        # merging that would understate coverage for an unrelated reason.
        if: runner.os == 'Linux' && success()
        working-directory: c
        run: bash eng/collect-coverage.sh build/linux-gcc-e2e-coverage coverage/e2e-adu.json e2e-adu

      - name: Upload coverage tracefile (Linux)
        if: runner.os == 'Linux' && success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-trace-e2e-adu
          path: c/coverage/e2e-adu.json
          if-no-files-found: error

  teardown:
    name: teardown (delete resources)
    needs: [setup, test]
    # `always()` also covers cancellation. The group name comes from the workflow
    # `env` (not from `needs.setup.outputs`), so a cancelled setup still gets torn
    # down; the destroy action no-ops when the group was never created.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Delete Azure resources
        uses: Azure/iot-sdks-e2e-fx/actions/destroy-e2e-resources@v1
        with:
          resource-group: ${{ env.E2E_RESOURCE_GROUP }}
